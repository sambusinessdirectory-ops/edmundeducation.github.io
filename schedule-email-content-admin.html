<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes,viewport-fit=cover">
  <meta name="description" content="EdmundEducation 功課系統管理員 Email 內容設計">
  <meta name="theme-color" content="#35530a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="EdmundEducation">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="robots" content="noindex,nofollow">
  <title>Email 內容設計 | EdmundEducation</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="48x48" href="/assets/icons/favicon-48x48.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="167x167" href="/assets/icons/apple-touch-icon-167x167.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/assets/icons/apple-touch-icon-152x152.png">
  <link rel="stylesheet" href="/pwa-ui.css">
  <link rel="stylesheet" href="schedule-email-admin.css?v=20260822-gmail1">
  <script defer src="/pwa-register.js"></script>
</head>
<body>
  <header class="header"><div class="header-inner"><a class="brand" href="schedule-system.html"><img src="Company Logo for Cover Page.png" alt="">Homework Admin</a><a class="back" href="schedule-email-log-admin.html">Email Log →</a></div></header>
  <main>
    <section class="hero"><p class="eyebrow">PRIVATE EMAIL DESIGNER</p><h1>Email 內容設計</h1><p>每封信會自動以 <strong>Hi（帳戶名稱）</strong> 開始。</p></section>
    <section class="panel" data-gate>正在驗證管理員登入…</section>
    <section data-app hidden>
      <p class="transport" data-transport>正在檢查 Gmail 連線…</p>
      <section class="panel sender-panel">
        <div><p class="eyebrow">GMAIL SENDER</p><h2>寄件 Gmail</h2><p class="helper">輸入並儲存地址後，按「連接 Gmail」完成 Google 授權。更改地址會安全地中斷舊連線。</p></div>
        <div class="sender-form"><label>寄件電郵<input type="email" value="edmundeducationedu@gmail.com" autocomplete="email" data-sender-email></label><div class="button-row"><button class="secondary" type="button" data-save-sender>儲存／更新</button><button class="primary" type="button" data-connect-gmail>連接 Gmail</button><button class="danger-text" type="button" data-disconnect-gmail hidden>中斷連線</button></div><p class="connection-detail" data-connection-detail></p></div>
      </section>
      <section class="panel"><h2>帳戶與提醒電郵</h2><div class="table-wrap"><table><thead><tr><th>帳戶</th><th>電郵</th></tr></thead><tbody data-directory></tbody></table></div></section>
      <div class="message-toolbar"><div><p class="eyebrow">EMAIL MESSAGES</p><h2>訊息</h2></div><button class="primary" type="button" data-add-template>＋ 新增一個訊息</button></div>
      <section class="template-grid" data-templates></section>
      <p class="status" data-status role="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.8/dist/umd/supabase.js" integrity="sha384-M65KxMm/JqBppck6onbmAgPVMBHrmPCf1L17Q+71EcvI9/VVI8j5cqoxQf6lj6h2" crossorigin="anonymous"></script>
  <script src="supabase-config.js"></script>
  <script src="schedule-system-config.js"></script>
  <script type="module" src="schedule-email-content-admin.js?v=20260822-gmail2"></script>
</body>
</html>
