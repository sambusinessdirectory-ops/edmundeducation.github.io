q": "Course Provider:Pinafore Solutions", "a": "提供者名稱屬官方 9.1 的推薦內容，不能只標為「背景提示」。", "state": "CURRENT", "topic": 2}, {"stage": 3, "p": 9, "leaf": 9, "t": 5, "q": "1. Advanced Fire Safety", "a": "管理層、防火計劃與 fire marshal 重點較窄；不及全員實用的 Hazard Awareness。", "state": "REJECT", "topic": 2}, {"stage": 3, "p": 9, "leaf": 9, "t": 2, "q": "2. Hazard Awareness", "a": "選用防火及廚房安全課程；保留滅火筒和暢通走火通道兩項技能。", "state": "CURRENT", "topic": 2}, {"stage": 3, "p": 9, "leaf": 9, "t": 5, "q": "Our most popular course: see how to handle raw food and cook at a safe temperature. AFH approval pending!", "a": "AFH 待批不等於 HAB 認可；後來評語更指出導師失去 HAB 認可。", "state": "REJECT", "topic": 2}, {"stage": 3, "p": 9, "leaf": 9, "t": 5, "q": "We run training sessions for the modern adventurous chef. All instructors are HAB approved.", "a": "所有導師具 HAB 認可，符合公司食品衞生政策；支持選擇 The Chef’s Special。", "state": "CURRENT", "topic": 2}, {"stage": 3, "p": 9, "leaf": 9, "t": 2, "q": "A: The Chef’s Special", "a": "交叉污染、安全烹調溫度與食物安全廚房三點可轉化為工作裨益。", "state": "CURRENT", "topic": 2}, {"stage": 3, "p": 9, "leaf": 9, "t": 5, "q": "B: The Fire Chef’s Manual", "a": "露天／營火重點較不切合一般室內廚房需要；不是最佳三選之一。", "state": "REJECT", "topic": 2}, {"stage": 3, "p": 9, "leaf": 9, "t": 2, "q": "Course Provider:PR Productions", "a": "提供者名稱是官方 9.5 所需資訊；社交媒體方向由課程說明補足。", "state": "CURRENT", "topic": 2}, {"stage": 3, "p": 9, "leaf": 9, "t": 2, "q": "Option 1: Be Your Best!", "a": "課程與提供者、清楚表達及避免網上誤解／冒犯，均可直接用於 Task 9。", "state": "CURRENT", "topic": 2}, {"stage": 3, "p": 9, "leaf": 9, "t": 5, "q": "Option 2: Maximise My Money", "a": "重點是品牌盈利，不是當下迫切的清楚溝通需要。", "state": "REJECT", "topic": 2}, {"stage": 3, "p": 10, "leaf": 10, "t": 5, "q": "I loved, loved, loved this course. They went through everything, in lots of great detail. As a newly-trained chef, this is going to be a massive benefit to me. A bit of a shame that the instructors lost their HAB approval (they’re switching to AFH — the Association of Food Health — next year), but still totally worthwhile as they knew what they were doing.", "a": "評語揭示導師失去 HAB 認可；正面感受不能推翻公司政策。", "state": "REJECT", "topic": 2}, {"stage": 3, "p": 10, "leaf": 10, "t": 4, "q": "The instructors gave out some really interesting tips on food safety. Although I liked the course, I thought it was a bit too short. It would have been better to have some time for questions at the end.", "a": "可記錄參加者讚賞，但課程仍不符合 HAB 條件，不列入三項推薦。", "state": "ATTRIBUTED", "topic": 2}, {"stage": 3, "p": 10, "leaf": 10, "t": 4, "q": "What a fab day! Great tips on how to have a food-safe kitchen. It mostly deals with work settings, though, so nothing I could use at home. Still, it will definitely have its uses in my cooking career as it comes with a professional qualification.", "a": "食安貼士與專業資格是參加者說法；可作輔助例子，不是官方必須分點或普遍保證。", "state": "ATTRIBUTED", "topic": 2}, {"stage": 3, "p": 10, "leaf": 10, "t": 4, "q": "I was feeling really under the weather that day and my mum said I shouldn’t go, but I’m really glad I did in the end as this course has something for everyone, not just chefs. Perseverance really pays off in so many areas of life!", "a": "一位參加者認為課程適合不同員工；不能推論「所有員工都一定適合」。", "state": "ATTRIBUTED", "topic": 2}, {"stage": 3, "p": 10, "leaf": 10, "t": 5, "q": "This was awesome. Jake, the instructor, was super knowledgeable and answered all my questions. He’s a surfer, just like me, so it was really useful to learn about cooking on the beach over an open-air fire. Paradise! My buddy Steve says he thought it was a waste of time because he works at an indoor kitchen. I told him to change jobs! Ha!", "a": "室內廚房員工覺得不切合，是選課反證；不可推論公司所有員工只在室內工作。", "state": "REJECT", "topic": 2}, {"stage": 3, "p": 10, "leaf": 10, "t": 5, "q": "Lots of information, but it’s really only for management-level staff, not for everyone, even though that’s not clear in the course description. I actually fell asleep in the boring online sessions. Must do better, Pinafore Solutions!", "a": "評語指向管理層及長時間講座；與全員需要較不吻合。", "state": "REJECT", "topic": 2}, {"stage": 3, "p": 10, "leaf": , "refs": [], "used": [16], "pattern": "One lucky voter"}, {"stage": 4, "p": 17, "t": 3, "q": "FlyingFood will deliver it by drone straight to the winner’s door.", "a": "主動句明確指出運送公司、無人機及送達地點。", "refs": [], "used": [17], "pattern": "will deliver"}, {"stage": 4, "p": 17, "t": 3, "q": "Viewer’s Choice - the show you help create.", "a": "用簡短口號回扣觀眾參與。", "refs": [], "used": [], "pattern": "the show you help create"}, {"stage": 4, "p": 17, "t": 3, "q": "Watch and vote!", "a": "兩個並列祈使動詞收結，適合旁白讀出。", "refs": [], "used": [], "pattern": "Watch and vote"}], names=['任務指示','資料分類','聆聽錄音','逐句取證','三篇寫作'],inks=['transparent','#77e7e7','#fff264','#eca3ad','#aeeca4','#b9e7aa','transparent'];let i=0;const E=id=>document.getElementById(id);const stage=E('stage');names.forEach((v,j)=>stage.add(new Option(v,j)));function render(){let r=rows[i];stage.value=r.stage;E('count').textContent=(i+1)+' / '+rows.length;E('meta').textContent='教材第 '+r.p+' 頁 · '+(r.t?'類型 '+r.t:'原頁導讀');E('q').textContent=r.q||'對照右方原頁';E('q').style.background=inks[r.t];E('q').className=r.t===6?'noise':'';E('a').textContent=r.a;let url='benchmark.pdf#page='+r.p;E('open').href=url;E('title').textContent=names[r.stage]+' · 第 '+r.p+' 頁';E('prev').disabled=!i;E('next').disabled=i===rows.length-1;E('draft').hidden=!r.draft;if(r.draft){E('draft').value=readerStore23.getItem('2023-draft-'+r.t)||'';E('draft').oninput=e=>readerStore23.setItem('2023-draft-'+r.t,e.target.value)}E('refs').replaceChildren();for(const p of r.refs||[]){let b=document.createElement('button');b.textContent='核對相關頁 '+p;b.onclick=()=>{window.open('benchmark.pdf#page='+p,'_blank','noopener')};E('refs').append(b)}E('bank').replaceChildren();for(let t=1;t<=3;t++){let d=document.createElement('details'),s=document.createElement('summary');s.textContent='Task '+(7+t);d.open=r.stage===4&&t===r.t;d.append(s);for(const x of rows.slice(0,i).filter(x=>x.stage>=2&&x.stage<=3&&x.t===t)){let b=document.createElement('button');b.textContent='教材 '+x.p+' · '+(x.q||x.a).slice(0,58);b.onclick=()=>{window.open('benchmark.pdf#page='+x.p,'_blank','noopener')};d.append(b)}E('bank').append(d)}}stage.onchange=()=>{i=rows.findIndex(x=>x.stage==+stage.value);render()};E('prev').onclick=()=>{i--;render()};E('next').onclick=()=>{i++;render()};const facts=[[1, 5, "The floor is flooded", "The floor is flooded", "水浸屬真錯誤。公告先承認事實。"], [1, 7, "I forgot to turn off the tap!", "manual one", "新水龍頭要手動關閉；用這點解釋原因。"], [1, 7, "I cut out the parts where I cleaned everything!", "edited", "聊天證實剪走清潔片段。洗手細節須合讀評分指引。"], [1, 7, "I used a clean one!", "clean towel", "茶巾外觀相同，不代表是同一條。"], [1, 7, "I have 150 of the same kind!", "150 towels", "保留數目，解釋觀眾為何誤會。"], [1, 5, "the science of cutting onions", "chopping onions", "文章交代切洋蔥；流眼水原因須合讀會議資料。"], [2, 9, "how to use a fire extinguisher and moves on to how to keep fire exits clear", "fire extinguisher", "把課程技能連到員工日常工作。"], [2, 9, "All instructors are HAB approved.", "HAB-approved", "Dante 要求導師有 HAB 認可。"], [2, 9, "avoiding cross-contamination", "cross-contamination", "課程內容支持選擇 The Chef’s Special。"], [2, 9, "safe cooking temperatures", "safe cooking", "第二項技能是安全烹調溫度。"], [2, 9, "the art of only saying what you mean and meaning what you say", "communicate clearly", "轉述課程如何減少網上誤解。"], [2, 8, "all training will count as credit towards your Annual Review Targets", "Annual Review Targets", "每項課程均有學分，與首十名獎勵分開寫。"], [3, 8, "Mary Steward has confirmed her availability for Viewer’s Choice!", "Mary Steward", "聊天只屬暫定；這封較新的電郵才確認。"], [3, 6, "Episode 1 is called “Fruit Pie”", "fruit pie", "保留節目初稿中仍然有效的集名。"], [3, 8, "between apple and blueberry filling", "blueberry", "最新電郵補上兩款餡料。"], [3, 7, "viewers will be able to vote for free through the Teen NetChef TV app", "Vote for free", "免費 app 投票取代熱線。"], [3, 6, "One lucky voter", "lucky voter", "得獎者是一名投票觀眾。"], [3, 8, "the finished dish — will be delivered by the food delivery company FlyingFood using a drone", "FlyingFood", "同時交代獎品、運送公司及方式。"]], leaves={"1": "2023-DSE\nENG LANG\nPAPER 3\nPART B2\nHONG KONG EXAMINATIONS AND ASSESSMENT AUTHORITY\nHONG KONG DIPLOMA OF SECONDARY EDUCATION EXAMINATION 2023\nB2DIFFICULT SECTION\nENGLISH LANGUAGE PAPER 3\nPART B2\nDATA FILE\nGENERAL INSTRUCTIONS\nRefer to the General Instructions on Page 1 of the Question-Answer Book for Part A.\nINSTRUCTIONS FOR PART B2\nThe Question-Answer Book for Part B2 is inserted into this Data File.\nFor Part B, attempt EITHER those tasks in Part B1 (Tasks 5 – 7) OR those in Part B2 (Tasks 8 – 10).\nYou are advised to use a pen for Part B.\nThe Data Files will NOT be collected at the end of the examination. Do NOT write your answers in the Data Files.\nHand in only ONE Question-Answer Book for Part B, either B1 or B2, and tie it with the Question-Answer Book for Part A.\n© Hong Kong Examinations and Assessment Authority\nAll Rights Reserved 2023Not to be taken away before the end of the examination session", "2": "Part B\nSituation\nYou are Nico Lin. You work at the internet TV company Teen NetChef TV that makes streaming TV shows in Hong Kong. You assist Mr Archie Li, the Marketing Manager for Teen NetChef TV. You have been asked to complete some tasks.\nYou will listen to a recording of an online staff meeting between the show producer Ms Winnie Tang, the Director of Teen NetChef TV Mr Dante Cruz, and Archie Li. Take notes under the appropriate headings. Before the recording is played, you will have five minutes to study the Question-Answer Book and the Data File to familiarise yourself with the situation and the tasks.\nComplete the tasks by following the instructions in the Question-Answer Book and on the recording. You will find all the information you need in the Question-Answer Book, the Data File and on the recording. As you listen you can make notes on page 3 of the Data File.\nYou now have five minutes to familiarise yourself with the Question-Answer Book and the Data File.\nContents\nListening note-taking sheet for online staff meeting 3\nEmail from Archie Li to Nico Lin 4\nBig Cheese Celebrity Food Gossip article 5\nDraft storyboard for the promotional video, with Dante Cruz’s comments 6\nChat between William Puddle and Archie Li 7\nAll staff weekly email from Dante Cruz 8\nCorporate Training Intranet page 9\nCorporate Training: reviews from previous participants 10", "3": "Listening note-taking sheet for online staff meeting\nListen to the recording of an online staff meeting between the show producer Ms Winnie Tang, the Director of Teen NetChef TV Mr Dante Cruz, and the Marketing Manager Mr Archie Li.\nLive, Study, Cook\nFilming schedule\nKinds of food in the competition\nWilliam Puddle’s viral video\nGolden Sun Tower Private Kitchen complaints\nNew show: Viewer’s Choice", "4": "Email from Archie Li to Nico Lin\nFile　 Message Junk　 Delete　 Reply　 Reply All　 Forward　 Move　 Mark Unread　 Follow up\nTo: Nico Lin\nSent: 22nd April 2023 9:02 AM\nFrom: Archie Li\nSubject: Things to do\nDear Nico,\nHere are your tasks for today.\nI need you to write the announcement for our website to show our support for Teen NetChef TV star William Puddle. His cooking video went viral recently, for all the wrong reasons: see the article from Big Cheese Celebrity Food Gossip that I’ve sent you. I’ve discussed this in a chat with William, which I’ll send to you as well, so we can present his side of the story. Make sure you acknowledge and explain William’s mistake, but also explain the misunderstandings that people have about the other events in the video.\nI also need you to write an email to all staff to recommend training courses for the coming year. Dante Cruz’s most recent email sets the scene for this, so take a look at that first. All the available courses have been posted on our Corporate Training Intranet page, along with reviews from previous participants. Three courses will be enough: briefly describe the three courses staff should sign up for (I think it’s pretty clear which three stand out) and explain how their work will benefit from each one.\nNext, please write the script for the promotional video for our new cookery show Viewer’s Choice. I’ve sent you a draft of the storyboard for the video, along with comments from Dante, so you know what to write about. Be careful, though: we’ve made several changes since that draft. Make sure you have the most up-to-date information in your script. I remember both William and Dante giving some updates recently.\nFinally, we discussed all of the above at the most recent online staff meeting. I’ve sent you the recording (I’m still working on the minutes). Listen to our discussion.\nThanks,\nArchie", "5": "Big Cheese Celebrity Food Gossip article\nPuddle Starts a Flood!\nWilliam Puddle’s disastrous cooking video goes viral\nTuesday 18th April 2023Teen NetChef TV star’s latest video did not go swimmingly\nCan his career survive the soaking?\nViewers expressed shock on Monday at the disasters that befell celebrity chef William Puddle in the Teen NetChef TV test kitchen. The video, showing a series of calamitous mistakes, quickly went viral after appearing on Puddle’s social media accounts.\nWater, water everywhere!The video opens with Puddle seemingly flooding his kitchen without realising it! After turning on the kitchen tap to wash some potatoes, Puddle turns to the camera to talk about the science of cutting onions, with the sink rapidly filling up behind him.\nAfter about thirty seconds, Puddle finally realises his big mistake. The floor is flooded and Puddle is even seen apparently slipping in the mess as he reaches for the tap.\n“Irresponsible behaviour”Puddle steps in it!\nWilliam Puddle cleans up the mess from the flood in a screen-grab from the viral video.\nPuddle’s poor performance didn’t end there: viewers noticed that after turning off the tap and cleaning up the floor, Puddle chops up some raw chicken. He then starts slicing up the other ingredients without washing his hands.\nExperts agree that these shocking safety mistakes set a terrible example to other chefs, especially younger fans.\n“This is irresponsible behaviour from a TV Chef,” said Sam Cooke, Head Chef of rival streaming show SuperChefTV. “If we allow children to follow Mr Puddle’s example, who knows what could happen?”\nPuddles of tearsPerhaps realising his downfall, Puddle even appears to be crying towards the end of the video. He starts wiping his face with a tea towel, the same one he used to dry the raw chicken.\n“His eyes were clearly watering in the video. Someone should not be around dangerous cooking appliances and sharp knives if they can’t control their emotions,” said Cooke.\nNeither Puddle, nor the director of Teen NetChef TV, Mr Dante Cruz, could be reached for comment.\nWith rumours of a new show coming soon, Puddle is surely in hot water after this latest fiasco!", "6": "Draft storyboard for the promotional video, with Dante Cruz’s comments\n1. Introduce the show\nViewer’s Choice — Ground-breaking TV!\n2. Introduce the star(s)\nOur regular chef, plus one mystery guest each week\n3. The choices\n4. Episode 1\nEpisode 1 is called “Fruit Pie”\n5. Audience voting\nThe voting hotline number will be on the screen in each episode.\n6. The finished dish\nThe finished dish\n7. The Big Prize\nOne lucky voter: Message: You’ve won!\n8. Delivery of the Big Prize\nThe finished dish → straight to your door!\nDante Cruz’s comments\nFrame 1Not good enough: we need to say why it’s ground-breaking!\nFrame 3A little unclear — just explain who chooses what.\nFrame 4We can include what the main choice will be in Episode 1.\nFrame 8Check which delivery company — some exciting news on this soon!", "7": "Chat between William Puddle and Archie Li\nWednesday 19th April\nArchie:What were you thinking? Was this some kind of a joke? How did you flood the kitchen?\nWilliam:I’m so sorry! This was my mistake. I forgot to turn off the tap! We’ve just switched from an automatic tap to a manual one and I forgot it wouldn’t turn off by itself! I thought everyone would see the funny side! What did Dante say? Am I still the star of Viewer’s Choice?\nArchie:We’ll get to that in a moment. First, tell me what happened with the raw chicken.\nWilliam:I swear it’s not what it looks like! I was so careful — I always am. I had to edit the video because it was too long — I cut out the parts where I cleaned everything!\nArchie:And the tea towel? Can you explain that?\nWilliam:Honestly, I used a clean one! It just looks like I didn’t because I have 150 of the same kind! Don’t you remember? I showed them in my kitchen tour video.\nArchie:Yes, but only your fans know about your other videos, not everybody! All right. Now that we’ve figured out what really happened I’ll get Nico to show our support on the website.\nWilliam:Thank you so much! Now let me pay you back: I have some news about the new show that I think might cheer up Dante.\nArchie:Go on.\nWilliam:So, we planned to have a different mystery guest each week, right? Well, Mary Steward just called. She says she supports me, she wants to help and she wants to be my co-star!\nArchie:Mary Steward? The Queen of TV Cooking? As a co-star?! Well, she just might be able to save you! OK, let’s go with her as the co-star and forget the mystery guest idea. If she confirms soon, we absolutely must include this in the promotion video.\nWilliam:Agreed. Thanks, Archie! That should get the voting hotline ringing!!!\nArchie:Did nobody tell you? We decided that viewers will be able to vote for free through the Teen NetChef TV app. We’ve cancelled the voting hotline.\nWilliam:Oh, I see. Good decision!", "8": "All staff weekly email from Dante Cruz\nFile　 Message Junk　 Delete　 Reply　 Reply All　 Forward　 Move　 Mark Unread　 Follow up\nTo: All staff\nSent: Thursday 20th April 2023 9:02 AM\nFrom: Dante Cruz\nSubject: Weekly Email\nDear All\nGreat to hear that you’re all working hard to make our dreams for the new series of Live, Study, Cook a reality. Here are the latest initiatives to make sure that we all keep on track and strive to achieve:\n1. Special training\nThose of you who listened to the online staff meeting will have heard that we identified two areas of training that we need urgently. We have since decided to extend both of these to all staff, not just chefs.\n2. Food hygiene training\nSimilarly, staff are encouraged to do food hygiene training. As per our company policy on food hygiene, trainers for this course must be approved by the Health Advisory Board (HAB).\n3. Annual Review Targets (ARTs)\nI have informed Human Resources that all training will count as credit towards your Annual Review Targets (ARTs). These will look really good on an appraisal!\n4. Viewer’s Choice — updates\na)I’m delighted to announce that Mary Steward has confirmed her availability for Viewer’s Choice!\nb)More exciting news: our Big Prize — the finished dish — will be delivered by the food delivery company FlyingFood using a drone. Cutting edge technology!\nc)We’ve agreed that the main choice in Episode 1 will be between apple and blueberry filling. Yum! We should mention this in any promotional materials.\nKeep up the good work and Bon Appetit!\nDante Cruz", "9": "Corporate Training Intranet page\nCourse Provider:Pinafore Solutions\nLife-Proof Professional Chef TrainingPinafore Solutions offers training and development programmes for culinary staff.\nAvailable courses\n1. Advanced Fire Safety\nThis course will help develop and manage your staff in the realm of fire safety. We include helpful guidance on how to develop a fire plan as well as the important things to consider when training fire marshals. Finally, we’ve got you covered in maintaining those all-important emergency routes that could be vital in the survival of you and your employees. Sign up today!\n2. Hazard Awareness\nThe kitchen is full of fire hazards and dangers. Can you recognise them all? A professional chef needs all the tricks of the trade to keep everyone safe. This course starts with how to use a fire extinguisher and moves on to how to keep fire exits clear — a must for the next culinary genius!\n3. Food Hygiene Basics\nOur most popular course: see how to handle raw food and cook at a safe temperature. AFH approval pending!\nCourse Provider:The Grill Gurus\nNeed comprehensive chef training for indoor and outdoor chefs? The Grill Gurus can help! Rest assured that your kitchen staff will know how to cook safely for happy kitchens, campfires and barbeques!\nWe run training sessions for the modern adventurous chef. All instructors are HAB approved.\nCourses\nA: The Chef’s Special\nThe ultimate food safety guide for adventurous chefs, including “Food Safety 101”: from the test kitchen to the plate™. “Keep it separate, stupid!” is our tongue-in-cheek guide to avoiding cross-contamination in the kitchen, while “Burn those bugs” explains the importance of safe cooking temperatures.\nB: The Fire Chef’s Manual\nWe cover all the basics to make your alfresco cooking experience as safe as possible. Learn how to light a campfire safely, then we’ll get you ready to use a fire extinguisher when things go wrong. Putting out an oil fire is something that’s more difficult than it looks: we’ll guide you through the tricky process. Trust us to make sure only the food gets burnt™.\nCourse Provider:PR Productions\nPerfecting Dreams for Online CreatorsLet PR Productions pave your path to personal perfection! Online booking is now open. Each course features 5 hours of Zoom sessions with certified Social Media Influencers!\nOption 1: Be Your Best!\nWe teach the importance of Crystal Clear Communication™: the art of only saying what you mean and meaning what you say. After this course, you’ll be a social media angel, showing your perfect self, all the time! Our previous graduates include stars of stage and screen, CEOs and KOLs. Yoga mums and fitness dads also welcome!\nOption 2: Maximise My Money\nHow to turn your social media feed into a money-spinner? It’s not just about the way you sound, but what your customers can see. Join this course to write like a millionaire™ and monetise your brand today!", "10": "Corporate Training: reviews from previous participants\nFood Hygiene Basics\nI loved, loved, loved this course. They went through everything, in lots of great detail. As a newly-trained chef, this is going to be a massive benefit to me. A bit of a shame that the instructors lost their HAB approval (they’re switching to AFH — the Association of Food Health — next year), but still totally worthwhile as they knew what they were doing.\nThe instructors gave out some really interesting tips on food safety. Although I liked the course, I thought it was a bit too short. It would have been better to have some time for questions at the end.\nThe Chef’s Special\nYes, great: no complaints. My boss made me do this course. I thought the “101” section, which focused on food hygiene, was really informative, and the “Keep it separate, stupid!” part made me laugh!\nWhat a fab day! Great tips on how to have a food-safe kitchen. It mostly deals with work settings, though, so nothing I could use at home. Still, it will definitely have its uses in my cooking career as it comes with a professional qualification.\nHazard Awareness\nI was feeling really under the weather that day and my mum said I shouldn’t go, but I’m really glad I did in the end as this course has something for everyone, not just chefs. Perseverance really pays off in so many areas of life!\nThe Fire Chef’s Manual\nThis was awesome. Jake, the instructor, was super knowledgeable and answered all my questions. He’s a surfer, just like me, so it was really useful to learn about cooking on the beach over an open-air fire. Paradise! My buddy Steve says he thought it was a waste of time because he works at an indoor kitchen. I told him to change jobs! Ha!\nAdvanced Fire Safety\nLots of information, but it’s really only for management-level staff, not for everyone, even though that’s not clear in the course description. I actually fell asleep in the boring online sessions. Must do better, Pinafore Solutions!\nI understand that fire marshal training is a very serious issue, and we need to train staff properly, but do we really need 25 hours of online talks for this? Inefficient and expensive.\nBe Your Best!\nO.M.Gosh! What a wonderful course. I’m a fashion blogger and this has already improved my videos. Life’s so much easier now! Also, Jinny, who runs the course, is lovely! Her happy smile kept me motivated day after day.\nThis course is absolutely not just for social media stars: I work in PR as well as being a vlogger. Before, I had real trouble communicating in work meetings — not anymore! That purple backdrop was to die for as well — you’ll see what I mean when you log in for the first time. You’re welcome!\nMaximise My Money\nSuch a good course — the tips really helped me to maximise my brand and start raking in the profit. I blew my competitors out of the water with deftly-crafted written text and some stunning visuals. Take this together with PR Productions’ course on communication and you’ll be the complete package.\nTHIS IS THE LAST PAGE OF THE PART B2 DATA FILE", "11": "HKDSE 2023 · ENGLISH LANGUAGE · PAPER 3 PART B2B2 · DIFFICULT SECTION\nTask 8: Website announcement (19 marks)\nWrite an announcement for the Teen NetChef TV website in support of William Puddle. Use the information from the B2 Data File and your notes. Write around 200 words.\nWebsite announcement0 words", "12": "Task 8 · Answer continuation\nTask 8 answer continuation0 words", "13": "Task 8 · Answer continuation\nTask 8 answer continuation0 words\nEND OF TASK 8", "14": "Task 9: Staff training email (17 marks)\nWrite an email to inform all staff about training courses. Use the information from the B2 Data File and your notes. Write around 150 words.\nStaff training email0 words", "15": "Task 9 · Answer continuation\nTask 9 answer continuation0 words\nEND OF TASK 9", "16": "Task 10: Video script (17 marks)\nWrite a short script to promote the new streaming TV show Viewer’s Choice. Use the information from the B2 Data File and your notes. Write around 120 words.\nPromotional video script0 words", "17": "Task 10 · Answer continuation\nTask 10 answer continuation0 words", "18": "Task 10 · Answer continuation\nTask 10 answer continuation0 words\nEND OF TASK 10 · END OF PART B2"};const rail=document.createElement('div');rail.className='rail';document.querySelector('nav').append(rail);names.forEach((n,j)=>{let b=document.createElement('button');b.textContent=(j+1)+' '+n;b.onclick=()=>{stage.value=j;stage.onchange()};rail.append(b)});const surface=document.createElement('div');E('open').before(surface);function showPage(el,p,ids,blue){el.replaceChildren();let text=leaves[p],pos=0;const spans=ids.map(id=>[text.indexOf(facts[id][2]),id]).filter(x=>x[0]>=0).sort((a,b)=>a[0]-b[0]);for(let [at,id] of spans){if(at<pos)continue;el.append(text.slice(pos,at));let m=document.createElement('mark');m.textContent=facts[id][2];m.style.background=inks[facts[id][0]];if(blue)m.className='applied';el.append(m);pos=at+m.textContent.length}el.append(text.slice(pos));el.className='paper'}const base=render;render=function(){base();let r=rows[i];[...rail.children].forEach((b,j)=>b.classList.toggle('current',j===r.stage));surface.hidden=r.stage<2||r.stage===3;if(r.stage===4){for(let id of r.used||[]){let v=facts[id],b=document.createElement('button');b.textContent='Data File 第 '+v[1]+' 頁 · '+v[2];b.onclick=()=>{let box=E('excerpt');showPage(box,v[1],[id],true);E('pop').showModal();box.querySelector('mark').scrollIntoView({block:'center'})};E('refs').append(b);E('a').append(document.createElement('br'),v[4])}for(let group of E('bank').children){let task=+group.firstChild.textContent.slice(-2).trim()-7;group.querySelectorAll('button').forEach(b=>b.remove());facts.forEach((v,id)=>{if(v[0]!==task)return;let p=document.createElement('p');p.textContent=v[2];if(rows.slice(0,i+1).some(x=>x.used?.includes(id)))p.className='spent';group.append(p)})}}};const excerpt=document.createElement('div');excerpt.id='excerpt';E('pop').append(excerpt);E('pop').addEventListener('close',()=>{excerpt.replaceChildren()});const writingView=render;render=function(){writingView();const r=rows[i];if(!r.pattern)return;const pos=r.q.indexOf(r.pattern),m=document.createElement('mark');m.style.background='#e8dafa';m.textContent=r.pattern;E('q').replaceChildren(r.q.slice(0,pos),m,r.q.slice(pos+r.pattern.length));E('q').style.background='#f5f0e2'};render()</script><script data-reader-source="boss-letter.js">
// Build the 2023 Boss Letter chapter from complete source sentences.

const legacyBoss23 = rows.filter(row => row.stage === 0);

  {type:'類型：5 提示（Task 2 的淘汰線索）',analysis:[
    '這課聚焦 beach / open-air fire；評語顯示室內廚房員工未必用得上。',
    'Task 2 要選三課。Hazard Awareness 教火警風險、滅火筒和逃生通道，更切合公司現時的防火培訓需要。',
    '因此淘汰 The Fire Chef’s Manual；正式電郵集中介紹入選的三課，毋須提及落選課程。'
  ]},
  {type:'類型：5 提示（淘汰線索）',analysis:[
    '一位學員認為 Advanced Fire Safety 偏重管理層；另一位質疑 25 小時網上講座的效益。',
    'Dante 要向全體員工推課；因此選較普遍適用的 Hazard Awareness。',
    '正式電郵介紹入選課程的實際技能，無須詳述落選課程的評語。'
  ]},
  {type:'類型：4 語義相關／補充佐證',analysis:[
    '一位兼任 PR 的學員說，Be Your Best! 改善了她在工作會議中的溝通。',
    '這個經驗可補充課程的工作用途；主要論據仍是課程教清楚表達，對應錄音中的網上溝通需要。'
  ]},
  {type:'類型：5 提示（淘汰線索）',analysis:[
    '評語讚賞 Maximise My Money 的品牌、盈利、文字和視覺技巧。',
    '本次培訓要處理安全、食物衞生和清楚溝通；這課偏向品牌變現，故不列入三項推薦。'
  ]}
];

if(manualBaseRows23.length!==49 || manualVerbatim23.length!==49){
  throw Error(`2023 B2 verbatim ledger mismatch: ${manualBaseRows23.length} rows / ${manualVerbatim23.length} records`);

  28,29,30,31,32,33,34,35,

  row.legacyQuote=row.originalQuote??row.q;

  row.manualPdfLabel=index===22?'49–50':String(manualPdfPages23[index]);

  row.manualType=record.type;
  row.manualAnalysis=record.analysis.slice();
  row.manualQuote=record.quote||row.q;

// The authored manual discussed two consecutive sentences in one unit. Preserve
// that wording verbatim on the first row, but enforce one primary runtime type
// per sentence so the UI never presents a contradictory Type 5 + Type 6 badge.
const contactHint23=rows.find(row=>row.stage===3&&row.q.startsWith('Neither Puddle, nor the director'));
const rumourNoiseQuote23='With rumours of a new show coming soon, Puddle is surely in hot water after this latest fiasco!';
if(contactHint23&&!rows.some(row=>row.stage===3&&row.q===rumourNoiseQuote23)){

  rows.splice(at+1,0,{

    manualId:contactHint23.manualId+'-sentence-2',manualPdfPage:contactHint23.manualPdfPage,
    manualPdfLabel:contactHint23.manualPdfLabel,origin:'manual',state:'CURRENT'

for(const row of rows.filter(row=>row.stage===3&&!row.origin))row.origin='evidence';

const nativePages23=["<article class=\"paper-page verified-reconstruction\" id=\"page-1\" data-kind=\"data\"><header><span>Data File · 第 1 頁</span><label><input type=\"checkbox\" data-read=\"1\"> 已讀</label></header><div class=\"native-document\" lang=\"en\"><div class=\"native-label\">原生文字重建</div><section class=\"recreated-page exam-cover\" aria-label=\"2023 DSE Paper 3 Part B2 Data File cover\">\n<div class=\"cover-head\"><div class=\"cover-corner\">2023-DSE<br>ENG LANG<br><br>PAPER 3<br>PART B2</div><div class=\"cover-authority\">HONG KONG EXAMINATIONS AND ASSESSMENT AUTHORITY<br>HONG KONG DIPLOMA OF SECONDARY EDUCATION EXAMINATION 2023</div><div class=\"cover-stamp\"><strong>B2</strong><span>DIFFICULT SECTION</span></div></div>\n<h2>ENGLISH LANGUAGE PAPER 3</h2><h2>PART B2</h2><h2>DATA FILE</h2>\n<div class=\"cover-instructions\"><h3>GENERAL INSTRUCTIONS</h3><ol><li class=\"bilingual\"><p lang=\"en\">Refer to the General Instructions on Page 1 of the Question-Answer Book for Part A.</p><p class=\"translation\" lang=\"zh-Hant\">請參閱甲部問答冊第 1 頁的一般指示。</p></li></ol>\n<h3>INSTRUCTIONS FOR PART B2</h3><ol><li class=\"bilingual\"><p lang=\"en\">The Question-Answer Book for Part B2 is inserted into this Data File.</p><p class=\"translation\" lang=\"zh-Hant\">乙部二問答冊夾於本資料檔內。</p></li><li class=\"bilingual\"><p lang=\"en\">For Part B, attempt EITHER those tasks in Part B1 (Tasks 5 – 7) OR those in Part B2 (Tasks 8 – 10).</p><p class=\"translation\" lang=\"zh-Hant\">乙部須選答乙部一（任務 5 至 7）或乙部二（任務 8 至 10），兩者選其一。</p></li><li class=\"bilingual\"><p lang=\"en\">You are advised to use a pen for Part B.</p><p class=\"translation\" lang=\"zh-Hant\">建議乙部使用原子筆作答。</p></li><li class=\"bilingual\"><p lang=\"en\">The Data Files will NOT be collected at the end of the examination. Do NOT write your answers in the Data Files.</p><p class=\"translation\" lang=\"zh-Hant\">考試結束時資料檔不會收回。請勿在資料檔內書寫答案。</p></li><li class=\"bilingual\"><p lang=\"en\">Hand in only ONE Question-Answer Book for Part B, either B1 or B2, and tie it with the Question-Answer Book for Part A.</p><p class=\"translation\" lang=\"zh-Hant\">乙部只須交一份問答冊（乙部一或乙部二），並與甲部問答冊綁在一起。</p></li></ol></div>\n<div class=\"cover-bottom\"><span>© Hong Kong Examinations and Assessment Authority<br>All Rights Reserved 2023</span><span>Not to be taken away before the end of the examination session</span></div>\n</section>\n</div><details class=\"reference-scan\"><summary>核對原卷影像</summary><figure class=\"facsimile\"><img src=\"reference/assets/page-01.webp\" alt=\"Data File original page 34\" loading=\"lazy\"><figcaption>原卷影像供核對文字和版面</figcaption></figure></details></article>", "<article class=\"paper-page verified-reconstruction\" id=\"page-2\" data-kind=\"data\"><header><span>Data File · 第 2 頁</span><label><input type=\"checkbox\" data-read=\"2\"> 已讀</label></header><div class=\"native-document\" lang=\"en\"><div class=\"native-label\">原生文字重建</div><section class=\"recreated-page situation-page\" aria-label=\"2023 B2 situation and contents\"><div class=\"situation-box\"><h2>Part B</h2><h3>Situation</h3><div class=\"bilingual\"><p lang=\"en\">You are Nico Lin. You work at the internet TV company Teen NetChef TV that makes streaming TV shows in Hong Kong. You assist Mr Archie Li, the Marketing Manager for Teen NetChef TV. You have been asked to complete some tasks.</p><p class=\"translation\" lang=\"zh-Hant\">你是 Nico Lin，任職於香港串流節目公司 Teen NetChef TV，協助市場經理 Archie Li 處理工作。</p></div><div class=\"bilingual\"><p lang=\"en\">You will listen to a recording of an online staff meeting between the show producer Ms Winnie Tang, the Director of Teen NetChef TV Mr Dante Cruz, and Archie Li. Take notes under the appropriate headings. Before the recording is played, you will have five minutes to study the Question-Answer Book and the Data File to familiarise yourself with the situation and the tasks.</p><p class=\"translation\" lang=\"zh-Hant\">你將聽到製作人 Winnie Tang、總監 Dante Cruz 和 Archie Li 的網上員工會議。按標題記筆記。錄音開始前有五分鐘閱讀問答冊和資料檔。</p></div><div class=\"bilingual\"><p lang=\"en\">Complete the tasks by following the instructions in the Question-Answer Book and on the recording. You will find all the information you need in the Question-Answer Book, the Data File and on the recording. As you listen you can make notes on page 3 of the Data File.</p><p class=\"translation\" lang=\"zh-Hant\">按照問答冊和錄音指示完成任務。所需資料均載於問答冊、資料檔和錄音；聆聽時可在資料檔第 3 頁記筆記。</p></div><div class=\"bilingual\"><p lang=\"en\">You now have five minutes to familiarise yourself with the Question-Answer Book and the Data File.</p><p class=\"translation\" lang=\"zh-Hant\">現在有五分鐘熟悉問答冊和資料檔。</p></div></div><div class=\"contents-box\"><h3>Contents</h3><ol><li><a href=\"#page-3\">Listening note-taking sheet for online staff meeting <span>3</span></a></li><li><a href=\"#page-4\">Email from Archie Li to Nico Lin <span>4</span></a></li><li><a href=\"#page-5\">Big Cheese Celebrity Food Gossip article <span>5</span></a></li><li><a href=\"#page-6\">Draft storyboard for the promotional video, with Dante Cruz’s comments <span>6</span></a></li><li><a href=\"#page-7\">Chat between William Puddle and Archie Li <span>7</span></a></li><li><a href=\"#page-8\">All staff weekly email from Dante Cruz <span>8</span></a></li><li><a href=\"#page-9\">Corporate Training Intranet page <span>9</span></a></li><li><a href=\"#page-10\">Corporate Training: reviews from previous participants <span>10</span></a></li></ol></div></section>\n</div><details class=\"reference-scan\"><summary>核對原卷影像</summary><figure class=\"facsimile\"><img src=\"reference/assets/page-02.webp\" alt=\"Data File original page 35\" loading=\"lazy\"><figcaption>原卷影像供核對文字和版面</figcaption></figure></details></article>", "<article class=\"paper-page verified-reconstruction\" id=\"page-3\" data-kind=\"data\"><header><span>Data File · 第 3 頁</span><label><input type=\"checkbox\" data-read=\"3\"> 已讀</label></header><div class=\"native-document\" lang=\"en\"><div class=\"native-label\">原生文字重建</div><section class=\"recreated-page conference-notes note-sheet\" aria-label=\"Online staff meeting notes\"><h2>Listening note-taking sheet for online staff meeting</h2><div class=\"bilingual\"><p lang=\"en\">Listen to the recording of an online staff meeting between the show producer Ms Winnie Tang, the Director of Teen NetChef TV Mr Dante Cruz, and the Marketing Manager Mr Archie Li.</p><p class=\"translation\" lang=\"zh-Hant\">聆聽製作人 Winnie Tang、總監 Dante Cruz 和市場經理 Archie Li 的網上員工會議。</p></div><div class=\"notes-form-body\"><h3 id=notes-heading-live-study-cook>Live, Study, Cook</h3><p class=\"translation\" lang=\"zh-Hant\">《Live, Study, Cook》</p><textarea id=notes-live-study-cook data-note=\"3-1\" rows=\"4\" aria-label=\"Notes: Live, Study, Cook\"></textarea><h3 id=notes-heading-filming-schedule>Filming schedule</h3><p class=\"translation\" lang=\"zh-Hant\">拍攝時間表</p><textarea id=notes-filming-schedule data-note=\"3-2\" rows=\"4\" aria-label=\"Notes: Filming schedule\"></textarea><h3 id=notes-heading-food-kinds>Kinds of food in the competition</h3><p class=\"translation\" lang=\"zh-Hant\">比賽食物種類</p><textarea id=notes-food-kinds data-note=\"3-3\" rows=\"4\" aria-label=\"Notes: Kinds of food in the competition\"></textarea><h3 id=notes-heading-william-video>William Puddle’s viral video</h3><p class=\"translation\" lang=\"zh-Hant\">William Puddle 的爆紅影片</p><textarea id=notes-william-video data-note=\"3-4\" rows=\"4\" aria-label=\"Notes: William Puddle’s viral video\"></textarea><h3 id=notes-heading-golden-sun>Golden Sun Tower Private Kitchen complaints</h3><p class=\"translation\" lang=\"zh-Hant\">Golden Sun Tower Private Kitchen 投訴</p><textarea id=notes-golden-sun data-note=\"3-5\" rows=\"4\" aria-label=\"Notes: Golden Sun Tower Private Kitchen complaints\"></textarea><h3 id=notes-heading-viewers-choice>New show: Viewer’s Choice</h3><p class=\"translation\" lang=\"zh-Hant\">新節目：《Viewer’s Choice》</p><textarea id=notes-viewers-choice data-note=\"3-6\" rows=\"4\" aria-label=\"Notes: New show: Viewer’s Choice\"></textarea></div></section>\n</div><details class=\"reference-scan\"><summary>核對原卷影像</summary><figure class=\"facsimile\"><img src=\"reference/assets/page-03.webp\" alt=\"Data File original page 36\" loading=\"lazy\"><figcaption>原卷影像供核對文字和版面</figcaption></figure></details></article>", "<article class=\"paper-page verified-reconstruction\" id=\"page-4\" data-kind=\"data\"><header><span>Data File · 第 4 頁</span><label><input type=\"checkbox\" data-read=\"4\"> 已讀</label></header><div class=\"native-document\" lang=\"en\"><div class=\"native-label\">原生文字重建</div><section class=\"recreated-page chef-email\" aria-label=\"Archie Li email\"><h2>Email from Archie Li to Nico Lin</h2><div class=\"email-window\"><div class=\"email-toolbar\">File　 Message <span>Junk　 Delete　 Reply　 Reply All　 Forward　 Move　 Mark Unread　 Follow up</span></div><div class=\"email-headers\"><div><strong>To:</strong> Nico Lin</div><div><strong>Sent:</strong> 22nd April 2023 9:02 AM</div><div><strong>From:</strong> Archie Li</div><div><strong>Subject:</strong> Things to do</div></div><div class=\"email-content\"><div class=\"bilingual\"><p lang=\"en\">Dear Nico,</p><p class=\"translation\" lang=\"zh-Hant\">Nico：</p></div><div class=\"bilingual\"><p lang=\"en\">Here are your tasks for today.</p><p class=\"translation\" lang=\"zh-Hant\">以下是你今天的工作。</p></div><div class=\"bilingual\"><p lang=\"en\">I need you to write the announcement for our website to show our support for Teen NetChef TV star William Puddle. His cooking video went viral recently, for all the wrong reasons: see the article from Big Cheese Celebrity Food Gossip that I’ve sent you. I’ve discussed this in a chat with William, which I’ll send to you as well, so we can present his side of the story. Make sure you acknowledge and explain William’s mistake, but also explain the misunderstandings that people have about the other events in the video.</p><p class=\"translation\" lang=\"zh-Hant\">請為網站撰寫公告，表示我們支持 Teen NetChef TV 明星 William Puddle。他最近的烹飪影片因負面原因爆紅；請參閱我轉給你的《Big Cheese Celebrity Food Gossip》文章。我也和 William 聊過，會把對話轉給你，以呈現他的說法。要承認並解釋他的失誤，也要釐清影片其他事件的誤解。</p></div><div class=\"bilingual\"><p lang=\"en\">I also need you to write an email to all staff to recommend training courses for the coming year. Dante Cruz’s most recent email sets the scene for this, so take a look at that first. All the available courses have been posted on our Corporate Training Intranet page, along with reviews from previous participants. Three courses will be enough: briefly describe the three courses staff should sign up for (I think it’s pretty clear which three stand out) and explain how their work will benefit from each one.</p><p class=\"translation\" lang=\"zh-Hant\">還請向全體員工發電郵，推薦來年的培訓課程。先看 Dante Cruz 最近的電郵，再參閱公司內聯網的課程資料及過往學員評語。推薦三門最合適的課程，簡述內容及各自如何幫助工作。</p></div><div class=\"bilingual\"><p lang=\"en\">Next, please write the script for the promotional video for our new cookery show Viewer’s Choice. I’ve sent you a draft of the storyboard for the video, along with comments from Dante, so you know what to write about. Be careful, though: we’ve made several changes since that draft. Make sure you have the most up-to-date information in your script. I remember both William and Dante giving some updates recently.</p><p class=\"translation\" lang=\"zh-Hant\">接著，請為新烹飪節目《Viewer’s Choice》的宣傳片撰寫劇本。我已寄上分鏡草稿及 Dante 的評語。草稿完成後有幾項改動，務必使用最新資料；William 和 Dante 最近都提供過更新。</p></div><div class=\"bilingual\"><p lang=\"en\">Finally, we discussed all of the above at the most recent online staff meeting. I’ve sent you the recording (I’m still working on the minutes). Listen to our discussion.</p><p class=\"translation\" lang=\"zh-Hant\">以上事項亦在最近的網上員工會議討論過。我已寄錄音，會議紀錄仍在整理；請聆聽討論。</p></div><div class=\"bilingual\"><p lang=\"en\">Thanks,</p><p class=\"translation\" lang=\"zh-Hant\">謝謝。</p></div><p>Archie</p></div></div></section>\n</div><details class=\"reference-scan\"><summary>核對原卷影像</summary><figure class=\"facsimile\"><img src=\"reference/assets/page-04.webp\" alt=\"Data File original page 37\" loading=\"lazy\"><figcaption>原卷影像供核對文字和版面</figcaption></figure></details></article>", "<article class=\"paper-page verified-reconstruction\" id=\"page-5\" data-kind=\"data\"><header><span>Data File · 第 5 頁</span><label><input type=\"checkbox\" data-read=\"5\"> 已讀</label></header><div class=\"native-document\" lang=\"en\"><div class=\"native-label\">原生文字重建</div><section class=\"recreated-page chef-gossip\" aria-label=\"Big Cheese gossip article\"><h2>Big Cheese Celebrity Food Gossip article</h2><article class=\"gossip-sheet\"><h3>Puddle Starts a Flood!</h3><h4>William Puddle’s disastrous cooking video goes viral</h4><time>Tuesday 18th April 2023</time><ul><li>Teen NetChef TV star’s latest video did not go swimmingly</li><li>Can his career survive the soaking?</li></ul><div class=\"bilingual\"><p lang=\"en\">Viewers expressed shock on Monday at the disasters that befell celebrity chef William Puddle in the Teen NetChef TV test kitchen. The video, showing a series of calamitous mistakes, quickly went viral after appearing on Puddle’s social media accounts.</p><p class=\"translation\" lang=\"zh-Hant\">觀眾對名廚 William Puddle 周一在 Teen NetChef TV 測試廚房接連出錯感到震驚。影片在他的社交媒體發布後迅速爆紅。</p></div><h5>Water, water everywhere!</h5><div class=\"bilingual\"><p lang=\"en\">The video opens with Puddle seemingly flooding his kitchen without realising it! After turning on the kitchen tap to wash some potatoes, Puddle turns to the camera to talk about the science of cutting onions, with the sink rapidly filling up behind him.</p><p class=\"translation\" lang=\"zh-Hant\">影片開頭，Puddle 開水龍頭洗薯仔後轉身向鏡頭講解切洋葱的原理，身後的水槽迅速注滿，他似乎毫不察覺。</p></div><div class=\"bilingual\"><p lang=\"en\">After about thirty seconds, Puddle finally realises his big mistake. The floor is flooded and Puddle is even seen apparently slipping in the mess as he reaches for the tap.</p><p class=\"translation\" lang=\"zh-Hant\">約三十秒後，他終於發現錯誤。地板已淹水，他伸手關水龍頭時似乎滑倒。</p></div><h5>“Irresponsible behaviour”</h5><figure><img src=\"reference/assets/2023-b2-puddle-flood.webp\" alt=\"Original screen-grab of William Puddle cleaning up water in the kitchen\"><figcaption><em>Puddle steps in it!</em><br>William Puddle cleans up the mess from the flood in a screen-grab from the viral video.</figcaption></figure><div class=\"bilingual\"><p lang=\"en\">Puddle’s poor performance didn’t end there: viewers noticed that after turning off the tap and cleaning up the floor, Puddle chops up some raw chicken. He then starts slicing up the other ingredients without washing his hands.</p><p class=\"translation\" lang=\"zh-Hant\">觀眾又看到他在關水及清理地板後切生雞肉，接著似乎沒洗手就切其他食材。</p></div><div class=\"bilingual\"><p lang=\"en\">Experts agree that these shocking safety mistakes set a terrible example to other chefs, especially younger fans.</p><p class=\"translation\" lang=\"zh-Hant\">專家認為，這些驚人的安全失誤為其他廚師，尤其年輕支持者，樹立壞榜樣。</p></div><div class=\"bilingual\"><p lang=\"en\">“This is irresponsible behaviour from a TV Chef,” said Sam Cooke, Head Chef of rival streaming show SuperChefTV. “If we allow children to follow Mr Puddle’s example, who knows what could happen?”</p><p class=\"translation\" lang=\"zh-Hant\">競爭節目《SuperChefTV》主廚 Sam Cooke 認為，電視廚師這樣做不負責任；孩子模仿，後果難料。</p></div><h5>Puddles of tears</h5><div class=\"bilingual\"><p lang=\"en\">Perhaps realising his downfall, Puddle even appears to be crying towards the end of the video. He starts wiping his face with a tea towel, the same one he used to dry the raw chicken.</p><p class=\"translation\" lang=\"zh-Hant\">影片結尾，他似乎哭了，並用一條看似用來擦乾生雞肉的茶巾擦臉。</p></div><div class=\"bilingual\"><p lang=\"en\">“His eyes were clearly watering in the video. Someone should not be around dangerous cooking appliances and sharp knives if they can’t control their emotions,” said Cooke.</p><p class=\"translation\" lang=\"zh-Hant\">Cooke 說他在影片中明顯淚眼汪汪，不能控制情緒的人不該靠近危險廚具和利刀。</p></div><div class=\"bilingual\"><p lang=\"en\">Neither Puddle, nor the director of Teen NetChef TV, Mr Dante Cruz, could be reached for comment.</p><p class=\"translation\" lang=\"zh-Hant\">記者未能聯絡 Puddle 或 Teen NetChef TV 總監 Dante Cruz 置評。</p></div><div class=\"bilingual\"><p lang=\"en\">With rumours of a new show coming soon, Puddle is surely in hot water after this latest fiasco!</p><p class=\"translation\" lang=\"zh-Hant\">新節目即將推出的傳聞四起；經此風波，Puddle 恐怕惹上麻煩。</p></div></article></section>\n</div><details class=\"reference-scan\"><summary>核對原卷影像</summary><figure class=\"facsimile\"><img src=\"reference/assets/page-05.webp\" alt=\"Data File original page 38\" loading=\"lazy\"><figcaption>原卷影像供核對文字和版面</figcaption></figure></details></article>", "<article class=\"paper-page verified-reconstruction\" id=\"page-6\" data-kind=\"data\"><header><span>Data File · 第 6 頁</span><label><input type=\"checkbox\" data-read=\"6\"> 已讀</label></header><div class=\"native-document\" lang=\"en\"><div class=\"native-label\">原生文字重建</div><section class=\"recreated-page chef-storyboard\" aria-label=\"Eight-frame promotional storyboard\"><h2>Draft storyboard for the promotional video, with Dante Cruz’s comments</h2><div class=\"story-grid\"><div class=\"story-frame\"><h3>1. Introduce the show</h3><div class=\"bilingual\"><p lang=\"en\">Viewer’s Choice — Ground-breaking TV!</p><p class=\"translation\" lang=\"zh-Hant\">介紹節目：《Viewer’s Choice》——突破性的電視節目！</p></div></div><div class=\"story-frame\"><h3>2. Introduce the star(s)</h3><img class=\"story-art\" src=\"reference/assets/2023-b2-chef-hat.webp\" alt=\"Original storyboard chef-hat illustration\"><div class=\"bilingual\"><p lang=\"en\">Our regular chef, plus one mystery guest each week</p><p class=\"translation\" lang=\"zh-Hant\">介紹明星：固定廚師及每週一位神秘嘉賓。</p></div></div><div class=\"story-frame\"><h3>3. The choices</h3><img class=\"story-art\" src=\"reference/assets/2023-b2-fruit.webp\" alt=\"Original storyboard fruit illustration\"></div><div class=\"story-frame\"><h3>4. Episode 1</h3><div class=\"bilingual\"><p lang=\"en\">Episode 1 is called “Fruit Pie”</p><p class=\"translation\" lang=\"zh-Hant\">首集名為《Fruit Pie》。</p></div></div><div class=\"story-frame\"><h3>5. Audience voting</h3><div class=\"bilingual\"><p lang=\"en\">The voting hotline number will be on the screen in each episode.</p><p class=\"translation\" lang=\"zh-Hant\">每集螢幕會顯示投票熱線號碼。</p></div></div><div class=\"story-frame\"><h3>6. The finished dish</h3><img class=\"story-art\" src=\"reference/assets/2023-b2-pie.webp\" alt=\"Original storyboard pie illustration\"><div class=\"bilingual\"><p lang=\"en\">The finished dish</p><p class=\"translation\" lang=\"zh-Hant\">完成的菜式。</p></div></div><div class=\"story-frame\"><h3>7. The Big Prize</h3><div class=\"bilingual\"><p lang=\"en\">One lucky voter: Message: You’ve won!</p><p class=\"translation\" lang=\"zh-Hant\">大獎：一名幸運投票者收到中獎訊息。</p></div></div><div class=\"story-frame\"><h3>8. Delivery of the Big Prize</h3><img class=\"story-art\" src=\"reference/assets/2023-b2-scooter.webp\" alt=\"Original storyboard scooter illustration\"><div class=\"bilingual\"><p lang=\"en\">The finished dish → straight to your door!</p><p class=\"translation\" lang=\"zh-Hant\">完成的菜式直接送到你家門！</p></div></div></div><aside class=\"story-comments\"><h3>Dante Cruz’s comments</h3><div><strong>Frame 1</strong><div class=\"bilingual\"><p lang=\"en\">Not good enough: we need to say why it’s ground-breaking!</p><p class=\"translation\" lang=\"zh-Hant\">未說明節目為何具突破性。</p></div></div><div><strong>Frame 3</strong><div class=\"bilingual\"><p lang=\"en\">A little unclear — just explain who chooses what.</p><p class=\"translation\" lang=\"zh-Hant\">要說清楚由誰選擇甚麼。</p></div></div><div><strong>Frame 4</strong><div class=\"bilingual\"><p lang=\"en\">We can include what the main choice will be in Episode 1.</p><p class=\"translation\" lang=\"zh-Hant\">可加入首集的主要選擇。</p></div></div><div><strong>Frame 8</strong><div class=\"bilingual\"><p lang=\"en\">Check which delivery company — some exciting news on this soon!</p><p class=\"translation\" lang=\"zh-Hant\">核實由哪間公司送餐；很快會有好消息。</p></div></div></aside></section>\n</div><details class=\"reference-scan\"><summary>核對原卷影像</summary><figure class=\"facsimile\"><img src=\"reference/assets/page-06.webp\" alt=\"Data File original page 39\" loading=\"lazy\"><figcaption>原卷影像供核對文字和版面</figcaption></figure></details></article>", "<article class=\"paper-page verified-reconstruction\" id=\"page-7\" data-kind=\"data\"><header><span>Data File · 第 7 頁</span><label><input type=\"checkbox\" data-read=\"7\"> 已讀</label></header><div class=\"native-document\" lang=\"en\"><div class=\"native-label\">原生文字重建</div><section class=\"recreated-page chef-chat\" aria-label=\"William and Archie chat\"><h2>Chat between William Puddle and Archie Li</h2><div class=\"chef-chat-shell\"><p class=\"chat-date\">Wednesday 19th April</p><div class=\"chef-bubble archie\"><strong>Archie:</strong><div class=\"bilingual\"><p lang=\"en\">What were you thinking? Was this some kind of a joke? How did you flood the kitchen?</p><p class=\"translation\" lang=\"zh-Hant\">你當時在想甚麼？在開玩笑嗎？怎會把廚房弄得水浸？</p></div></div><div class=\"chef-bubble william\"><strong>William:</strong><div class=\"bilingual\"><p lang=\"en\">I’m so sorry! This was my mistake. I forgot to turn off the tap! We’ve just switched from an automatic tap to a manual one and I forgot it wouldn’t turn off by itself! I thought everyone would see the funny side! What did Dante say? Am I still the star of Viewer’s Choice?</p><p class=\"translation\" lang=\"zh-Hant\">真的很對不起！我忘記關水龍頭。廚房剛把感應式水龍頭換成手動式，我忘了它不會自動關掉。我以為大家會覺得好笑。Dante 怎樣說？我仍是《Viewer’s Choice》的明星嗎？</p></div></div><div class=\"chef-bubble archie\"><strong>Archie:</strong><div class=\"bilingual\"><p lang=\"en\">We’ll get to that in a moment. First, tell me what happened with the raw chicken.</p><p class=\"translation\" lang=\"zh-Hant\">待會再說。先告訴我生雞肉是怎麼回事。</p></div></div><div class=\"chef-bubble william\"><strong>William:</strong><div class=\"bilingual\"><p lang=\"en\">I swear it’s not what it looks like! I was so careful — I always am. I had to edit the video because it was too long — I cut out the parts where I cleaned everything!</p><p class=\"translation\" lang=\"zh-Hant\">我保證不是看起來那樣！我一向很小心。影片太長，所以我剪掉了清潔各處的片段。</p></div></div><div class=\"chef-bubble archie\"><strong>Archie:</strong><div class=\"bilingual\"><p lang=\"en\">And the tea towel? Can you explain that?</p><p class=\"translation\" lang=\"zh-Hant\">那茶巾呢？你怎樣解釋？</p></div></div><div class=\"chef-bubble william\"><strong>William:</strong><div class=\"bilingual\"><p lang=\"en\">Honestly, I used a clean one! It just looks like I didn’t because I have 150 of the same kind! Don’t you remember? I showed them in my kitchen tour video.</p><p class=\"translation\" lang=\"zh-Hant\">我真的用了乾淨的一條！只是我有 150 條一模一樣的。你不記得我在廚房導覽影片展示過嗎？</p></div></div><div class=\"chef-bubble archie\"><strong>Archie:</strong><div class=\"bilingual\"><p lang=\"en\">Yes, but only your fans know about your other videos, not everybody! All right. Now that we’ve figured out what really happened I’ll get Nico to show our support on the website.</p><p class=\"translation\" lang=\"zh-Hant\">但只有你的粉絲看過其他影片，不是人人都知道。既然釐清真相，我會請 Nico 在網站表示支持。</p></div></div><div class=\"chef-bubble william\"><strong>William:</strong><div class=\"bilingual\"><p lang=\"en\">Thank you so much! Now let me pay you back: I have some news about the new show that I think might cheer up Dante.</p><p class=\"translation\" lang=\"zh-Hant\">謝謝！我有新節目的消息，Dante 聽到或許會高興。</p></div></div><div class=\"chef-bubble archie\"><strong>Archie:</strong><div class=\"bilingual\"><p lang=\"en\">Go on.</p><p class=\"translation\" lang=\"zh-Hant\">說吧。</p></div></div><div class=\"chef-bubble william\"><strong>William:</strong><div class=\"bilingual\"><p lang=\"en\">So, we planned to have a different mystery guest each week, right? Well, Mary Steward just called. She says she supports me, she wants to help and she wants to be my co-star!</p><p class=\"translation\" lang=\"zh-Hant\">原本每週有不同神秘嘉賓，對嗎？Mary Steward 剛來電。她支持我，願意幫忙並做我的聯合主持！</p></div></div><div class=\"chef-bubble archie\"><strong>Archie:</strong><div class=\"bilingual\"><p lang=\"en\">Mary Steward? The Queen of TV Cooking? As a co-star?! Well, she just might be able to save you! OK, let’s go with her as the co-star and forget the mystery guest idea. If she confirms soon, we absolutely must include this in the promotion video.</p><p class=\"translation\" lang=\"zh-Hant\">電視烹飪女王 Mary Steward？做聯合主持？她或許能挽回你的形象！好，就改由她聯合主持，取消神秘嘉賓。待她確認，宣傳片一定要提。</p></div></div><div class=\"chef-bubble william\"><strong>William:</strong><div class=\"bilingual\"><p lang=\"en\">Agreed. Thanks, Archie! That should get the voting hotline ringing!!!</p><p class=\"translation\" lang=\"zh-Hant\">同意！這應該會令投票熱線響個不停！</p></div></div><div class=\"chef-bubble archie\"><strong>Archie:</strong><div class=\"bilingual\"><p lang=\"en\">Did nobody tell you? We decided that viewers will be able to vote for free through the Teen NetChef TV app. We’ve cancelled the voting hotline.</p><p class=\"translation\" lang=\"zh-Hant\">沒人告訴你嗎？觀眾可以透過 Teen NetChef TV 應用程式免費投票；熱線已取消。</p></div></div><div class=\"chef-bubble william\"><strong>William:</strong><div class=\"bilingual\"><p lang=\"en\">Oh, I see. Good decision!</p><p class=\"translation\" lang=\"zh-Hant\">啊，明白了。好決定！</p></div></div></div></section>\n</div><details class=\"reference-scan\"><summary>核對原卷影像</summary><figure class=\"facsimile\"><img src=\"reference/assets/page-07.webp\" alt=\"Data File original page 40\" loading=\"lazy\"><figcaption>原卷影像供核對文字和版面</figcaption></figure></details></article>", "<article class=\"paper-page verified-reconstruction\" id=\"page-8\" data-kind=\"data\"><header><span>Data File · 第 8 頁</span><label><input type=\"checkbox\" data-read=\"8\"> 已讀</label></header><div class=\"native-document\" lang=\"en\"><div class=\"native-label\">原生文字重建</div><section class=\"recreated-page chef-email\" aria-label=\"Dante Cruz weekly email\"><h2>All staff weekly email from Dante Cruz</h2><div class=\"email-window\"><div class=\"email-toolbar\">File　 Message <span>Junk　 Delete　 Reply　 Reply All　 Forward　 Move　 Mark Unread　 Follow up</span></div><div class=\"email-headers\"><div><strong>To:</strong> All staff</div><div><strong>Sent:</strong> Thursday 20th April 2023 9:02 AM</div><div><strong>From:</strong> Dante Cruz</div><div><strong>Subject:</strong> Weekly Email</div></div><div class=\"email-content\"><div class=\"bilingual\"><p lang=\"en\">Dear All</p><p class=\"translation\" lang=\"zh-Hant\">各位同事：</p></div><div class=\"bilingual\"><p lang=\"en\">Great to hear that you’re all working hard to make our dreams for the new series of Live, Study, Cook a reality. Here are the latest initiatives to make sure that we all keep on track and strive to achieve:</p><p class=\"translation\" lang=\"zh-Hant\">很高興大家努力把《Live, Study, Cook》新一輯變成現實。以下是讓我們朝目標邁進的最新安排：</p></div><h3>1. Special training</h3><div class=\"bilingual\"><p lang=\"en\">Those of you who listened to the online staff meeting will have heard that we identified two areas of training that we need urgently. We have since decided to extend both of these to all staff, not just chefs.</p><p class=\"translation\" lang=\"zh-Hant\">網上會議提到兩項急需培訓的範疇。現決定把這兩項培訓擴展至全體員工，不只廚師。</p></div><h3>2. Food hygiene training</h3><div class=\"bilingual\"><p lang=\"en\">Similarly, staff are encouraged to do food hygiene training. As per our company policy on food hygiene, trainers for this course must be approved by the Health Advisory Board (HAB).</p><p class=\"translation\" lang=\"zh-Hant\">公司亦鼓勵員工參加食物衞生培訓。根據政策，導師必須獲 Health Advisory Board（HAB）認可。</p></div><h3>3. Annual Review Targets (ARTs)</h3><div class=\"bilingual\"><p lang=\"en\">I have informed Human Resources that all training will count as credit towards your Annual Review Targets (ARTs). These will look really good on an appraisal!</p><p class=\"translation\" lang=\"zh-Hant\">我已通知人事部，所有培訓都可計入年度考核目標（ARTs），有利工作評核。</p></div><h3>4. Viewer’s Choice — updates</h3><div class=\"email-update\"><strong>a)</strong><div class=\"bilingual\"><p lang=\"en\">I’m delighted to announce that Mary Steward has confirmed her availability for Viewer’s Choice!</p><p class=\"translation\" lang=\"zh-Hant\">Mary Steward 已確認能參與《Viewer’s Choice》。</p></div></div><div class=\"email-update\"><strong>b)</strong><div class=\"bilingual\"><p lang=\"en\">More exciting news: our Big Prize — the finished dish — will be delivered by the food delivery company FlyingFood using a drone. Cutting edge technology!</p><p class=\"translation\" lang=\"zh-Hant\">更令人興奮的是，大獎——完成的菜式——將由 FlyingFood 用無人機送遞。</p></div></div><div class=\"email-update\"><strong>c)</strong><div class=\"bilingual\"><p lang=\"en\">We’ve agreed that the main choice in Episode 1 will be between apple and blueberry filling. Yum! We should mention this in any promotional materials.</p><p class=\"translation\" lang=\"zh-Hant\">首集的主要選擇是蘋果或藍莓餡，宣傳材料應提及。</p></div></div><div class=\"bilingual\"><p lang=\"en\">Keep up the good work and Bon Appetit!</p><p class=\"translation\" lang=\"zh-Hant\">繼續努力，祝大家好胃口！</p></div><p>Dante Cruz</p></div></div></section>\n</div><details class=\"reference-scan\"><summary>核對原卷影像</summary><figure class=\"facsimile\"><img src=\"reference/assets/page-08.webp\" alt=\"Data File original page 41\" loading=\"lazy\"><figcaption>原卷影像供核對文字和版面</figcaption></figure></details></article>", "<article class=\"paper-page verified-reconstruction\" id=\"page-9\" data-kind=\"data\"><header><span>Data File · 第 9 頁</span><label><input type=\"checkbox\" data-read=\"9\"> 已讀</label></header><div class=\"native-document\" lang=\"en\"><div class=\"native-label\">原生文字重建</div><section class=\"recreated-page chef-courses\" aria-label=\"Corporate training intranet\"><h2>Corporate Training Intranet page</h2><div class=\"course-columns\"><article class=\"course-provider\"><small>Course Provider:</small><h3>Pinafore Solutions</h3><em>Life-Proof Professional Chef Training</em><div class=\"bilingual\"><p lang=\"en\">Pinafore Solutions offers training and development programmes for culinary staff.</p><p class=\"translation\" lang=\"zh-Hant\">Pinafore Solutions 為餐飲員工提供培訓及發展課程。</p></div><img class=\"course-symbols\" src=\"reference/assets/2023-b2-course-icons.webp\" alt=\"Original fire extinguisher, fire exit and chicken illustrations\"><h4>Available courses</h4><article class=\"course-row\"><h4>1. Advanced Fire Safety</h4><div class=\"bilingual\"><p lang=\"en\">This course will help develop and manage your staff in the realm of fire safety. We include helpful guidance on how to develop a fire plan as well as the important things to consider when training fire marshals. Finally, we’ve got you covered in maintaining those all-important emergency routes that could be vital in the survival of you and your employees. Sign up today!</p><p class=\"translation\" lang=\"zh-Hant\">訓練員工處理火警安全：制訂消防計劃、培訓防火員及維持緊急逃生路線。</p></div></article><article class=\"course-row\"><h4>2. Hazard Awareness</h4><div class=\"bilingual\"><p lang=\"en\">The kitchen is full of fire hazards and dangers. Can you recognise them all? A professional chef needs all the tricks of the trade to keep everyone safe. This course starts with how to use a fire extinguisher and moves on to how to keep fire exits clear — a must for the next culinary genius!</p><p class=\"translation\" lang=\"zh-Hant\">認識廚房火警風險，學習使用滅火筒及保持消防出口暢通。</p></div></article><article class=\"course-row\"><h4>3. Food Hygiene Basics</h4><div class=\"bilingual\"><p lang=\"en\">Our most popular course: see how to handle raw food and cook at a safe temperature. AFH approval pending!</p><p class=\"translation\" lang=\"zh-Hant\">基本食物衞生：處理生食及安全烹調溫度；AFH 認可尚在審批。</p></div></article></article><article class=\"course-provider\"><small>Course Provider:</small><h3>The Grill Gurus</h3><div class=\"bilingual\"><p lang=\"en\">Need comprehensive chef training for indoor and outdoor chefs? The Grill Gurus can help! Rest assured that your kitchen staff will know how to cook safely for happy kitchens, campfires and barbeques!</p><p class=\"translation\" lang=\"zh-Hant\">The Grill Gurus 為室內及戶外廚師提供全面的安全烹飪培訓。</p></div><div class=\"bilingual\"><p lang=\"en\">We run training sessions for the modern adventurous chef. All instructors are HAB approved.</p><p class=\"translation\" lang=\"zh-Hant\">所有導師均獲 HAB 認可。</p></div><h4>Courses</h4><article class=\"course-row\"><h4>A: The Chef’s Special</h4><div class=\"bilingual\"><p lang=\"en\">The ultimate food safety guide for adventurous chefs, including “Food Safety 101”: from the test kitchen to the plate™. “Keep it separate, stupid!” is our tongue-in-cheek guide to avoiding cross-contamination in the kitchen, while “Burn those bugs” explains the importance of safe cooking temperatures.</p><p class=\"translation\" lang=\"zh-Hant\">食物安全課程包括從測試廚房到餐桌、避免交叉污染及安全烹調溫度。</p></div></article><article class=\"course-row\"><h4>B: The Fire Chef’s Manual</h4><div class=\"bilingual\"><p lang=\"en\">We cover all the basics to make your alfresco cooking experience as safe as possible. Learn how to light a campfire safely, then we’ll get you ready to use a fire extinguisher when things go wrong. Putting out an oil fire is something that’s more difficult than it looks: we’ll guide you through the tricky process. Trust us to make sure only the food gets burnt™.</p><p class=\"translation\" lang=\"zh-Hant\">戶外烹飪安全：生營火、使用滅火筒及處理油鍋火警。</p></div></article></article></div><article class=\"course-provider wide\"><small>Course Provider:</small><h3>PR Productions</h3><em>Perfecting Dreams for Online Creators</em><div class=\"bilingual\"><p lang=\"en\">Let PR Productions pave your path to personal perfection! Online booking is now open. Each course features 5 hours of Zoom sessions with certified Social Media Influencers!</p><p class=\"translation\" lang=\"zh-Hant\">PR Productions 的網上預約已開放。每門課均有五小時 Zoom 課堂，由認證社交媒體意見領袖授課。</p></div><article class=\"course-row\"><h4>Option 1: Be Your Best!</h4><div class=\"bilingual\"><p lang=\"en\">We teach the importance of Crystal Clear Communication™: the art of only saying what you mean and meaning what you say. After this course, you’ll be a social media angel, showing your perfect self, all the time! Our previous graduates include stars of stage and screen, CEOs and KOLs. Yoga mums and fitness dads also welcome!</p><p class=\"translation\" lang=\"zh-Hant\">教授清晰溝通和社交媒體個人形象；過往學員包括藝人、行政總裁和意見領袖。</p></div></article><article class=\"course-row\"><h4>Option 2: Maximise My Money</h4><div class=\"bilingual\"><p lang=\"en\">How to turn your social media feed into a money-spinner? It’s not just about the way you sound, but what your customers can see. Join this course to write like a millionaire™ and monetise your brand today!</p><p class=\"translation\" lang=\"zh-Hant\">教授透過社交媒體文字與視覺內容打造品牌及賺取收益。</p></div></article></article></section>\n</div><details class=\"reference-scan\"><summary>核對原卷影像</summary><figure class=\"facsimile\"><img src=\"reference/assets/page-09.webp\" alt=\"Data File original page 42\" loading=\"lazy\"><figcaption>原卷影像供核對文字和版面</figcaption></figure></details></article>", "<article class=\"paper-page verified-reconstruction\" id=\"page-10\" data-kind=\"data\"><header><span>Data File · 第 10 頁</span><label><input type=\"checkbox\" data-read=\"10\"> 已讀</label></header><div class=\"native-document\" lang=\"en\"><div class=\"native-label\">原生文字重建</div><section class=\"recreated-page chef-reviews\" aria-label=\"Training course reviews\"><h2>Corporate Training: reviews from previous participants</h2><div class=\"review-list\"><article class=\"review-block\"><h3>Food Hygiene Basics</h3><div class=\"bilingual\"><p lang=\"en\">I loved, loved, loved this course. They went through everything, in lots of great detail. As a newly-trained chef, this is going to be a massive benefit to me. A bit of a shame that the instructors lost their HAB approval (they’re switching to AFH — the Association of Food Health — next year), but still totally worthwhile as they knew what they were doing.</p><p class=\"translation\" lang=\"zh-Hant\">內容詳盡，對新入行廚師很有幫助；但導師已失去 HAB 認可，明年轉用 AFH。</p></div><div class=\"bilingual\"><p lang=\"en\">The instructors gave out some really interesting tips on food safety. Although I liked the course, I thought it was a bit too short. It would have been better to have some time for questions at the end.</p><p class=\"translation\" lang=\"zh-Hant\">食物安全貼士有用，但課程略短，末段應留時間答問。</p></div></article><article class=\"review-block\"><h3>The Chef’s Special</h3><div class=\"bilingual\"><p lang=\"en\">Yes, great: no complaints. My boss made me do this course. I thought the “101” section, which focused on food hygiene, was really informative, and the “Keep it separate, stupid!” part made me laugh!</p><p class=\"translation\" lang=\"zh-Hant\">內容很好，食物衞生基礎單元資訊充實，防止交叉污染的部分也有趣。</p></div><div class=\"bilingual\"><p lang=\"en\">What a fab day! Great tips on how to have a food-safe kitchen. It mostly deals with work settings, though, so nothing I could use at home. Still, it will definitely have its uses in my cooking career as it comes with a professional qualification.</p><p class=\"translation\" lang=\"zh-Hant\">提供工作廚房食物安全貼士，亦可取得專業資格；家居用途較少。</p></div></article><article class=\"review-block\"><h3>Hazard Awareness</h3><div class=\"bilingual\"><p lang=\"en\">I was feeling really under the weather that day and my mum said I shouldn’t go, but I’m really glad I did in the end as this course has something for everyone, not just chefs. Perseverance really pays off in so many areas of life!</p><p class=\"translation\" lang=\"zh-Hant\">雖然當天不舒服，但慶幸參加；課程適合所有人，不限廚師。</p></div></article><article class=\"review-block\"><h3>The Fire Chef’s Manual</h3><div class=\"bilingual\"><p lang=\"en\">This was awesome. Jake, the instructor, was super knowledgeable and answered all my questions. He’s a surfer, just like me, so it was really useful to learn about cooking on the beach over an open-air fire. Paradise! My buddy Steve says he thought it was a waste of time because he works at an indoor kitchen. I told him to change jobs! Ha!</p><p class=\"translation\" lang=\"zh-Hant\">導師知識豐富；課程對海灘營火烹飪有用，但室內廚房員工可能用不上。</p></div></article><article class=\"review-block\"><h3>Advanced Fire Safety</h3><div class=\"bilingual\"><p lang=\"en\">Lots of information, but it’s really only for management-level staff, not for everyone, even though that’s not clear in the course description. I actually fell asleep in the boring online sessions. Must do better, Pinafore Solutions!</p><p class=\"translation\" lang=\"zh-Hant\">資訊多，但主要適合管理層，而課程介紹沒有說清楚；網課頗沉悶。</p></div><div class=\"bilingual\"><p lang=\"en\">I understand that fire marshal training is a very serious issue, and we need to train staff properly, but do we really need 25 hours of online talks for this? Inefficient and expensive.</p><p class=\"translation\" lang=\"zh-Hant\">防火員培訓重要，但二十五小時網上講座耗時費錢。</p></div></article><article class=\"review-block\"><h3>Be Your Best!</h3><div class=\"bilingual\"><p lang=\"en\">O.M.Gosh! What a wonderful course. I’m a fashion blogger and this has already improved my videos. Life’s so much easier now! Also, Jinny, who runs the course, is lovely! Her happy smile kept me motivated day after day.</p><p class=\"translation\" lang=\"zh-Hant\">時尚博客認為課程改善了影片，導師也親切。</p></div><div class=\"bilingual\"><p lang=\"en\">This course is absolutely not just for social media stars: I work in PR as well as being a vlogger. Before, I had real trouble communicating in work meetings — not anymore! That purple backdrop was to die for as well — you’ll see what I mean when you log in for the first time. You’re welcome!</p><p class=\"translation\" lang=\"zh-Hant\">公關與影片博客也受惠，尤其改善了工作會議中的溝通。</p></div></article><article class=\"review-block\"><h3>Maximise My Money</h3><div class=\"bilingual\"><p lang=\"en\">Such a good course — the tips really helped me to maximise my brand and start raking in the profit. I blew my competitors out of the water with deftly-crafted written text and some stunning visuals. Take this together with PR Productions’ course on communication and you’ll be the complete package.</p><p class=\"translation\" lang=\"zh-Hant\">課程幫助個人品牌盈利，透過精心撰寫的文字與視覺內容勝過競爭對手。</p></div></article></div><p class=\"source-end\">THIS IS THE LAST PAGE OF THE PART B2 DATA FILE</p></section>\n</div><details class=\"reference-scan\"><summary>核對原卷影像</summary><figure class=\"facsimile\"><img src=\"reference/assets/page-10.webp\" alt=\"Data File original page 43\" loading=\"lazy\"><figcaption>原卷影像供核對文字和版面</figcaption></figure></details></article>", "<article class=\"paper-page verified-reconstruction\" id=\"page-11\" data-kind=\"qab\"><header><span>Question-Answer Book · 第 1 頁</span><label><input type=\"checkbox\" data-read=\"11\"> 已讀</label></header><div class=\"native-document\" lang=\"en\"><div class=\"native-label\">原生文字重建</div><section class=\"recreated-page answer-book chef-answer\" aria-label=\"Task 8: Website announcement\"><div class=\"qab-heading\"><span>HKDSE 2023 · ENGLISH LANGUAGE · PAPER 3 PART B2</span><strong>B2 · DIFFICULT SECTION</strong></div><h2>Task 8: Website announcement <small>(19 marks)</small></h2><div class=\"bilingual\"><p lang=\"en\">Write an announcement for the Teen NetChef TV website in support of William Puddle. Use the information from the B2 Data File and your notes. Write around 200 words.</p><p class=\"translation\" lang=\"zh-Hant\">為 Teen NetChef TV 網站寫公告，支持 William Puddle。運用乙部二資料檔及筆記，約 200 字。</p></div><label class=\"answer-field\" for=\"2023-b2-11-response\">Website announcement</label><textarea class=\"answer-box\" id=\"2023-b2-11-response\" data-note=\"11-response\" data-count-id=\"2023-b2-11-response\" style=\"min-height:620px\" aria-label=\"Website announcement\"></textarea><p class=\"answer-count\" data-count-for=\"2023-b2-11-response\">0 words</p></section>\n</div><details class=\"reference-scan\"><summary>核對原卷影像</summary><figure class=\"facsimile\"><img src=\"reference/assets/page-11.webp\" alt=\"Question-Answer Book original page 26\" loading=\"lazy\"><fig         link.href='benchmark.pdf?v=audited-v6#page='+page;
        link.textContent='對照審訂教材 · 第 '+page+' 頁';guide.append(link);
      }
      const phase=routePhase();
      if(opened && phase==='visit'){
        const page=Number(E('refs').querySelector('[data-destination]').dataset.destination);
        $s('#curation-source').textContent='Data File 第 '+page+' 頁 · 由第 '+row.leaf+' 頁前往';
        $s('#curation-title').textContent='資料指路 · '+pageRouteTitles[page];
        $s('#curation-quote').textContent=row.q;
        guide.replaceChildren();
        const why=document.createElement('p');why.className='curation-process';why.textContent=row.a;
        const back=document.createElement('p');back.textContent='先辨認文件及來源。下一步返回第 '+row.leaf+' 頁的提示句。';
        guide.append(why,back);$s('#curation-step-actions').replaceChildren();
        $s('#curation-next').textContent='返回原句 →';$s('#curation-prev').disabled=false;
        $s('#curation-step-jump').textContent+=' · 來源頁';
      }else if(opened && phase==='returned'){
        const arrow=$s('#curation-step-actions [data-destination]');if(arrow)arrow.dataset.seen='1';
        $s('#curation-step-jump').textContent+=' · 已返回';
      }
      if(key!==lastStep) $s('.curation-content').scrollTop=0;
      schedule(key!==lastStep);lastStep=key;
    }
  };
  for (const event of ['resize','scroll']) window.addEventListener(event,()=>schedule(event==='resize'),{passive:true,capture:true});
  $s('#curation-spotlight').addEventListener('change',()=>schedule(true));
  new ResizeObserver(()=>schedule(true)).observe(dock);
  window.addEventListener('load',()=>schedule(true));
  const unknownSave=savedEntry23 && entry23(savedEntry23)<0;
  if(unknownSave)jump23(0);
  update23(true);
  if(unknownSave){
    const status=$s('#curation-save-status');
    status.textContent='原有步驟已更新，已返回任務指示。草稿及筆記仍可使用。';
    status.dataset.noticeUntil=String(Date.now()+10000);
  }
  if($s('#curation-step-jump').textContent.trim() && $s('#curation-bank-groups').children.length===3)
    document.documentElement.removeAttribute('data-loading');
})();
</script></html>
