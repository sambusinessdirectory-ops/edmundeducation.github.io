<!doctype html><html lang=zh-Hant><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>2023 B2 · Super Curation</title><style>*{box-sizing:border-box}body{margin:0;background:#fffdf8;color:#17332d;font:16px/1.6 system-ui}header,nav{padding:10px 2vw;background:#133e38;color:white}nav{position:sticky;top:0;z-index:2}button,select{padding:7px;margin:2px;cursor:pointer}main{display:grid;grid-template-columns:minmax(240px,1fr) 2fr minmax(180px,.8fr);gap:16px;padding:16px}article,aside{border:1px solid #b7c7b8;border-radius:10px;padding:14px}blockquote{font:20px/1.5 Georgia;margin:10px 0;padding:10px;background:#f5f0e2}iframe{width:100%;height:70vh;border:0}textarea{width:100%;min-height:10em}mark{background:var(--ink)}.noise{text-decoration:line-through #c7222c 3px}dialog{width:min(650px,90vw)}@media(max-width:850px){main{display:block}iframe{height:50vh}}.rail{display:flex;justify-content:space-around;background:#fffdf8}.rail button{border:0;background:transparent;color:#155747}.rail .current{background:#efbf3a}.paper{white-space:pre-wrap;background:#fffdf8;padding:16px;font:17px/1.65 Georgia;max-height:70vh;overflow:auto}.spent{text-decoration:line-through #cb2530 3px}.applied,.noise{background-image:linear-gradient(#246fbd,#246fbd)!important;background-size:100% 3px!important;background-position:left center!important;background-repeat:no-repeat!important;animation:ink .85s}.noise{background-image:linear-gradient(#c7222c,#c7222c)!important}@keyframes ink{from{background-size:0 3px}to{background-size:100% 3px}}#player{position:sticky;top:95px;z-index:4;background:#e6f4ef;border:1px solid #288578;border-radius:12px;padding:8px}#seek{width:45%}#trans{position:fixed;z-index:3;right:12px;top:34vh;width:min(420px,44vw);height:46vh;resize:both;overflow:auto;background:#fffdf8;box-shadow:0 8px 30px #1234}#trans header{position:sticky;top:0;cursor:move;touch-action:none}#turns{padding:10px}#notes23 p{padding:5px}button:focus-visible{outline:3px solid #287a70}</style><link rel="stylesheet" href="reader.css"><header><b>2023 HKDSE · Paper 3 B2</b>　Teen NetChef TV</header><nav><select id=stage></select><button id=prev>← 上一步</button><button id=next>下一步 →</button><span id=count></span></nav><main><article><small id=meta></small><blockquote id=q></blockquote><p id=a></p><div id=refs></div><textarea hidden id=draft placeholder="在此寫初稿"></textarea></article><section><h3 id=title></h3><iframe id=pdf title="原頁"></iframe><a id=open target=_blank>另開原頁</a></section><aside><b>證據庫</b><div id=bank></div></aside></main><dialog id=pop><button onclick="pop.close()">關閉</button><iframe id=src title="核對原文"></iframe></dialog><script>const savedEntry23=localStorage.getItem("cur23-stable"),savedAudio23=localStorage.getItem("cur23-audioState"),savedUse23=localStorage.getItem("cur23-stableUse");const rows=[{"stage": 0, "p": 2, "leaf": 2, "t": 5, "q": "You are Nico Lin", "a": "先搵作者：三份文稿均以 Nico 的公司員工身分完成。"}, {"stage": 0, "p": 4, "leaf": 4, "t": 1, "q": "announcement for our website", "a": "公開網站公告，讀者包括看過影片的公眾。"}, {"stage": 0, "p": 4, "leaf": 4, "t": 1, "q": "show our support", "a": "公司要表達支持，但水浸確實發生。"}, {"stage": 0, "p": 4, "leaf": 4, "t": 5, "q": "see the article from Big Cheese Celebrity Food Gossip", "a": "先讀小報，辨認指控的來源。"}, {"stage": 0, "p": 4, "leaf": 4, "t": 1, "q": "present his side of the story", "a": "再查當事人解釋，不能只憑片段定論。"}, {"stage": 0, "p": 4, "leaf": 4, "t": 1, "q": "acknowledge and explain William’s mistake", "a": "承認並解釋真正的錯誤。"}, {"stage": 0, "p": 4, "leaf": 4, "t": 1, "q": "explain the misunderstandings", "a": "逐項澄清其他誤會。"}, {"stage": 0, "p": 4, "leaf": 4, "t": 2, "q": "an email to all staff", "a": "電郵寫給全體員工，稱呼和語氣要合適。"}, {"stage": 0, "p": 4, "leaf": 4, "t": 2, "q": "recommend training courses for the coming year", "a": "提出明年的培訓建議。"}, {"stage": 0, "p": 4, "leaf": 4, "t": 2, "q": "Three courses will be enough", "a": "揀三個符合員工需要的課程。"}, {"stage": 0, "p": 4, "leaf": 4, "t": 2, "q": "explain how their work will benefit from each one", "a": "每個課程都要連結實際工作得益。"}, {"stage": 0, "p": 4, "leaf": 4, "t": 5, "q": "Corporate Training Intranet page, along with reviews", "a": "分開供應商宣傳與參加者的個人意見。"}, {"stage": 0, "p": 4, "leaf": 4, "t": 3, "q": "script for the promotional video", "a": "以畫面卡及旁白推廣新節目。"}, {"stage": 0, "p": 4, "leaf": 4, "t": 5, "q": "we’ve made several changes since that draft", "a": "故事板屬初稿，須再核對。"}, {"stage": 0, "p": 4, "leaf": 4, "t": 3, "q": "both William and Dante giving some updates", "a": "比較聊天與最新電郵，先確認再宣傳。"}, {"stage": 0, "p": 4, "leaf": 4, "t": 5, "q": "Listen to our discussion", "a": "會議錄音補充三項任務。"}, {"stage": 1, "p": 5, "leaf": 5, "t": 5, "q": "Big Cheese Celebrity Food Gossip article", "a": "小報列出觀眾指控，仍須用聊天紀錄查證。", "tag": "A"}, {"stage": 1, "p": 6, "leaf": 6, "t": 5, "q": "Draft storyboard for the promotional video, with Dante Cruz’s comments", "a": "故事板列出節目構思，但部分安排會改。", "tag": "C"}, {"stage": 1, "p": 7, "leaf": 7, "t": 5, "q": "Chat between William Puddle and Archie Li", "a": "先由 William 親述水浸及茶巾事件。", "tag": "A"}, {"stage": 1, "p": 8, "leaf": 8, "t": 5, "q": "All staff weekly email from Dante Cruz", "a": "先按員工培訓需要閱讀。", "tag": "B"}, {"stage": 1, "p": 9, "leaf": 9, "t": 5, "q": "Corporate Training Intranet page", "a": "對照公司要求逐一篩選。", "tag": "B"}, {"stage": 1, "p": 10, "leaf": 10, "t": 5, "q": "Corporate Training: reviews from previous participants", "a": "留意哪些是參加者意見。", "tag": "B"}, {"stage": 1, "p": 3, "leaf": 3, "t": 5, "q": "Listening note-taking sheet for online staff meeting", "a": "按欄目預備聆聽，聽到答案才落筆。", "tag": "A/B/C"}, {"stage": 1, "p": 7, "leaf": 7, "t": 3, "q": "new show", "a": "追加 C：同一段聊天後半轉談節目。"}, {"stage": 1, "p": 8, "leaf": 8, "t": 3, "q": "Viewer’s Choice — updates", "a": "追加 C：員工電郵也確認嘉賓、餡料和運送方法。"}, {"stage": 1, "p": 3, "leaf": 3, "t": 5, "q": "Live, Study, Cook", "a": "聆聽時要記錄；不放進三篇 B2 文稿。"}, {"stage": 1, "p": 3, "leaf": 3, "t": 5, "q": "Filming schedule", "a": "聆聽時要記錄；不放進三篇 B2 文稿。"}, {"stage": 1, "p": 3, "leaf": 3, "t": 5, "q": "Kinds of food in the competition", "a": "聆聽時要記錄；不放進三篇 B2 文稿。"}, {"stage": 1, "p": 3, "leaf": 3, "t": 5, "q": "William Puddle’s viral video", "a": "A：分開真錯誤與誤會。"}, {"stage": 1, "p": 3, "leaf": 3, "t": 5, "q": "Golden Sun Tower Private Kitchen complaints", "a": "B：防火培訓與工作需要。"}, {"stage": 1, "p": 3, "leaf": 3, "t": 5, "q": "New show: Viewer’s Choice", "a": "C：留意直播與投票方式。"}, {"stage": 2, "p": 3, "t": 5, "q": "Online staff meeting", "a": "聽錄音，核對講者、最終決定和寫作任務。"}, {"stage": 3, "p": 5, "leaf": 5, "t": 5, "q": "Puddle Starts a Flood!", "a": "標題是小報包裝；可引出公眾疑慮，不能把「醜聞」當成原文逐字引述。", "state": "CLAIM", "topic": 1}, {"stage": 3, "p": 5, "leaf": 5, "t": 4, "q": "Viewers expressed shock on Monday at the disasters that befell celebrity chef William Puddle in the Teen NetChef TV test kitchen. The video, showing a series of calamitous mistakes, quickly went viral after appearing on Puddle’s social media accounts.", "a": "交代公告背景；病毒式傳播不證明所有被指行為真的發生。", "state": "CURRENT", "topic": 1}, {"stage": 3, "p": 5, "leaf": 5, "t": 1, "q": "After about thirty seconds, Puddle finally realises his big mistake. The floor is flooded and Puddle is even seen apparently slipping in the mess as he reaches for the tap.", "a": "水浸是真錯誤。apparently slipping 應譯作「看來滑倒／似乎正在滑倒」，不是「差點滑倒」。", "state": "CLAIM", "topic": 1}, {"stage": 3, "p": 5, "leaf": 5, "t": 1, "q": "Puddle’s poor performance didn’t end there: viewers noticed that after turning off the tap and cleaning up the floor, Puddle chops up some raw chicken. He then starts slicing up the other ingredients without washing his hands.", "a": "保留文章指控，再用後續聊天與官方分點澄清；聊天原句是剪掉清潔片段，不是逐字說「洗手」。", "state": "CLAIM", "topic": 1}, {"stage": 3, "p": 5, "leaf": 5, "t": 4, "q": "Experts agree that these shocking safety mistakes set a terrible example to other chefs, especially younger fans.", "a": "「專家一致認為」屬小報聲稱；Cooke 是競爭節目廚師，不能當作已證實的專家共識。", "state": "CLAIM", "topic": 1}, {"stage": 3, "p": 5, "leaf": 5, "t": 1, "q": "Puddles of tearsPerhaps realising his downfall, Puddle even appears to be crying towards the end of the video. He starts wiping his face with a tea towel, the same one he used to dry the raw chicken.", "a": "文章聲稱「同一條」茶巾，譯文不可先加「似乎」。分析再指出清潔茶巾與洋蔥的澄清。", "state": "CLAIM", "topic": 1}, {"stage": 3, "p": 5, "leaf": 5, "t": 1, "q": "“His eyes were clearly watering in the video. Someone should not be around dangerous cooking appliances and sharp knives if they can’t control their emotions,” said Cooke.", "a": "這是對 William 情緒的指控，可用來引出澄清；「沒有難過」是合理解說，非必須逐字分點。", "state": "CLAIM", "topic": 1}, {"stage": 3, "p": 5, "leaf": 5, "t": 6, "q": "Neither Puddle, nor the director of Teen NetChef TV, Mr Dante Cruz, could be reached for comment.", "a": "沒有回應與新節目流言不是公告所需的已證實辯護材料；避免加寫猜測。", "state": "EXCLUDED", "topic": 1}, {"stage": 3, "p": 6, "leaf": 6, "t": 5, "q": "Frame 3A little unclear — just explain who chooses what.", "a": "提示要把「觀眾選食材」說清楚；單靠批註仍未交代完整機制。", "state": "NAV", "topic": 3}, {"stage": 3, "p": 6, "leaf": 6, "t": 5, "q": "Viewer’s Choice — Ground-breaking TV!", "a": "節目名稱可保留；「創新」必須由互動及直播兩項具體原因支持。", "state": "NAV", "topic": 3}, {"stage": 3, "p": 6, "leaf": 6, "t": 5, "q": "Our regular chef, plus one mystery guest each week", "a": "神秘嘉賓方案已取消。不可寫進最終講稿；Mary 的確認須看後來電郵。", "state": "SUPERSEDED", "topic": 3}, {"stage": 3, "p": 6, "leaf": 6, "t": 5, "q": "3. The choices", "a": "單一標題只是導航，沒有說明誰選甚麼；不可獨立標為直接得分內容。", "state": "NAV", "topic": 3}, {"stage": 3, "p": 6, "leaf": 6, "t": 3, "q": "Episode 1 is called “Fruit Pie”", "a": "第一集水果批可用；蘋果／藍莓餡料的最終選項由後來電郵補足。", "state": "CURRENT", "topic": 3}, {"stage": 3, "p": 6, "leaf": 6, "t": 5, "q": "The voting hotline number will be on the screen in each episode.", "a": "熱線已取消；保留觀眾投票概念，但把方法更新為免費使用 Teen NetChef TV app。", "state": "SUPERSEDED", "topic": 3}, {"stage": 3, "p": 6, "leaf": 6, "t": 5, "q": "6. The finished dish", "a": "單獨標題未構成完整獎品關係；須與幸運投票者及後來交付資料合讀。", "state": "NAV", "topic": 3}, {"stage": 3, "p": 6, "leaf": 6, "t": 3, "q": "One lucky voter: Message: You’ve won!", "a": "一名投票者贏得完成菜式，此核心後來未取消；要保留「一名」與獎品。", "state": "CURRENT", "topic": 3}, {"stage": 3, "p": 6, "leaf": 6, "t": 5, "q": "Frame 8Check which delivery company — some exciting news on this soon!", "a": "圖稿只提示送遞；最終 FlyingFood 及無人機方式由後來電郵確認。", "state": "NAV", "topic": 3}, {"stage": 3, "p": 7, "leaf": 7, "t": 1, "q": "William:I’m so sorry! This was my mistake. I forgot to turn off the tap! We’ve just switched from an automatic tap to a manual one and I forgot it wouldn’t turn off by itself! I thought everyone would see the funny side! What did Dante say? Am I still the star of Viewer’s Choice?", "a": "William 忘記關水；「we」指公司／團隊更換自動水龍頭，公告不可暗示由 William 一人更換。", "state": "CURRENT", "topic": 1}, {"stage": 3, "p": 7, "leaf": 7, "t": 4, "q": "William:I’m so sorry! This was my mistake. I forgot to turn off the tap! We’ve just switched from an automatic tap to a manual one and I forgot it wouldn’t turn off by itself! I thought everyone would see the funny side! What did Dante say? Am I still the star of Viewer’s Choice?", "a": "個人反應有助理解處境，但不是為水浸辯護或 Task 8 的獨立分點。", "state": "CONTEXT", "topic": 1}, {"stage": 3, "p": 7, "leaf": 7, "t": 1, "q": "William:I swear it’s not what it looks like! I was so careful — I always am. I had to edit the video because it was too long — I cut out the parts where I cleaned everything!", "a": "可結合官方 8.5 說明洗手畫面被剪走；不要把「washed his hands」冒稱聊天逐字原句。", "state": "CURRENT", "topic": 1}, {"stage": 3, "p": 7, "leaf": 7, "t": 1, "q": "William:Honestly, I used a clean one! It just looks like I didn’t because I have 150 of the same kind! Don’t you remember? I showed them in my kitchen tour video.", "a": "先指出擦面茶巾乾淨，再交代 150 條外觀相同，完整回應「同一條」誤會。", "state": "CURRENT", "topic": 1}, {"stage": 3, "p": 7, "leaf": 7, "t": 4, "q": "Archie:Yes, but only your fans know about your other videos, not everybody! All right. Now that we’ve figured out what really happened I’ll get Nico to show our support on the website.", "a": "支持公告的公司立場可推得；不要把推論寫成額外官方內容分點。", "state": "CURRENT", "topic": 1}, {"stage": 3, "p": 7, "leaf": 7, "t": 5, "q": "Archie:Mary Steward? The Queen of TV Cooking? As a co-star?! Well, she just might be able to save you! OK, let’s go with her as the co-star and forget the mystery guest idea. If she confirms soon, we absolutely must include this in the promotion video.", "a": "聊天階段仍待 Mary 確認。先標作暫定，再用 Dante 電郵確認後才在講稿寫成事實。", "state": "CONDITIONAL", "topic": 3}, {"stage": 3, "p": 7, "leaf": 7, "t": 3, "q": "Archie:Did nobody tell you? We decided that viewers will be able to vote for free through the Teen NetChef TV app. We’ve cancelled the voting hotline.", "a": "正式投票方法為 Teen NetChef TV app，免費；舊熱線不能同時保留。", "state": "CURRENT", "topic": 3}, {"stage": 3, "p": 8, "leaf": 8, "t": 6, "q": "Great to hear that you’re all working hard to make our dreams for the new series of Live, Study, Cook a reality. Here are the latest initiatives to make sure that we all keep on track and strive to achieve:", "a": "另一節目問候語，不轉入三篇答案。", "state": "EXCLUDED", "topic": 2}, {"stage": 3, "p": 8, "leaf": 8, "t": 5, "q": "Those of you who listened to the online staff meeting will have heard that we identified two areas of training that we need urgently. We have since decided to extend both of these to all staff, not just chefs.", "a": "確立 Task 9 的全員讀者與選課需要；本身不是第九個官方分點。", "state": "CURRENT", "topic": 2}, {"stage": 3, "p": 8, "leaf": 8, "t": 5, "q": "Similarly, staff are encouraged to do food hygiene training. As per our company policy on food hygiene, trainers for this course must be approved by the Health Advisory Board (HAB).", "a": "食品衞生導師須有 HAB 認可；用作比較課程的硬條件。", "state": "CURRENT", "topic": 2}, {"stage": 3, "p": 8, "leaf": 8, "t": 2, "q": "I have informed Human Resources that all training will count as credit towards your Annual Review Targets (ARTs). These will look really good on an appraisal!", "a": "每項培訓均計入 Annual Review Targets；這是一般獎勵，不是某一課程的專屬技能。", "state": "CURRENT", "topic": 2}, {"stage": 3, "p": 8, "leaf": 8, "t": 3, "q": "a)I’m delighted to announce that Mary Steward has confirmed her availability for Viewer’s Choice!", "a": "解除聊天階段的待確認狀態；最終講稿可明言 Mary 是聯合主持／co-star。", "state": "CURRENT", "topic": 3}, {"stage": 3, "p": 8, "leaf": 8, "t": 3, "q": "b)More exciting news: our Big Prize — the finished dish — will be delivered by the food delivery company FlyingFood using a drone. Cutting edge technology!", "a": "Big Prize 是完成菜式，由 FlyingFood 以無人機送達；公司與方式都要準確。", "state": "CURRENT", "topic": 3}, {"stage": 3, "p": 8, "leaf": 8, "t": 3, "q": "c)We’ve agreed that the main choice in Episode 1 will be between apple and blueberry filling. Yum! We should mention this in any promotional materials.", "a": "第一集 Fruit Pie 的主要選擇是蘋果或藍莓餡料，不是任意水果口味。", "state": "CURRENT", "topic": 3}, {"stage": 3, "p": 9, "leaf": 9, "t": 2, "q": "Course Provider:Pinafore Solutions", "a": "提供者名稱屬官方 9.1 的推薦內容，不能只標為「背景提示」。", "state": "CURRENT", "topic": 2}, {"stage": 3, "p": 9, "leaf": 9, "t": 5, "q": "1. Advanced Fire Safety", "a": "管理層、防火計劃與 fire marshal 重點較窄；不及全員實用的 Hazard Awareness。", "state": "REJECT", "topic": 2}, {"stage": 3, "p": 9, "leaf": 9, "t": 2, "q": "2. Hazard Awareness", "a": "選用防火及廚房安全課程；保留滅火筒和暢通走火通道兩項技能。", "state": "CURRENT", "topic": 2}, {"stage": 3, "p": 9, "leaf": 9, "t": 5, "q": "Our most popular course: see how to handle raw food and cook at a safe temperature. AFH approval pending!", "a": "AFH 待批不等於 HAB 認可；後來評語更指出導師失去 HAB 認可。", "state": "REJECT", "topic": 2}, {"stage": 3, "p": 9, "leaf": 9, "t": 5, "q": "We run training sessions for the modern adventurous chef. All instructors are HAB approved.", "a": "所有導師具 HAB 認可，符合公司食品衞生政策；支持選擇 The Chef’s Special。", "state": "CURRENT", "topic": 2}, {"stage": 3, "p": 9, "leaf": 9, "t": 2, "q": "A: The Chef’s Special", "a": "交叉污染、安全烹調溫度與食物安全廚房三點可轉化為工作裨益。", "state": "CURRENT", "topic": 2}, {"stage": 3, "p": 9, "leaf": 9, "t": 5, "q": "B: The Fire Chef’s Manual", "a": "露天／營火重點較不切合一般室內廚房需要；不是最佳三選之一。", "state": "REJECT", "topic": 2}, {"stage": 3, "p": 9, "leaf": 9, "t": 2, "q": "Course Provider:PR Productions", "a": "提供者名稱是官方 9.5 所需資訊；社交媒體方向由課程說明補足。", "state": "CURRENT", "topic": 2}, {"stage": 3, "p": 9, "leaf": 9, "t": 2, "q": "Option 1: Be Your Best!", "a": "課程與提供者、清楚表達及避免網上誤解／冒犯，均可直接用於 Task 9。", "state": "CURRENT", "topic": 2}, {"stage": 3, "p": 9, "leaf": 9, "t": 5, "q": "Option 2: Maximise My Money", "a": "重點是品牌盈利，不是當下迫切的清楚溝通需要。", "state": "REJECT", "topic": 2}, {"stage": 3, "p": 10, "leaf": 10, "t": 5, "q": "I loved, loved, loved this course. They went through everything, in lots of great detail. As a newly-trained chef, this is going to be a massive benefit to me. A bit of a shame that the instructors lost their HAB approval (they’re switching to AFH — the Association of Food Health — next year), but still totally worthwhile as they knew what they were doing.", "a": "評語揭示導師失去 HAB 認可；正面感受不能推翻公司政策。", "state": "REJECT", "topic": 2}, {"stage": 3, "p": 10, "leaf": 10, "t": 4, "q": "The instructors gave out some really interesting tips on food safety. Although I liked the course, I thought it was a bit too short. It would have been better to have some time for questions at the end.", "a": "可記錄參加者讚賞，但課程仍不符合 HAB 條件，不列入三項推薦。", "state": "ATTRIBUTED", "topic": 2}, {"stage": 3, "p": 10, "leaf": 10, "t": 4, "q": "What a fab day! Great tips on how to have a food-safe kitchen. It mostly deals with work settings, though, so nothing I could use at home. Still, it will definitely have its uses in my cooking career as it comes with a professional qualification.", "a": "食安貼士與專業資格是參加者說法；可作輔助例子，不是官方必須分點或普遍保證。", "state": "ATTRIBUTED", "topic": 2}, {"stage": 3, "p": 10, "leaf": 10, "t": 4, "q": "I was feeling really under the weather that day and my mum said I shouldn’t go, but I’m really glad I did in the end as this course has something for everyone, not just chefs. Perseverance really pays off in so many areas of life!", "a": "一位參加者認為課程適合不同員工；不能推論「所有員工都一定適合」。", "state": "ATTRIBUTED", "topic": 2}, {"stage": 3, "p": 10, "leaf": 10, "t": 5, "q": "This was awesome. Jake, the instructor, was super knowledgeable and answered all my questions. He’s a surfer, just like me, so it was really useful to learn about cooking on the beach over an open-air fire. Paradise! My buddy Steve says he thought it was a waste of time because he works at an indoor kitchen. I told him to change jobs! Ha!", "a": "室內廚房員工覺得不切合，是選課反證；不可推論公司所有員工只在室內工作。", "state": "REJECT", "topic": 2}, {"stage": 3, "p": 10, "leaf": 10, "t": 5, "q": "Lots of information, but it’s really only for management-level staff, not for everyone, even though that’s not clear in the course description. I actually fell asleep in the boring online sessions. Must do better, Pinafore Solutions!", "a": "評語指向管理層及長時間講座；與全員需要較不吻合。", "state": "REJECT", "topic": 2}, {"stage": 3, "p": 10, "leaf": 10, "t": 4, "q": "This course is absolutely not just for social media stars: I work in PR as well as being a vlogger. Before, I had real trouble communicating in work meetings — not anymore! That purple backdrop was to die for as well — you’ll see what I mean when you log in for the first time. You’re welcome!", "a": "一位兼任 PR 的參加者稱工作會議溝通改善；只可作個人經驗，不可保證全體同效。", "state": "ATTRIBUTED", "topic": 2}, {"stage": 3, "p": 10, "leaf": 10, "t": 5, "q": "Such a good course — the tips really helped me to maximise my brand and start raking in the profit. I blew my competitors out of the water with deftly-crafted written text and some stunning visuals. Take this together with PR Productions’ course on communication and you’ll be the complete package.", "a": "品牌變現與寫作視覺策略屬商業推廣，偏離本次急需的溝通技能。", "state": "REJECT", "topic": 2}, {"stage": 4, "p": 7, "t": 1, "q": "網站公告", "a": "先按讀者及目的完成初稿，再核對參考答案。", "draft": true, "refs": [], "used": []}, {"stage": 4, "p": 7, "t": 1, "q": "Public announcement concerning the accusations against William Puddle Teen NetChef TV supports William Puddle following the circulation of his recent cooking video.", "a": "用 following 交代發布公告的起因，首句表明公司支持 William。", "refs": [], "used": [], "pattern": "following the circulation of"}, {"stage": 4, "p": 7, "t": 1, "q": "The footage shows a genuine mistake, but several other allegations arise from missing context.", "a": "用 but 分開兩個判斷：水浸屬實，其他指控要逐一查證。", "refs": [], "used": [], "pattern": "but"}, {"stage": 4, "p": 7, "t": 1, "q": "William did flood the test kitchen.", "a": "did 加原形動詞，強調公司確實承認水浸。", "refs": [], "used": [], "pattern": "did flood"}, {"stage": 4, "p": 7, "t": 1, "q": "He forgot to turn off the tap after we had replaced an automatic tap with a manual one; he expected it to shut off by itself.", "a": "過去完成式指出先換水龍頭，後來才忘記關水。", "refs": [], "used": [1], "pattern": "after we had replaced"}, {"stage": 4, "p": 7, "t": 1, "q": "He accepts responsibility for this error, and we regret the mistake.", "a": "分開 William 承擔責任與公司表達遺憾的聲音。", "refs": [], "used": [], "pattern": "accepts responsibility"}, {"stage": 4, "p": 7, "t": 1, "q": "Some viewers believe he handled raw chicken and then continued preparing food without washing his hands.", "a": "先把指控歸於部分觀眾，避免寫成已證實的事實。", "refs": [], "used": [], "pattern": "Some viewers believe"}, {"stage": 4, "p": 7, "t": 1, "q": "In fact, he washed them; the footage of that step was removed when the lengthy video was edited.", "a": "轉入澄清。聊天證實剪片時刪走清潔過程；洗手細節要合讀評分資料。", "refs": [], "used": [2], "pattern": "In fact"}, {"stage": 4, "p": 7, "t": 1, "q": "Others believe he used the same tea towel to dry the raw chicken and wipe his face.", "a": "承接上一項觀眾看法，另起一項茶巾指控。", "refs": [], "used": [], "pattern": "Others believe"}, {"stage": 4, "p": 7, "t": 1, "q": "He used a clean towel to wipe his face.", "a": "直接回應茶巾是否乾淨，先交代事實。", "refs": [], "used": [3], "pattern": "used a clean towel"}, {"stage": 4, "p": 7, "t": 1, "q": "Because he owns 150 towels of the same kind, the two looked alike on screen.", "a": "先給原因，再解釋兩條茶巾在畫面上為何看似相同。", "refs": [], "used": [4], "pattern": "Because"}, {"stage": 4, "p": 7, "t": 1, "q": "Finally, some viewers thought William was crying because he was upset.", "a": "用 thought 區分觀眾對情緒的推測與流眼水這個現象。", "refs": [], "used": [], "pattern": "some viewers thought"}, {"stage": 4, "p": 7, "t": 1, "q": "His eyes were 由。", "refs": [], "used": [], "pattern": "apply these practices"}, {"stage": 4, "p": 12, "t": 2, "q": "Be Your Best! from PR Productions focuses on social media.", "a": "用 focuses on 簡潔交代第三門課程的範疇。", "refs": [], "used": [], "pattern": "focuses on"}, {"stage": 4, "p": 12, "t": 2, "q": "It will help us communicate clearly online so our messages are less likely to be misunderstood or cause offence.", "a": "so 帶出清楚表達的好處；less likely 保留合理程度。", "refs": [], "used": [10], "pattern": "so our messages"}, {"stage": 4, "p": 12, "t": 2, "q": "Each course counts as credit towards your Annual Review Targets.", "a": "Each 表明每門課程都計入年度目標。", "refs": [], "used": [11], "pattern": "Each course"}, {"stage": 4, "p": 12, "t": 2, "q": "The first ten staff members who complete all three courses will receive an extra day off.", "a": "關係子句限定得獎者：須首十名兼完成全部三門。", "refs": [], "used": [], "pattern": "who complete all three courses"}, {"stage": 4, "p": 12, "t": 2, "q": "Please sign up for the courses.", "a": "以禮貌祈使句告訴同事下一步。", "refs": [], "used": [], "pattern": "Please sign up"}, {"stage": 4, "p": 12, "t": 2, "q": "Regards, Nico Lin", "a": "同事電郵以簡潔結語及 Nico 的姓名收尾。", "refs": [], "used": [], "pattern": "Regards"}, {"stage": 4, "p": 17, "t": 3, "q": "宣傳影片講稿", "a": "先按讀者及目的完成初稿，再核對參考答案。", "draft": true, "refs": [], "used": []}, {"stage": 4, "p": 17, "t": 3, "q": "Viewer’s Choice: A New Way to Enjoy Live Cooking TITLE CARD: VIEWER’S CHOICE VOICEOVER: Meet Viewer’s Choice, the fully interactive, totally live cookery show starring William Puddle and his co-star Mary Steward, the Queen of TV cooking.", "a": "畫面卡顯示節目名稱；旁白用 Meet 直接向觀眾介紹直播節目及兩位主持。", "refs": [], "used": [12], "pattern": "Meet"}, {"stage": 4, "p": 17, "t": 3, "q": "While William cooks, you vote for the ingredients he uses.", "a": "While 連接同步發生的兩個動作，清楚分配煮食和選材料的角色。", "refs": [], "used": [], "pattern": "While William cooks"}, {"stage": 4, "p": 17, "t": 3, "q": "Your vote is part of the action, with each decision made as the meal unfolds.", "a": "as 帶出即時性， Review Targets", "每項課程均有學分，與首十名獎勵分開寫。"], [3, 8, "Mary Steward has confirmed her availability for Viewer’s Choice!", "Mary Steward", "聊天只屬暫定；這封較新的電郵才確認。"], [3, 6, "Episode 1 is called “Fruit Pie”", "fruit pie", "保留節目初稿中仍然有效的集名。"], [3, 8, "between apple and blueberry filling", "blueberry", "最新電郵補上兩款餡料。"], [3, 7, "viewers will be able to vote for free through the Teen NetChef TV app", "Vote for free", "免費 app 投票取代熱線。"], [3, 6, "One lucky voter", "lucky voter", "得獎者是一名投票觀眾。"], [3, 8, "the finished dish — will be delivered by the food delivery company FlyingFood using a drone", "FlyingFood", "同時交代獎品、運送公司及方式。"]], leaves={"1": "2023-DSE\nENG LANG\nPAPER 3\nPART B2\nHONG KONG EXAMINATIONS AND ASSESSMENT AUTHORITY\nHONG KONG DIPLOMA OF SECONDARY EDUCATION EXAMINATION 2023\nB2DIFFICULT SECTION\nENGLISH LANGUAGE PAPER 3\nPART B2\nDATA FILE\nGENERAL INSTRUCTIONS\nRefer to the General Instructions on Page 1 of the Question-Answer Book for Part A.\nINSTRUCTIONS FOR PART B2\nThe Question-Answer Book for Part B2 is inserted into this Data File.\nFor Part B, attempt EITHER those tasks in Part B1 (Tasks 5 – 7) OR those in Part B2 (Tasks 8 – 10).\nYou are advised to use a pen for Part B.\nThe Data Files will NOT be collected at the end of the examination. Do NOT write your answers in the Data Files.\nHand in only ONE Question-Answer Book for Part B, either B1 or B2, and tie it with the Question-Answer Book for Part A.\n© Hong Kong Examinations and Assessment Authority\nAll Rights Reserved 2023Not to be taken away before the end of the examination session", "2": "Part B\nSituation\nYou are Nico Lin. You work at the internet TV company Teen NetChef TV that makes streaming TV shows in Hong Kong. You assist Mr Archie Li, the Marketing Manager for Teen NetChef TV. You have been asked to complete some tasks.\nYou will listen to a recording of an online staff meeting between the show producer Ms Winnie Tang, the Director of Teen NetChef TV Mr Dante Cruz, and Archie Li. Take notes under the appropriate headings. Before the recording is played, you will have five minutes to study the Question-Answer Book and the Data File to familiarise yourself with the situation and the tasks.\nComplete the tasks by following the instructions in the Question-Answer Book and on the recording. You will find all the information you need in the Question-Answer Book, the Data File and on the recording. As you listen you can make notes on page 3 of the Data File.\nYou now have five minutes to familiarise yourself with the Question-Answer Book and the Data File.\nContents\nListening note-taking sheet for online staff meeting 3\nEmail from Archie Li to Nico Lin 4\nBig Cheese Celebrity Food Gossip article 5\nDraft storyboard for the promotional video, with Dante Cruz’s comments 6\nChat between William Puddle and Archie Li 7\nAll staff weekly email from Dante Cruz 8\nCorporate Training Intranet page 9\nCorporate Training: reviews from previous participants 10", "3": "Listening note-taking sheet for online staff meeting\nListen to the recording of an online staff meeting between the show producer Ms Winnie Tang, the Director of Teen NetChef TV Mr Dante Cruz, and the Marketing Manager Mr Archie Li.\nLive, Study, Cook\nFilming schedule\nKinds of food in the competition\nWilliam Puddle’s viral video\nGolden Sun Tower Private Kitchen complaints\nNew show: Viewer’s Choice", "4": "Email from Archie Li to Nico Lin\nFile　 Message Junk　 Delete　 Reply　 Reply All　 Forward　 Move　 Mark Unread　 Follow up\nTo: Nico Lin\nSent: 22nd April 2023 9:02 AM\nFrom: Archie Li\nSubject: Things to do\nDear Nico,\nHere are your tasks for today.\nI need you to write the announcement for our website to show our support for Teen NetChef TV star William Puddle. His cooking video went viral recently, for all the wrong reasons: see the article from Big Cheese Celebrity Food Gossip that I’ve sent you. I’ve discussed this in a chat with William, which I’ll send to you as well, so we can present his side of the story. Make sure you acknowledge and explain William’s mistake, but also explain the misunderstandings that people have about the other events in the video.\nI also need you to write an email to all staff to recommend training courses for the coming year. Dante Cruz’s most recent email sets the scene for this, so take a look at that first. All the available courses have been posted on our Corporate Training Intranet page, along with reviews from previous participants. Three courses will be enough: briefly describe the three courses staff should sign up for (I think it’s pretty clear which three stand out) and explain how their work will benefit from each one.\nNext, please write the script for the promotional video for our new cookery show Viewer’s Choice. I’ve sent you a draft of the storyboard for the video, along with comments from Dante, so you know what to write about. Be careful, though: we’ve made several changes since that draft. Make sure you have the most up-to-date information in your script. I remember both William and Dante giving some updates recently.\nFinally, we discussed all of the above at the most recent online staff meeting. I’ve sent you the recording (I’m still working on the minutes). Listen to our discussion.\nThanks,\nArchie", "5": "Big Cheese Celebrity Food Gossip article\nPuddle Starts a Flood!\nWilliam Puddle’s disastrous cooking video goes viral\nTuesday 18th April 2023Teen NetChef TV star’s latest video did not go swimmingly\nCan his career survive the soaking?\nViewers expressed shock on Monday at the disasters that befell celebrity chef William Puddle in the Teen NetChef TV test kitchen. The video, showing a series of calamitous mistakes, quickly went viral after appearing on Puddle’s social media accounts.\nWater, water everywhere!The video opens with Puddle seemingly flooding his kitchen without realising it! After turning on the kitchen tap to wash some potatoes, Puddle turns to the camera to talk about the science of cutting onions, with the sink rapidly filling up behind him.\nAfter about thirty seconds, Puddle finally realises his big mistake. The floor is flooded and Puddle is even seen apparently slipping in the mess as he reaches for the tap.\n“Irresponsible behaviour”Puddle steps in it!\nWilliam Puddle cleans up the mess from the flood in a screen-grab from the viral video.\nPuddle’s poor performance didn’t end there: viewers noticed that after turning off the tap and cleaning up the floor, Puddle chops up some raw chicken. He then starts slicing up the other ingredients without washing his hands.\nExperts agree that these shocking safety mistakes set a terrible example to other chefs, especially younger fans.\n“This is irresponsible behaviour from a TV Chef,” said Sam Cooke, Head Chef of rival streaming show SuperChefTV. “If we allow children to follow Mr Puddle’s example, who knows what could happen?”\nPuddles of tearsPerhaps realising his downfall, Puddle even appears to be crying towards the end of the video. He starts wiping his face with a tea towel, the same one he used to dry the raw chicken.\n“His eyes were clearly watering in the video. Someone should not be around dangerous cooking appliances and sharp knives if they can’t control their emotions,” said Cooke.\nNeither Puddle, nor the director of Teen NetChef TV, Mr Dante Cruz, could be reached for comment.\nWith rumours of a new show coming soon, Puddle is surely in hot water after this latest fiasco!", "6": "Draft storyboard for the promotional video, with Dante Cruz’s comments\n1. Introduce the show\nViewer’s Choice — Ground-breaking TV!\n2. Introduce the star(s)\nOur regular chef, plus one mystery guest each week\n3. The choices\n4. Episode 1\nEpisode 1 is called “Fruit Pie”\n5. Audience voting\nThe voting hotline number will be on the screen in each episode.\n6. The finished dish\nThe finished dish\n7. The Big Prize\nOne lucky voter: Message: You’ve won!\n8. Delivery of the Big Prize\nThe finished dish → straight to your door!\nDante Cruz’s comments\nFrame 1Not good enough: we need to say why it’s ground-breaking!\nFrame 3A little unclear — just explain who chooses what.\nFrame 4We can include what the main choice will be in Episode 1.\nFrame 8Check which delivery company — some exciting news on this soon!", "7": "Chat between William Puddle and Archie Li\nWednesday 19th April\nArchie:What were you thinking? Was this some kind of a joke? How did you flood the kitchen?\nWilliam:I’m so sorry! This was my mistake. I forgot to turn off the tap! We’ve just switched from an automatic tap to a manual one and I forgot it wouldn’t turn off by itself! I thought everyone would see the funny side! What did Dante say? Am I still the star of Viewer’s Choice?\nArchie:We’ll get to that in a moment. First, tell me what happened with the raw chicken.\nWilliam:I swear it’s not what it looks like! I was so careful — I always am. I had to edit the video because it was too long — I cut out the parts where I cleaned everything!\nArchie:And the tea towel? Can you explain that?\nWilliam:Honestly, I used a clean one! It just looks like I didn’t because I have 150 of the same kind! Don’t you remember? I showed them in my kitchen tour video.\nArchie:Yes, but only your fans know about your other videos, not everybody! All right. Now that we’ve figured out what really happened I’ll get Nico to show our support on the website.\nWilliam:Thank you so much! Now let me pay you back: I have some news about the new show that I think might cheer up Dante.\nArchie:Go on.\nWilliam:So, we planned to have a different mystery guest each week, right? Well, Mary Steward just called. She says she supports me, she wants to help and she wants to be my co-star!\nArchie:Mary Steward? The Queen of TV Cooking? As a co-star?! Well, she just might be able to save you! OK, let’s go with her as the co-star and forget the mystery guest idea. If she confirms soon, we absolutely must include this in the promotion video.\nWilliam:Agreed. Thanks, Archie! That should get the voting hotline ringing!!!\nArchie:Did nobody tell you? We decided that viewers will be able to vote for free through the Teen NetChef TV app. We’ve cancelled the voting hotline.\nWilliam:Oh, I see. Good decision!", "8": "All staff weekly email from Dante Cruz\nFile　 Message Junk　 Delete　 Reply　 Reply All　 Forward　 Move　 Mark Unread　 Follow up\nTo: All staff\nSent: Thursday 20th April 2023 9:02 AM\nFrom: Dante Cruz\nSubject: Weekly Email\nDear All\nGreat to hear that you’re all working hard to make our dreams for the new series of Live, Study, Cook a reality. Here are the latest initiatives to make sure that we all keep on track and strive to achieve:\n1. Special training\nThose of you who listened to the online staff meeting will have heard that we identified two areas of training that we need urgently. We have since decided to extend both of these to all staff, not just chefs.\n2. Food hygiene training\nSimilarly, staff are encouraged to do food hygiene training. As per our company policy on food hygiene, trainers for this course must be approved by the Health Advisory Board (HAB).\n3. Annual Review Targets (ARTs)\nI have informed Human Resources that all training will count as credit towards your Annual Review Targets (ARTs). These will look really good on an appraisal!\n4. Viewer’s Choice — updates\na)I’m delighted to announce that Mary Steward has confirmed her availability for Viewer’s Choice!\nb)More exciting news: our Big Prize — the finished dish — will be delivered by the food delivery company FlyingFood using a drone. Cutting edge technology!\nc)We’ve agreed that the main choice in Episode 1 will be between apple and blueberry filling. Yum! We should mention this in any promotional materials.\nKeep up the good work and Bon Appetit!\nDante Cruz", "9": "Corporate Training Intranet page\nCourse Provider:Pinafore Solutions\nLife-Proof Professional Chef TrainingPinafore Solutions offers training and development programmes for culinary staff.\nAvailable courses\n1. Advanced Fire Safety\nThis course will help develop and manage your staff in the realm of fire safety. We include helpful guidance on how to develop a fire plan as well as the important things to consider when training fire marshals. Finally, we’ve got you covered in maintaining those all-important emergency routes that could be vital in the survival of you and your employees. Sign up today!\n2. Hazard Awareness\nThe kitchen is full of fire hazards and dangers. Can you recognise them all? A professional chef needs all the tricks of the trade to keep everyone safe. This course starts with how to use a fire extinguisher and moves on to how to keep fire exits clear — a must for the next culinary genius!\n3. Food Hygiene Basics\nOur most popular course: see how to handle raw food and cook at a safe temperature. AFH approval pending!\nCourse Provider:The Grill Gurus\nNeed comprehensive chef training for indoor and outdoor chefs? The Grill Gurus can help! Rest assured that your kitchen staff will know how to cook safely for happy kitchens, campfires and barbeques!\nWe run training sessions for the modern adventurous chef. All instructors are HAB approved.\nCourses\nA: The Chef’s Special\nThe ultimate food safety guide for adventurous chefs, including “Food Safety 101”: from the test kitchen to the plate™. “Keep it separate, stupid!” is our tongue-in-cheek guide to avoiding cross-contamination in the kitchen, while “Burn those bugs” explains the importance of safe cooking temperatures.\nB: The Fire Chef’s Manual\nWe cover all the basics to make your alfresco cooking experience as safe as possible. Learn how to light a campfire safely, then we’ll get you ready to use a fire extinguisher when things go wrong. Putting out an oil fire is something that’s more difficult than it looks: we’ll guide you through the tricky process. Trust us to make sure only the food gets burnt™.\nCourse Provider:PR Productions\nPerfecting Dreams for Online CreatorsLet PR Productions pave your path to personal perfection! Online booking is now open. Each course features 5 hours of Zoom sessions with certified Social Media Influencers!\nOption 1: Be Your Best!\nWe teach the importance of Crystal Clear Communication™: the art of only saying what you mean and meaning what you say. After this course, you’ll be a social media angel, showing your perfect self, all the time! Our previous graduates include stars of stage and screen, CEOs and KOLs. Yoga mums and fitness dads also welcome!\nOption 2: Maximise My Money\nHow to turn your social media feed into a money-spinner? It’s not just about the way you sound, but what your customers can see. Join this course to write like a millionaire™ and monetise your brand today!", "10": "Corporate Training: reviews from previous participants\nFood Hygiene Basics\nI loved, loved, loved this course. They went through everything, in lots of great detail. As a newly-trained chef, this is going to be a massive benefit to me. A bit of a shame that the instructors lost their HAB approval (they’re switching to AFH — the Association of Food Health — next year), but still totally worthwhile as they knew what they were doing.\nThe instructors gave out some really interesting tips on food safety. Although I liked the course, I thought it was a bit too short. It would have been better to have some time for questions at the end.\nThe Chef’s Special\nYes, great: no complaints. My boss made me do this course. I thought the “101” section, which focused on food hygiene, was really informative, and the “Keep it separate, stupid!” part made me laugh!\nWhat a fab day! Great tips on how to have a food-safe kitchen. It mostly deals with work settings, though, so nothing I could use at home. Still, it will definitely have its uses in my cooking career as it comes with a professional qualification.\nHazard Awareness\nI was feeling really under the weather that day and my mum said I shouldn’t go, but I’m really glad I did in the end as this course has something for everyone, not just chefs. Perseverance really pays off in so many areas of life!\nThe Fire Chef’s Manual\nThis was awesome. Jake, the instructor, was super knowledgeable and answered all my questions. He’s a surfer, just like me, so it was really useful to learn about cooking on the beach over an open-air fire. Paradise! My buddy Steve says he thought it was a waste of time because he works at an indoor kitchen. I told him to change jobs! Ha!\nAdvanced Fire Safety\nLots of information, but it’s really only for management-level staff, not for everyone, even though that’s not clear in the course description. I actually fell asleep in the boring online sessions. Must do better, Pinafore Solutions!\nI understand that fire marshal training is a very serious issue, and we need to train staff properly, but do we really need 25 hours of online talks for this? Inefficient and expensive.\nBe Your Best!\nO.M.Gosh! What a wonderful course. I’m a fashion blogger and this has already improved my videos. Life’s so much easier now! Also, Jinny, who runs the course, is lovely! Her happy smile kept me motivated day after day.\nThis course is absolutely not just for social media stars: I work in PR as well as being a vlogger. Before, I had real trouble communicating in work meetings — not anymore! That purple backdrop was to die for as well — you’ll see what I mean when you log in for the first time. You’re welcome!\nMaximise My Money\nSuch a good course — the tips really helped me to maximise my brand and start raking in the profit. I blew my competitors out of the water with deftly-crafted written text and some stunning visuals. Take this together with PR Productions’ course on communication and you’ll be the complete package.\nTHIS IS THE LAST PAGE OF THE PART B2 DATA FILE", "11": "HKDSE 2023 · ENGLISH LANGUAGE · PAPER 3 PART B2B2 · DIFFICULT SECTION\nTask 8: Website announcement (19 marks)\nWrite an announcement for the Teen NetChef TV website in support of William Puddle. Use the information from the B2 Data File and your notes. Write around 200 words.\nWebsite announcement0 words", "12": "Task 8 · Answer continuation\nTask 8 answer continuation0 words", "13": "Task 8 · Answer continuation\nTask 8 answer continuation0 words\nEND OF TASK 8", "14": "Task 9: Staff training email (17 marks)\nWrite an email to inform all staff about training courses. Use the information from the B2 Data File and your notes. Write around 150 words.\nStaff training email0 words", "15": "Task 9 · Answer continuation\nTask 9 answer continuation0 words\nEND OF TASK 9", "16": "Task 10: Video script (17 marks)\nWrite a short script to promote the new streaming TV show Viewer’s Choice. Use the information from the B2 Data File and your notes. Write around 120 words.\nPromotional video script0 words", "17": "Task 10 · Answer continuation\nTask 10 answer continuation0 words", "18": "Task 10 · Answer continuation\nTask 10 answer continuation0 words\nEND OF TASK 10 · END OF PART B2"};const rail=document.createElement('div');rail.className='rail';document.querySelector('nav').append(rail);names.forEach((n,j)=>{let b=document.createElement('button');b.textContent=(j+1)+' '+n;b.onclick=()=>{stage.value=j;stage.onchange()};rail.append(b)});const surface=document.createElement('div');E('pdf').before(surface);function showPage(el,p,ids,blue){el.replaceChildren();let text=leaves[p],pos=0;const spans=ids.map(id=>[text.indexOf(facts[id][2]),id]).filter(x=>x[0]>=0).sort((a,b)=>a[0]-b[0]);for(let [at,id] of spans){if(at<pos)continue;el.append(text.slice(pos,at));let m=document.createElement('mark');m.textContent=facts[id][2];m.style.background=inks[facts[id][0]];if(blue)m.className='applied';el.append(m);pos=at+m.textContent.length}el.append(text.slice(pos));el.className='paper'}const base=render;render=function(){base();let r=rows[i];[...rail.children].forEach((b,j)=>b.classList.toggle('current',j===r.stage));surface.hidden=!r.leaf;E('pdf').hidden=!!r.leaf;if(r.leaf){showPage(surface,r.leaf,facts.flatMap((v,id)=>v[1]===r.leaf&&r.a.toLowerCase().includes(v[2].toLowerCase())?[id]:[]),false);E('title').textContent='Data File 第 '+r.leaf+' 頁'}if(r.stage===4){for(let id of r.used||[]){let v=facts[id],b=document.createElement('button');b.textContent='Data File 第 '+v[1]+' 頁 · '+v[2];b.onclick=()=>{E('src').hidden=true;let box=E('excerpt');showPage(box,v[1],[id],true);E('pop').showModal();box.querySelector('mark').scrollIntoView({block:'center'})};E('refs').append(b);E('a').append(document.createElement('br'),v[4])}for(let group of E('bank').children){let task=+group.firstChild.textContent.slice(-2).trim()-7;group.querySelectorAll('button').forEach(b=>b.remove());facts.forEach((v,id)=>{if(v[0]!==task)return;let p=document.createElement('p');p.textContent=v[2];if(rows.slice(0,i+1).some(x=>x.used?.includes(id)))p.className='spent';group.append(p)})}}};const excerpt=document.createElement('div');excerpt.id='excerpt';E('pop').append(excerpt);E('pop').addEventListener('close',()=>{excerpt.replaceChildren();E('src').hidden=false});const writingView=render;render=function(){writingView();const r=rows[i];if(!r.pattern)return;const pos=r.q.indexOf(r.pattern),m=document.createElement('mark');m.style.background='#e8dafa';m.textContent=r.pattern;E('q').replaceChildren(r.q.slice(0,pos),m,r.q.slice(pos+r.pattern.length));E('q').style.background='#f5f0e2'};render()</script><script src="meeting-data.js"></script><script src="meeting.js"></script><script src="controls.js"></script><script src="model-text.js"></script><script src="marking.js"></script><script src="lesson.js"></script><script src="reference/layout.js"></script><script src="reference-shell.js"></script><script src="reader-upgrade.js"></script><link rel="stylesheet" href="reference/question.css"><script src="reference/question.js"></script></html>
