  <header class="edmund-system-header">
    <div class="edmund-system-header__inner">
      <div class="edmund-system-switcher" data-edmund-system-switcher data-system="dse-practical-writing">
        <button class="edmund-system-switcher__trigger" type="button" data-system-switcher-trigger aria-label="開啟 EdmundEducation 系統快速切換">
          <img class="edmund-system-switcher__logo" src="Company Logo for Cover Page.png" alt="">

          <span class="edmund-system-switcher__chevron" aria-hidden="true">⌄</span>
        </button>
      </div>
      <div class="account-actions" data-account-actions hidden>
        <span data-account-name></span>
        <button type="button" data-logout>登出</button>
      </div>
    </div>
  </header>

  <main id="main" class="page-shell">
    <section class="login-view" data-view="login">
      <div class="login-hero">
        <p class="eyebrow">CARD 80 · DSE WRITING</p>
        <div class="login-number" aria-hidden="true">80</div>
        <h1>DSE 學生使用<span>實用文練習系統</span></h1>
        <p>讀清情境、受眾與目的，再把思路寫成一篇完整實用文。</p>
        <div class="document-motif" aria-hidden="true"><i></i><i></i><i></i></div>
      </div>
      <form class="login-panel" data-login-form novalidate>
        <p class="eyebrow">STUDENT ACCESS</p>
        <h2>登入學生帳戶<span>Student sign in</span></h2>
        <label>用戶名稱 · Username<input name="username" autocomplete="username" maxlength="100" required></label>
        <label>密碼 · Password<input name="password" type="password" autocomplete="current-password" maxlength="200" required></label>
        <button class="primary-button" type="submit">進入練習系統 <span aria-hidden="true">→</span></button>
        <p class="login-status" data-login-status role="status" aria-live="polite"></p>
      </form>
    </section>

    <section class="app-view" data-view="app" hidden>
      <div data-screen-root aria-live="polite"></div>
    </section>
  </main>

  <div class="save-toast" data-save-toast role="status" aria-live="polite" hidden>草稿已儲存</div>
  <dialog class="model-dialog" data-model-dialog aria-labelledby="model-writing-title">
    <form method="dialog" class="model-dialog__bar"><div><p class="eyebrow">MODEL WRITING · 參考範文</p><h2 id="model-writing-title" data-model-title></h2></div><button type="submit" aria-label="關閉參考範文">×</button></form>
    <div class="model-dialog__tools"><button type="button" data-model-language>顯示繁體中文翻譯</button></div>
    <article data-model-copy aria-live="polite"></article>
  </dialog>
