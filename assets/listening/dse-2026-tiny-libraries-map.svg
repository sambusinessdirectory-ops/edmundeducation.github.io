  <title id="title">Tiny Libraries location map</title>
  <desc id="desc">Oak Tree Lane runs across the north, Magnolia Drive across the south, and Maple Avenue curves between blocks. Locations A to G sit beside the Post Office, Bakery, Café, Restaurant, Fire Station and School.</desc>
