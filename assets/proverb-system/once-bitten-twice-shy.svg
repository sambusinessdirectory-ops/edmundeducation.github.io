<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1050" role="img" aria-labelledby="title description">
  <title id="title">Once Bitten, Twice Shy literal illustration</title>
  <desc id="description">A hand pulls back from a small warning snake after an earlier bite, illustrating how one bad experience can create greater caution.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset="1" stop-color="#dcb36d"/>
    </linearGradient>
    <linearGradient id="snake" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#47764e"/>
      <stop offset="1" stop-color="#21432c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#3d2217" flood-opacity=".25"/>
    </filter>
    <pattern id="grain" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="8" r="1.1" fill="#704120" opacity=".12"/>
      <circle cx="21" cy="20" r=".9" fill="#704120" opacity=".1"/>
    </pattern>
  </defs>
  <rect width="1400" height="1050" fill="url(#paper)"/>
  <rect width="1400" height="1050" fill="url(#grain)"/>
  <path d="M0 850 Q340 780 700 846 T1400 820 V1050 H0Z" fill="#7e4e2a" opacity=".22"/>
  <g filter="url(#shadow)">
    <path d="M956 858 C785 801 801 615 940 594 C1073 574 1132 717 1043 767 C976 805 878 743 915 665" fill="none" stroke="url(#snake)" stroke-width="74" stroke-linecap="round"/>
    <path d="M882 607 Q936 523 1024 558 Q1055 570 1036 596 Q999 649 930 658Z" fill="#2e5637" stroke="#173220" stroke-width="9"/>
    <circle cx="995" cy="584" r="9" fill="#ffd46f"/>
    <path d="M1032 605 l54 18 -51 11" fill="none" stroke="#8b2b22" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(130 242) rotate(-9 355 320)" filter="url(#shadow)">
    <path d="M122 360 Q169 303 240 324 L355 361 L300 245 Q286 209 314 186 Q346 160 374 200 L440 296 L417 171 Q410 130 447 118 Q486 105 499 146 L528 264 L542 148 Q548 106 588 104 Q629 103 632 147 L631 286 L674 210 Q695 171 732 188 Q770 206 750 247 L661 444 Q625 528 540 567 L410 627 Q337 660 278 613 L127 494 Q63 444 122 360Z" fill="#d78e61" stroke="#7f4833" stroke-width="11"/>
    <path d="M320 422 Q386 389 454 434" fill="none" stroke="#9a3027" stroke-width="16" stroke-linecap="round"/>
    <path d="M349 393 l-19 -36 M383 388 l-2 -42 M418 397 l18 -36" stroke="#9a3027" stroke-width="10" stroke-linecap="round"/>
    <path d="M190 610 L415 770 L283 929 L56 741Z" fill="#48638b" stroke="#293951" stroke-width="11"/>
  </g>
  <g fill="none" stroke="#8e2d21" stroke-width="15" stroke-linecap="round">
    <path d="M755 438 l42 -39"/>
    <path d="M783 490 l58 -7"/>
    <path d="M742 386 l11 -57"/>
  </g>
  <path d="M1180 310 L1290 510 H1070Z" fill="#e1a72f" stroke="#6e471c" stroke-width="11" filter="url(#shadow)"/>
  <text x="1180" y="465" text-anchor="middle" fill="#452d1c" font-family="Georgia, serif" font-size="112" font-weight="700">!</text>
</svg>
