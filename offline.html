<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#20283d">
  <title>暫時離線｜EdmundEducation</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script type="module" src="/apostrophe-normalizer.mjs"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin: 0;
      padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
      color: #f8f8fb;
      background: radial-gradient(circle at top, #3b4668, #20283d 55%, #141a2a);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(560px, 100%);
      padding: clamp(28px, 7vw, 54px);
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 28px;
      background: rgba(255,255,255,.08);
      box-shadow: 0 30px 80px rgba(0,0,0,.25);
      text-align: center;
    }
    main img { width: 132px; height: 132px; border-radius: 26px; }
    h1 { margin: 24px 0 10px; font-size: clamp(30px, 7vw, 48px); }
    p { margin: 0; color: #d6dbea; font-size: 17px; line-height: 1.7; }
    button {
      min-height: 48px;
      margin-top: 26px;
      padding: 11px 22px;
      border: 1px solid rgba(255,255,255,.55);
      border-radius: 999px;
      color: #20283d;
      background: #fff;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
    }
    .offline-eddy { position: relative; width: min(560px, 100%); aspect-ratio: 1672 / 941; }
    .offline-eddy img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .offline-eddy-message {
      position: absolute;
      left: 5.2%;
      right: 12.5%;
      top: 73%;
      bottom: 7%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: .12em;
      padding: 0 1.5%;
      border-radius: 8px;
      background: #fff0ca;
      color: #30120c;
      font: 700 clamp(12px, 2vw, 17px)/1.3 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      text-align: left;
    }
    .offline-eddy-message strong { font-size: 1.12em; }
    @media (max-width: 560px) {
      .offline-eddy-message {
        top: 72%;
        bottom: auto;
        min-height: 75px;
        padding: 6px 26px 6px 8px;
        border: 2px solid #a85729;
        border-radius: 12px;
        box-shadow: 0 3px 0 #61301c;
        font-size: clamp(12px, 3.3vw, 16px);
      }
    }
  </style>
</head>
<body>
  <main>
    <img src="https://edmund-site-assets.edmundeducation.workers.dev/site-assets/v1/assets/icons/icon-192x192.png" alt="EdmundEducation">
    <h1>暫時未能連線</h1>
    <p>請檢查網絡後再試。登入、練習、錄音、下載及儲存資料均需要網絡連線；尚未送出的內容並未上載。</p>
    <button type="button" onclick="location.reload()">重新連線</button>
  </main>
  <div class="offline-eddy" aria-label="Eddy 的網路提示">
    <img src="/eddy-offline-dialogue.png" alt="" aria-hidden="true">
    <div class="offline-eddy-message" lang="zh-Hant"></div>
  </div>
  <script>
    (() => {
      const lines = [
        ['咦！？怎麼突然連不上了啦！', '難道 Wi-Fi 偷偷跑去冒險了嗎？唔～先檢查一下網路連線吧！'],
        '喂～喂～聽得到嗎？……奇怪，訊號怎麼突然不見了！？Eddy 還在這裡啊！',
        '唔……網路好像斷線了！到底是誰把我們的連線偷偷剪斷啦！？',
        '哎呀！偏偏在這個時候斷線……Eddy 都已經準備好出發了耶！',
        '拜託拜託～Wi-Fi 快回來嘛！Eddy 保證以後會好好珍惜你的！',
        '啊！網路好像出了點狀況呢。沒關係，先確認一下連線，等恢復了再一起出發吧！'
      ];
      const line = lines[Math.floor(Math.random() * lines.length)];
      const message = document.querySelector('.offline-eddy-message');
      if (Array.isArray(line)) {
        const title = document.createElement('strong');
        const detail = document.createElement('span');
        title.textContent = line[0];
        detail.textContent = line[1];
        message.append(title, detail);
      } else message.textContent = line;
    })();
  </script>
</body>
</html>
