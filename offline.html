<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#20283d">
  <title>暫時離線｜EdmundEducation</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script type="module" src="/apostrophe-normalizer.mjs"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      margin: 0;
      padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
      color: #f8f8fb;
      background: radial-gradient(circle at top, #3b4668, #20283d 55%, #141a2a);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(560px, 100%);
      padding: clamp(28px, 7vw, 54px);
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 28px;
      background: rgba(255,255,255,.08);
      box-shadow: 0 30px 80px rgba(0,0,0,.25);
      text-align: center;
    }
    img { width: 132px; height: 132px; border-radius: 26px; }
    h1 { margin: 24px 0 10px; font-size: clamp(30px, 7vw, 48px); }
    p { margin: 0; color: #d6dbea; font-size: 17px; line-height: 1.7; }
    button {
      min-height: 48px;
      margin-top: 26px;
      padding: 11px 22px;
      border: 1px solid rgba(255,255,255,.55);
      border-radius: 999px;
      color: #20283d;
      background: #fff;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <img src="/assets/icons/icon-192x192.png" alt="EdmundEducation">
    <h1>暫時未能連線</h1>
    <p>請檢查網絡後再試。登入、練習、錄音、下載及儲存資料均需要網絡連線；尚未送出的內容並未上載。</p>
    <button type="button" onclick="location.reload()">重新連線</button>
  </main>
</body>
</html>
