name: Verify Pages release candidate
on:
  push:
    branches:
      - 'codex/**'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 100
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/
            /tools/pages-pr-rehearsal.rb
            /tools/pages-artifact-inventory.py
            /tools/deploy-pages-long-poll.cjs
            /tools/test-pages-publisher.cjs
            /tools/test-pages-media-cutover.py
            /tools/prune-verified-pages-media.py
            /tools/test-pages-artifact-inventory.py
            /tools/test-pages-recovery-rehearsal.py
            /tools/test-verify-pages-media-route.py
            /tools/test-verify-pages-live-journeys.py
            /tools/test-rewrite-pages-public-media.py
            /tools/verify-pages-media-route.py
            /tools/verify-pages-live-journeys.py
            /tools/rewrite-pages-public-media.py
      - name: Resolve the candidate against current main
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          git -c protocol.version=2 fetch --no-tags --depth=100 --filter=blob:none origin main
          base=$(git merge-base "${GITHUB_SHA}" FETCH_HEAD)
          test -n "${base}"
          echo "base=${base}" >> "${GITHUB_OUTPUT}"
          echo "Candidate ${GITHUB_SHA} will be verified against main merge base ${base}." >> "${GITHUB_STEP_SUMMARY}"
      - name: Lint the candidate release workflows
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --retry 2 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          # actionlint 1.7.12 predates GitHub's queue key. The Python regression
          # gate checks its exact value and workflow-level placement.
          "$RUNNER_TEMP/actionlint" -ignore '^unexpected key "queue" for "concurrency" section' -shellcheck= -pyflakes= .github/workflows/pages*.yml .github/workflows/publish-pages-artifact.yml
      - name: Verify media cutover stops safely
        run: >-
          python3 -m unittest
          tools/test-pages-media-cutover.py
          tools/test-pages-artifact-inventory.py
          tools/test-pages-recovery-rehearsal.py
          tools/test-verify-pages-media-route.py
          tools/test-verify-pages-live-journeys.py
          tools/test-rewrite-pages-public-media.py
      - name: Replay publisher decisions
        run: node --test tools/test-pages-publisher.cjs
      - name: Rehearse focused checkout and early publication contracts
        env:
          RELEASE_BASE: ${{ steps.candidate.outputs.base }}
          RELEASE_TAGS: '[fast-deploy] [writing-release] [downloads-release] [shared-header-release]'
        run: ruby tools/pages-pr-rehearsal.rb
