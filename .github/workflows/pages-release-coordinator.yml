name: Coordinate GitHub Pages release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-release-main
  # Keep the active release, but collapse all newer pushes into the latest
  # pending candidate. Its diff is recalculated from the snapshot written by
  # the active release, so no accepted commit is omitted.
  queue: single
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      base_sha: ${{ steps.classify.outputs.base_sha }}
      release_tags: ${{ steps.classify.outputs.release_tags }}
      route: ${{ steps.classify.outputs.route }}
    steps:
      - name: Checkout release router
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/
            /tools/check-pages-build-environment.rb
            /tools/pages-validation-paths
            /tools/classify-pages-release.py
            /tools/collect-pages-release-tags.py
            /tools/pages-release-scopes.json
            /tools/test-classify-pages-release.py
            /tools/test-collect-pages-release-tags.py

      - name: Check Pages build environment
        run: ruby tools/check-pages-build-environment.rb

      - name: Classify the complete undeployed change
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest \
            tools/test-classify-pages-release.py \
            tools/test-collect-pages-release-tags.py

          snapshot_commit=$(git ls-remote origin refs/heads/pages-snapshot | cut -f1)
          if [[ -z "${snapshot_commit}" ]]; then
            echo "base_sha=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
            echo "release_tags=" >> "${GITHUB_OUTPUT}"
            echo "route=standard" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "${snapshot_commit}"
          base_sha=$(git show "${snapshot_commit}:.source-sha")
          git -c protocol.version=2 fetch --no-tags --depth=100 --filter=blob:none origin "${GITHUB_SHA}"
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "${base_sha}"

          route=standard
          release_tags=
          if git merge-base --is-ancestor "${base_sha}" "${GITHUB_SHA}"; then
            git diff --no-renames --name-only "${base_sha}" "${GITHUB_SHA}" > /tmp/pages-release-paths.txt
            if [[ ! -s /tmp/pages-release-paths.txt ]]; then
              live=$(curl -fsS --retry 2 --max-time 20 "https://edmundeducation.com/release.json?baseline=${GITHUB_RUN_ID}" | jq -er .release)
              if [[ "${live}" == "${base_sha}" ]]; then
                echo "route=none" >> "${GITHUB_OUTPUT}"
                echo "Verified identical source tree already public at ${live}; candidate ${GITHUB_SHA}." >> "${GITHUB_STEP_SUMMARY}"
                exit 0
              fi
            fi
            route=$(python3 tools/classify-pages-release.py /tmp/pages-release-paths.txt)
            git diff --no-ext-diff --no-textconv --unified=0 "${base_sha}" "${GITHUB_SHA}" -- index.html > /tmp/pages-homepage.diff
            release_tags=$(python3 tools/collect-pages-release-tags.py \
              --paths-file /tmp/pages-release-paths.txt --homepage-diff /tmp/pages-homepage.diff \
              2> /tmp/pages-release-scope-report.txt)
            cat /tmp/pages-release-scope-report.txt >&2
            if [[ -s /tmp/pages-homepage.diff || "${release_tags}" != *"[fast-deploy]"* ]]; then
              route=standard
            fi
          fi

          echo "base_sha=${base_sha}" >> "${GITHUB_OUTPUT}"
          echo "release_tags=${release_tags}" >> "${GITHUB_OUTPUT}"
          echo "route=${route}" >> "${GITHUB_OUTPUT}"
          echo "Candidate ${GITHUB_SHA}, baseline ${base_sha}, builder ${route}, scopes ${release_tags:-full validation}." >> "${GITHUB_STEP_SUMMARY}"
          {
            echo
            echo "### Dependency classification"
            echo '```text'
            cat /tmp/pages-release-scope-report.txt 2>/dev/null || true
            echo '```'
            echo
            echo "### Consolidated commits"
            git log --reverse -100 --format='- `%h` %s' "${base_sha}..${GITHUB_SHA}"
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "Pages release route: ${route}; tags: ${release_tags:-full validation}; from ${base_sha} to ${GITHUB_SHA}"

  standard:
    needs: route
    if: needs.route.outputs.route == 'standard'
    uses: ./.github/workflows/pages.yml
    with:
      base_sha: ${{ needs.route.outputs.base_sha }}
      release_tags: ${{ needs.route.outputs.release_tags }}
    permissions:
      actions: write
      contents: read
      pages: read

  paper3:
    needs: route
    if: needs.route.outputs.route == 'paper3'
    uses: ./.github/workflows/pages-paper3-fast.yml
    permissions:
      actions: read
      contents: read
      pages: read

  site:
    needs: route
    if: needs.route.outputs.route == 'site'
    uses: ./.github/workflows/pages-fast.yml
    with:
      base_sha: ${{ needs.route.outputs.base_sha }}
    permissions:
      actions: read
      contents: read
      pages: read

  publish:
    needs: [route, standard, paper3, site]
    if: >-
      ${{ always() && needs.route.result == 'success' && (
        (needs.route.outputs.route == 'standard' && needs.standard.result == 'success') ||
        (needs.route.outputs.route == 'paper3' && needs.paper3.result == 'success') ||
        (needs.route.outputs.route == 'site' && needs.site.result == 'success')
      ) }}
    uses: ./.github/workflows/publish-pages-artifact.yml
    with:
      artifact_name: ${{ needs.standard.outputs.artifact_name || needs.paper3.outputs.artifact_name || needs.site.outputs.artifact_name }}
      release_tags: ${{ needs.route.outputs.release_tags }}
    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write
