name: Publish a prepared Pages artifact

on:
  workflow_call:
    inputs:
      artifact_name:
        required: true
        type: string
      release_tags:
        required: false
        type: string
        default: ""
    outputs:
      current:
        description: Whether this commit still owned the publication slot
        value: ${{ jobs.publish.outputs.current }}

jobs:
  publish:
    runs-on: ubuntu-latest
    # A large Pages artifact can remain in GitHub's deployment service beyond
    # the old ten-minute response window. Leave enough room for a bounded
    # reconciliation check and one artifact-reusing retry, but never loop
    # indefinitely.
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    outputs:
      current: ${{ steps.release.outputs.current }}
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: https://edmundeducation.com/
    steps:
      - name: Checkout bounded Pages deployment helper
        uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/deploy-pages-long-poll.cjs

      - name: Check forward-only release after acquiring the publication slot
        id: release
        uses: actions/github-script@v8
        with:
          script: |
            const { data: mainRef } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' });
            const mainSha = mainRef.object.sha;

            let deployedSha = '';
            try {
              const { data: source } = await github.rest.repos.getContent({
                ...context.repo,
                path: '.source-sha',
                ref: 'pages-snapshot',
              });
              if (!Array.isArray(source) && source.type === 'file') {
                deployedSha = Buffer.from(source.content, 'base64').toString('utf8').trim();
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const response = await fetch(`https://edmundeducation.com/release.json?run=${context.runId}&attempt=${process.env.GITHUB_RUN_ATTEMPT}`, { cache: 'no-store' });
            if (!response.ok && !(response.status === 404 && !deployedSha)) {
              throw new Error(`Cannot read public release: HTTP ${response.status}`);
            }
            const live = response.ok ? (await response.json()).release : '';
            if (response.ok && !/^[0-9a-f]{40}$/.test(live)) throw new Error('Invalid public release ID');
            let current = true;
            let deploy = true;
            let outcome = 'deploy';
            if (live === context.sha) {
              // A job retry after a lost deployment response can reuse the published artifact.
              deploy = false;
              current = deployedSha !== live;
              if (current && deployedSha) {
                const { data } = await github.rest.repos.compareCommitsWithBasehead({
                  ...context.repo, basehead: `${deployedSha}...${context.sha}`,
                });
                if (data.status !== 'ahead') throw new Error('Refusing to move the snapshot backwards');
              }
              outcome = current ? 'repair snapshot' : 'already live';
            } else if (live !== deployedSha) {
              throw new Error('Live and snapshot differ. Re-run the failed snapshot job for the live commit.');
            } else if (deployedSha) {
              const { data: forward } = await github.rest.repos.compareCommitsWithBasehead({
                ...context.repo, basehead: `${deployedSha}...${context.sha}`,
              });
              if (forward.status !== 'ahead') {
                current = deploy = false;
                outcome = forward.status === 'behind' ? 'included in live descendant' : 'diverged; skipped';
              }
            }
            if (deploy && mainSha !== context.sha) {
              const { data: ancestry } = await github.rest.repos.compareCommitsWithBasehead({
                ...context.repo, basehead: `${context.sha}...${mainSha}`,
              });
              if (ancestry.status !== 'ahead') {
                current = deploy = false;
                outcome = 'outside main history; skipped';
              }
            }
            await core.summary.addRaw(`Candidate ${context.sha}; public baseline ${live || 'none'}; decision: ${outcome}.`).write();
            core.setOutput('deploy', String(deploy));
            core.setOutput('current', String(current));

      - name: Deploy to GitHub Pages
        id: deploy_primary
        if: steps.release.outputs.deploy == 'true'
        continue-on-error: true
        uses: actions/github-script@v8
        env:
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
        with:
          script: |
            const deploy = require(`${process.env.GITHUB_WORKSPACE}/tools/deploy-pages-long-poll.cjs`);
            await deploy({ github, context, core, artifactName: process.env.ARTIFACT_NAME });

      - name: Reconcile a failed Pages response before retrying
        id: deploy_recovery
        if: steps.release.outputs.deploy == 'true' && steps.deploy_primary.outcome == 'failure'
        uses: actions/github-script@v8
        env:
          PRIMARY_PENDING: ${{ steps.deploy_primary.outputs.pending }}
        with:
          script: |
            // A Pages timeout can lose the success response even when the site
            // has become public. Check production before creating a second
            // deployment, then allow the cancelled deployment slot to clear.
            let live = '';
            for (let attempt = 1; attempt <= 6; attempt += 1) {
              try {
                const response = await fetch(`https://edmundeducation.com/release.json?reconcile=${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}-${attempt}`, { cache: 'no-store' });
                if (response.ok) live = (await response.json()).release || '';
              } catch (error) {
                core.info(`Public release check ${attempt} failed: ${error.message}`);
              }
              if (live === context.sha) break;
              if (attempt < 6) await new Promise(resolve => setTimeout(resolve, 10000));
            }
            const retry = live !== context.sha && process.env.PRIMARY_PENDING !== 'true';
            if (retry) await new Promise(resolve => setTimeout(resolve, 30000));
            await core.summary.addRaw(
              live === context.sha
                ? `Pages returned a failure, but ${context.sha} is already public; no retry was created.`
                : process.env.PRIMARY_PENDING === 'true'
                  ? `Pages is still processing ${context.sha}; the deployment was left active and no competing retry was created.`
                : `Pages failed before ${context.sha} became public; retrying the same prepared artifact once.`
            ).write();
            core.setOutput('retry', String(retry));

      - name: Retry only the failed Pages deployment
        id: deploy_retry
        if: steps.deploy_recovery.outputs.retry == 'true'
        continue-on-error: true
        uses: actions/github-script@v8
        env:
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
        with:
          script: |
            const deploy = require(`${process.env.GITHUB_WORKSPACE}/tools/deploy-pages-long-poll.cjs`);
            await deploy({ github, context, core, artifactName: process.env.ARTIFACT_NAME });

      - name: Require the candidate to be public after deployment
        if: always() && steps.release.outputs.deploy == 'true'
        uses: actions/github-script@v8
        env:
          PRIMARY_OUTCOME: ${{ steps.deploy_primary.outcome }}
          RETRY_OUTCOME: ${{ steps.deploy_retry.outcome }}
        with:
          script: |
            let live = '';
            for (let attempt = 1; attempt <= 24; attempt += 1) {
              try {
                const response = await fetch(`https://edmundeducation.com/release.json?publish=${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}-${attempt}`, { cache: 'no-store' });
                if (response.ok) live = (await response.json()).release || '';
              } catch (error) {
                core.info(`Public release check ${attempt} failed: ${error.message}`);
              }
              if (live === context.sha) {
                await core.summary.addRaw(`Verified ${context.sha} on the public release endpoint after Pages publication.`).write();
                return;
              }
              if (attempt < 24) await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error(
              `Pages did not publish ${context.sha} after one bounded retry. ` +
              `Primary outcome: ${process.env.PRIMARY_OUTCOME}; retry outcome: ${process.env.RETRY_OUTCOME}. ` +
              `Preserve the prepared artifact, inspect the first deployment error, and do not create another release commit.`
            );

  snapshot:
    needs: publish
    if: needs.publish.outputs.current == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: pages-snapshot
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout snapshot updater
        uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/update-pages-snapshot.sh
          path: release-source

      - name: Download the deployed artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: prepared-pages

      - name: Update deployed snapshot
        shell: bash
        env:
          SNAPSHOT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir deployed-site
          tar -xf prepared-pages/artifact.tar -C deployed-site
          jq -e --arg sha "${GITHUB_SHA}" '.release == $sha' deployed-site/release.json >/dev/null
          # On a retry, ensure this artifact is still public before changing the baseline.
          for attempt in {1..60}; do
            live=$(curl -fsS --max-time 10 "https://edmundeducation.com/release.json?snapshot=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}" | jq -er .release) || live=
            [[ "${live}" == "${GITHUB_SHA}" ]] && break
            sleep 5
          done
          [[ "${live}" == "${GITHUB_SHA}" ]]
          bash release-source/tools/update-pages-snapshot.sh deployed-site "${GITHUB_SHA}"

  verify-live:
    needs: publish
    if: needs.publish.outputs.current == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout student journey map
        uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/pages-system-release-map.json
            /tools/verify-pages-live-journeys.py
      - name: Verify the coordinated release is live
        shell: bash
        run: |
          set -euo pipefail
          release_url="https://edmundeducation.com/release.json?release=${GITHUB_SHA}"
          for attempt in {1..60}; do
            release=$(curl --fail --silent --show-error -H 'Cache-Control: no-cache' "${release_url}" || true)
            if jq -e --arg sha "${GITHUB_SHA}" '.release == $sha' <<<"${release}" >/dev/null; then
              echo "Verified coordinated release ${GITHUB_SHA}."
              exit 0
            fi
            sleep 5
          done
          echo "Production did not expose coordinated release ${GITHUB_SHA}." >&2
          exit 1
      - name: Verify affected student journeys
        env:
          RELEASE_TAGS: ${{ inputs.release_tags }}
        run: >-
          python3 tools/verify-pages-live-journeys.py
          --release-tags "${RELEASE_TAGS}"
