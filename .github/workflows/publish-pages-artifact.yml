name: Publish a prepared Pages artifact

on:
  workflow_call:
    inputs:
      artifact_name:
        required: true
        type: string
    outputs:
      current:
        description: Whether this commit still owned the publication slot
        value: ${{ jobs.publish.outputs.current }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    outputs:
      current: ${{ steps.release.outputs.current }}
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: https://edmundeducation.com/
    steps:
      - name: Check forward-only release after acquiring the publication slot
        id: release
        uses: actions/github-script@v8
        with:
          script: |
            const { data: mainRef } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' });
            const mainSha = mainRef.object.sha;

            let deployedSha = '';
            try {
              const { data: source } = await github.rest.repos.getContent({
                ...context.repo,
                path: '.source-sha',
                ref: 'pages-snapshot',
              });
              if (!Array.isArray(source) && source.type === 'file') {
                deployedSha = Buffer.from(source.content, 'base64').toString('utf8').trim();
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const response = await fetch(`https://edmundeducation.com/release.json?run=${context.runId}&attempt=${process.env.GITHUB_RUN_ATTEMPT}`, { cache: 'no-store' });
            if (!response.ok && !(response.status === 404 && !deployedSha)) {
              throw new Error(`Cannot read public release: HTTP ${response.status}`);
            }
            const live = response.ok ? (await response.json()).release : '';
            if (response.ok && !/^[0-9a-f]{40}$/.test(live)) throw new Error('Invalid public release ID');
            let current = true;
            let deploy = true;
            let outcome = 'deploy';
            if (live === context.sha) {
              // A job retry after a lost deployment response can reuse the published artifact.
              deploy = false;
              current = deployedSha !== live;
              if (current && deployedSha) {
                const { data } = await github.rest.repos.compareCommitsWithBasehead({
                  ...context.repo, basehead: `${deployedSha}...${context.sha}`,
                });
                if (data.status !== 'ahead') throw new Error('Refusing to move the snapshot backwards');
              }
              outcome = current ? 'repair snapshot' : 'already live';
            } else if (live !== deployedSha) {
              throw new Error('Live and snapshot differ. Re-run the failed snapshot job for the live commit.');
            } else if (deployedSha) {
              const { data: forward } = await github.rest.repos.compareCommitsWithBasehead({
                ...context.repo, basehead: `${deployedSha}...${context.sha}`,
              });
              if (forward.status !== 'ahead') {
                current = deploy = false;
                outcome = forward.status === 'behind' ? 'included in live descendant' : 'diverged; skipped';
              }
            }
            if (deploy && mainSha !== context.sha) {
              const { data: ancestry } = await github.rest.repos.compareCommitsWithBasehead({
                ...context.repo, basehead: `${context.sha}...${mainSha}`,
              });
              if (ancestry.status !== 'ahead') {
                current = deploy = false;
                outcome = 'outside main history; skipped';
              }
            }
            await core.summary.addRaw(`Candidate ${context.sha}; public baseline ${live || 'none'}; decision: ${outcome}.`).write();
            core.setOutput('deploy', String(deploy));
            core.setOutput('current', String(current));

      - name: Deploy to GitHub Pages
        if: steps.release.outputs.deploy == 'true'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ inputs.artifact_name }}
          timeout: 600000
          error_count: 30

  snapshot:
    needs: publish
    if: needs.publish.outputs.current == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: pages-snapshot
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout snapshot updater
        uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/update-pages-snapshot.sh
          path: release-source

      - name: Download the deployed artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: prepared-pages

      - name: Update deployed snapshot
        shell: bash
        env:
          SNAPSHOT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir deployed-site
          tar -xf prepared-pages/artifact.tar -C deployed-site
          jq -e --arg sha "${GITHUB_SHA}" '.release == $sha' deployed-site/release.json >/dev/null
          # On a retry, ensure this artifact is still public before changing the baseline.
          for attempt in {1..60}; do
            live=$(curl -fsS --max-time 10 "https://edmundeducation.com/release.json?snapshot=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}" | jq -er .release) || live=
            [[ "${live}" == "${GITHUB_SHA}" ]] && break
            sleep 5
          done
          [[ "${live}" == "${GITHUB_SHA}" ]]
          bash release-source/tools/update-pages-snapshot.sh deployed-site "${GITHUB_SHA}"

  verify-live:
    needs: publish
    if: needs.publish.outputs.current == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify the coordinated release is live
        shell: bash
        run: |
          set -euo pipefail
          release_url="https://edmundeducation.com/release.json?release=${GITHUB_SHA}"
          for attempt in {1..60}; do
            release=$(curl --fail --silent --show-error -H 'Cache-Control: no-cache' "${release_url}" || true)
            if jq -e --arg sha "${GITHUB_SHA}" '.release == $sha' <<<"${release}" >/dev/null; then
              echo "Verified coordinated release ${GITHUB_SHA}."
              exit 0
            fi
            sleep 5
          done
          echo "Production did not expose coordinated release ${GITHUB_SHA}." >&2
          exit 1
