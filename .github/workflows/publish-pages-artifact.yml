name: Publish a prepared Pages artifact

on:
  workflow_call:
    inputs:
      artifact_name:
        required: true
        type: string
    outputs:
      current:
        description: Whether this commit still owned the publication slot
        value: ${{ jobs.publish.outputs.current }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    outputs:
      current: ${{ steps.release.outputs.current }}
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: https://edmundeducation.com/
    steps:
      - name: Check forward-only release after acquiring the publication slot
        id: release
        uses: actions/github-script@v8
        with:
          script: |
            const { data: mainRef } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' });
            const mainSha = mainRef.object.sha;

            let deployedSha = '';
            try {
              const { data: source } = await github.rest.repos.getContent({
                ...context.repo,
                path: '.source-sha',
                ref: 'pages-snapshot',
              });
              if (!Array.isArray(source) && source.type === 'file') {
                deployedSha = Buffer.from(source.content, 'base64').toString('utf8').trim();
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            let current = true;
            if (deployedSha === context.sha) {
              current = false;
              core.notice(`Skipping already-deployed release ${context.sha}.`);
            }

            if (current && deployedSha) {
              const { data: forward } = await github.rest.repos.compareCommitsWithBasehead({
                ...context.repo,
                basehead: `${deployedSha}...${context.sha}`,
              });
              if (forward.status !== 'ahead') {
                current = false;
                core.notice(`Skipping non-forward release ${context.sha}; deployed snapshot is ${deployedSha}.`);
              }
            }

            if (current && mainSha !== context.sha) {
              const { data: lineage } = await github.rest.repos.compareCommitsWithBasehead({
                ...context.repo,
                basehead: `${context.sha}...${mainSha}`,
              });
              if (lineage.status !== 'ahead') {
                current = false;
                core.notice(`Skipping release ${context.sha}; it is not an ancestor of main ${mainSha}.`);
              } else {
                core.notice(`Publishing forward intermediate ${context.sha}; main is ${mainSha}.`);
              }
            }

            core.setOutput('current', String(current));

      - name: Deploy to GitHub Pages
        if: steps.release.outputs.current == 'true'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ inputs.artifact_name }}
          timeout: 900000
          error_count: 30

  snapshot:
    needs: publish
    if: needs.publish.outputs.current == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout snapshot updater
        uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/update-pages-snapshot.sh
          path: release-source

      - name: Download the deployed artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: prepared-pages

      - name: Update deployed snapshot
        shell: bash
        env:
          SNAPSHOT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir deployed-site
          tar -xf prepared-pages/artifact.tar -C deployed-site
          bash release-source/tools/update-pages-snapshot.sh deployed-site "${GITHUB_SHA}"
