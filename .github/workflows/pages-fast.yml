name: Build focused homepage Pages artifact

# Use [site-fast] only when a push changes index.html and/or root homepage-*
# artwork. Other releases keep the full validation workflow in pages.yml.
on:
  workflow_call:
    inputs:
      base_sha:
        required: true
        type: string
    outputs:
      artifact_name:
        description: Prepared Pages artifact name
        value: ${{ jobs.build.outputs.artifact_name }}

permissions:
  actions: read
  contents: read
  pages: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    env:
      RELEASE_BASE: ${{ inputs.base_sha }}

    steps:
      - name: Fetch only publishable files and required scripts
        shell: bash
        run: |
          set -euo pipefail
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          # Git's partial clone downloads blobs only for sparse paths. In
          # particular, the R2-backed asset trees and build-only art stay out.
          git config core.sparseCheckout true
          git config core.sparseCheckoutCone false
          git config remote.origin.promisor true
          git config remote.origin.partialclonefilter blob:none
          cat > .git/info/sparse-checkout <<'PATTERNS'
          /*
          !/assets/
          !/eddy-carrot-patch/assets/
          !/course-materials/
          !/supabase/
          !/tools/*
          /tools/ielts-reading-analysis-publication-excludes.mjs
          /tools/add-paper3-study-support.py
          /tools/rewrite-pages-assets.py
          /tools/update-pages-snapshot.sh
          PATTERNS
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$GITHUB_SHA"
          git checkout -q --detach "$GITHUB_SHA"
          test -s index.html
          test -s tools/rewrite-pages-assets.py
          test -s workers/edmund-site-assets/src/site-pack-index-v1.json

      - name: Reject changes that need the full release workflow
        shell: bash
        run: |
          set -euo pipefail
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$RELEASE_BASE"
          git diff --name-only "$RELEASE_BASE" "$GITHUB_SHA" > /tmp/site-fast-changes.txt
          test -s /tmp/site-fast-changes.txt
          while IFS= read -r path; do
            case "$path" in
              index.html|homepage-*.webp|homepage-*.png|homepage-*.jpg|homepage-*.jpeg) ;;
              *) echo "Use the full release workflow for: $path" >&2; exit 1 ;;
            esac
          done < /tmp/site-fast-changes.txt

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare public site
        shell: bash
        run: |
          set -euo pipefail
          mkdir _site
          node tools/ielts-reading-analysis-publication-excludes.mjs > /tmp/ielts-reading-analysis-excludes.txt
          rsync -a \
            --exclude-from=/tmp/ielts-reading-analysis-excludes.txt \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.DS_Store' \
            --exclude='_site' \
            --exclude='*.sql' \
            --exclude='news-discussion/*.json' \
            --exclude='dse-argument-bank/source.md' \
            --exclude='dse-argument-bank/*-source.md' \
            --exclude='natural-english/imported-lessons.json' \
            --exclude='natural-english/IMPORT-REVIEW.md' \
            --exclude='natural-english/audio/imported-metadata.json' \
            --exclude='/course-materials/' \
            --exclude='song-appreciation-data.js' \
            --exclude='tools' \
            --exclude='workers' \
            --exclude='supabase' \
            --exclude='/assets/' \
            --exclude='/eddy-carrot-patch/assets/' \
            ./ _site/
          unzip -oq paper3/reader-batch.zip 'paper3/*' -d _site
          rsync -a --exclude='reader-batch.zip' paper3/ _site/paper3/
          rm -f _site/paper3/reader-batch.zip
          python3 tools/add-paper3-study-support.py _site/paper3
          python3 tools/rewrite-pages-assets.py _site --fast-scan

      - name: Keep protected source material out of the Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/index.html
          test ! -d _site/assets
          test ! -d _site/eddy-carrot-patch/assets
          test ! -e _site/song-appreciation-data.js
          test ! -e _site/news-discussion/news-1.json
          test ! -e _site/dse-argument-bank/source.md
          test -z "$(find _site/dse-argument-bank -maxdepth 1 -name '*-source.md' -print -quit)"
          if grep -RIl --include='*.js' \
            -e 'EDMUND_SONG_APPRECIATION_DATA' \
            -e 'You, with your words like knives' \
            -e 'Got me feeling like I' \
            -e '《Mean》描寫被欺凌' \
            _site/; then
            echo 'Protected Song Appreciation material reached the Pages artifact.' >&2
            exit 1
          fi

      - name: Stamp PWA release
        shell: bash
        run: |
          set -euo pipefail
          for path in _site/service-worker.js _site/pwa-register.js _site/release.json; do
            grep -Fq '__EDMUND_RELEASE__' "$path"
            sed -i "s/__EDMUND_RELEASE__/${GITHUB_SHA}/g" "$path"
            grep -Fq "$GITHUB_SHA" "$path"
          done

      - name: Name this build artifact
        id: artifact
        run: echo "name=github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: _site
