      - name: Validate Song Appreciation portal, data protection, and secure workflows
        if: ${{ !contains(inputs.release_tags, '[fast-deploy]') }}
        run: node tools/test-song-appreciation.mjs

      - name: Validate Eddy game public bundle and asset publication gate
        if: ${{ !contains(inputs.release_tags, '[fast-deploy]') }}
        run: node tools/test-eddy-game-publication.mjs

      - name: Validate Writing Submission portal and self-hosted grammar engine
        if: ${{ !contains(inputs.release_tags, '[fast-deploy]') }}
        run: |
          node grammar-corpus/validate-and-generate.mjs
          node tools/grammar-detector-v2/validate-and-compile.mjs
          git diff --exit-code -- \
            grammar-corpus/seed-corpus-v1.sql \
            grammar-corpus/sheets-v1 \
            workers/writing-submission/src/grammar-corpus.generated.js \
            writing-submission-corpus-detector.generated.js \
            writing-submission-executable-grammar.generated.js
          node tools/test-writing-submission-portal.mjs
          node tools/test-writing-submission-ai.mjs
          node --test tools/test-writing-submission-corpus-detector.mjs
          node tools/test-writing-submission-executable-grammar.mjs
          node tools/test-writing-submission-generalized-rules.mjs
          node tools/test-writing-submission-harper-vendor.mjs
          node tools/test-writing-submission-harper.mjs
          node --test tools/test-writing-submission-timer.mjs
          node --test tools/test-writing-submission-reference-data.mjs
          node --test tools/test-writing-portal-crosslinks.mjs

      - name: Checkout deployed Pages snapshot
        if: steps.preparation.outputs.mode == 'incremental'
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.preparation.outputs.snapshot_commit }}
          path: pages-snapshot
          fetch-depth: 1
          persist-credentials: false

      - name: Hydrate complete source before full artifact preparation
        if: steps.preparation.outputs.mode == 'full'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git config --bool core.sparseCheckout || true)" == true ]]; then
            df -h /
            sudo rm -rf -- \
              /usr/local/lib/android/sdk \
              /usr/share/dotnet \
              /opt/ghc
            git sparse-checkout disable
            git checkout -q --detach "${GITHUB_SHA}"
          fi
          if [[ "$(git config --bool core.sparseCheckout || true)" == true ]]; then
            echo "::error::Full artifact preparation cannot use a sparse checkout"
            exit 1
          fi
          missing=0
          while IFS= read -r -d '' path; do
            if [[ ! -e "$path" ]]; then
              echo "::error::Complete source checkout is missing $path"
              missing=$((missing + 1))
              if (( missing >= 25 )); then break; fi
            fi
          done < <(git ls-tree -rz --name-only "${GITHUB_SHA}")
          (( missing == 0 ))
          touch /tmp/pages-complete-source

      - name: Prepare site files incrementally
        if: steps.preparation.outputs.mode == 'incremental'
        shell: bash
        env:
          BASE_SHA: ${{ steps.preparation.outputs.base_sha }}
        run: |
          set -euo pipefail
          mkdir _site
          rsync -a \
            --exclude='.git' \
            --exclude='.source-sha' \
            pages-snapshot/ _site/
          python3 tools/prepare-pages-incremental.py apply \
            --source . \
            --site _site \
            --base "${BASE_SHA}" \
            --target "${GITHUB_SHA}" \
            --paths-file /tmp/pages-incremental-paths.txt
          python3 -m unittest tools/test-rewrite-pages-assets.py
          python3 tools/rewrite-pages-assets.py _site \
            --paths-file /tmp/pages-incremental-paths.txt
          test ! -d _site/assets
          test ! -d _site/eddy-carrot-patch/assets

      - name: Prepare site files
        if: steps.preparation.outputs.mode == 'full'
        run: |
          test -f /tmp/pages-complete-source
          mkdir _site
          node tools/ielts-reading-analysis-publication-excludes.mjs > /tmp/ielts-reading-analysis-excludes.txt
          rsync -av \
            --exclude-from=/tmp/ielts-reading-analysis-excludes.txt \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.DS_Store' \
            --exclude='_site' \
            --exclude='*.sql' \
            --exclude='news-discussion/*.json' \
            --exclude='dse-argument-bank/source.md' \
            --exclude='dse-argument-bank/*-source.md' \
            --exclude='natural-english/imported-lessons.json' \
            --exclude='natural-english/IMPORT-REVIEW.md' \
            --exclude='natural-english/audio/imported-metadata.json' \
            --exclude='/synonyms/source/' \
            --exclude='/course-materials/' \
            --exclude='song-appreciation-data.js' \
            --exclude='tools' \
            --exclude='workers' \
            --exclude='supabase' \
            --exclude='/assets/' \
            --exclude='/eddy-carrot-patch/assets/' \
            ./ _site/

      - name: Publish bilingual Paper 3 source readers
        if: steps.preparation.outputs.mode == 'full'
        run: |
          unzip -oq paper3/reader-batch.zip 'paper3/*' -d _site
          # The legacy archive supplies shared assets, but its HTML is older than
          # the maintained native readers. Keep the checked-in pages authoritative.
          rsync -a --exclude='reader-batch.zip' paper3/ _site/paper3/
          rm -f _site/paper3/reader-batch.zip
          cmp paper3/index.html _site/paper3/index.html
          cmp paper3/2013-b1/index.html _site/paper3/2013-b1/index.html
          python3 tools/add-paper3-study-support.py _site/paper3

      - name: Point public media at verified R2 packs
        if: steps.preparation.outputs.mode == 'full'
        run: |
          python3 -m unittest tools/test-rewrite-pages-assets.py
          python3 tools/rewrite-pages-assets.py _site --fast-scan
          test ! -d _site/assets
          test ! -d _site/eddy-carrot-patch/assets

      - name: Verify protected Song Appreciation data is absent from Pages artifact
        run: |
          test ! -e _site/song-appreciation-data.js
          if grep -RIl --include='*.js' \
            -e 'EDMUND_SONG_APPRECIATION_DATA' \
            -e 'You, with your words like knives' \
            -e 'Got me feeling like I' \
            -e '《Mean》描寫被欺凌' \
            _site/; then
            echo 'Protected Song Appreciation source material was copied into the public Pages artifact.' >&2
            exit 1
          fi

      - name: Verify News Discussion source data is absent from Pages artifact
        run: test ! -e _site/news-discussion/news-1.json

      - name: Verify DSE source manuscript is absent from Pages artifact
        run: |
          test ! -e _site/dse-argument-bank/source.md
          test -z "$(find _site/dse-argument-bank -maxdepth 1 -name '*-source.md' -print -quit)"

      - name: Verify Card 80 reference-scene photography is absent from Pages artifact
        run: |
          test ! -e _site/dse-practical-writing-media
          test ! -e _site/assets/dse-practical-writing

      - name: Stamp PWA release
        run: |
          grep -Fq '__EDMUND_RELEASE__' _site/service-worker.js
          grep -Fq '__EDMUND_RELEASE__' _site/pwa-register.js
          grep -Fq '__EDMUND_RELEASE__' _site/release.json
          sed -i "s/__EDMUND_RELEASE__/${GITHUB_SHA}/g" _site/service-worker.js
          sed -i "s/__EDMUND_RELEASE__/${GITHUB_SHA}/g" _site/pwa-register.js
          sed -i "s/__EDMUND_RELEASE__/${GITHUB_SHA}/g" _site/release.json
          grep -Fq "${GITHUB_SHA}" _site/service-worker.js
          grep -Fq "${GITHUB_SHA}" _site/pwa-register.js
          grep -Fq "${GITHUB_SHA}" _site/release.json
          if grep -Fq '__EDMUND_RELEASE__' \
            _site/service-worker.js \
            _site/pwa-register.js \
            _site/release.json; then
            echo 'PWA release placeholder was not fully stamped.' >&2
            exit 1
          fi

      - name: Rewrite public media to the verified Worker and remove R2 replicas
        if: vars.PAGES_R2_CUTOVER == 'true'
        run: |
          python3 -m unittest tools/test-rewrite-pages-public-media.py
          python3 tools/rewrite-pages-public-media.py \
            _site workers/edmund-public-media/src/media.json \
            --origin "${PAGES_MEDIA_ORIGIN}" \
            --audio-origin "https://ookkxzgpdclzrrhfmvqx.supabase.co/functions/v1/public-audio-relay/public" \
            --neural-audio-origin "https://ookkxzgpdclzrrhfmvqx.supabase.co/functions/v1/public-audio-relay" \
            --keep-list tools/pages-media-saved-links.txt
          python3 tools/prune-verified-pages-media.py \
            _site workers/edmund-public-media/src/media.json \
            --origin "${PAGES_MEDIA_ORIGIN}" \
            --keep-list tools/pages-media-saved-links.txt
          printf '%s\n' "${PAGES_MEDIA_ORIGIN}" > _site/pages-media-origin.txt

      - name: Compare unchanged audio manifests with the published site
        if: ${{ contains(inputs.release_tags, '[full-artifact]') }}
        env:
          SNAPSHOT: ${{ steps.preparation.outputs.snapshot_commit }}
          BASE: ${{ steps.preparation.outputs.base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git ls-tree --name-only "$SNAPSHOT" > "$RUNNER_TEMP/pages-snapshot-files"
          while IFS= read -r path; do
            case "$path" in *audio*manifest*.js)
              if git diff --quiet "$BASE" "$GITHUB_SHA" -- "$path"; then
                test "$(git rev-parse "$SNAPSHOT:$path")" = "$(git hash-object "_site/$path")" || {
                  echo "::error::Unchanged deployed audio differs in $path"
                  exit 1
                }
              fi ;;
            esac
          done < "$RUNNER_TEMP/pages-snapshot-files"

      - name: Verify complete student runtime dependency closure
        run: |
          python3 -m unittest \
            tools/test-verify-pages-artifact-dependencies.py \
            tools/test-verify-pages-flashcard-runtime.py
          python3 tools/verify-pages-flashcard-runtime.py _site --source .
          python3 tools/verify-pages-artifact-dependencies.py \
            _site \
            --source . \
            --system-map tools/pages-system-release-map.json \
            --git-ref "${GITHUB_SHA}"

      - name: Remove editorial QA reports and measure the upload
        env:
          CUTOVER: ${{ vars.PAGES_R2_CUTOVER }}
        run: |
          options=()
          if [[ "$CUTOVER" == true ]]; then options+=(--enforce); fi
          python3 tools/pages-artifact-inventory.py _site "${options[@]}"

      - name: Name this build artifact
        id: artifact_base
        run: echo "name=github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload GitHub Pages artifact
        id: upload_primary
        continue-on-error: true
        uses: actions/upload-pages-artifact@v4
        with:
          name: ${{ steps.artifact_base.outputs.name }}
          retention-days: 3
          path: _site

      - name: Retry only the failed artifact upload
        id: upload_retry
        if: steps.upload_primary.outcome == 'failure'
        uses: actions/upload-pages-artifact@v4
        with:
          name: ${{ steps.artifact_base.outputs.name }}-retry
          retention-days: 3
          path: _site

      - name: Select the stored artifact
        id: artifact
        env:
          PRIMARY_OUTCOME: ${{ steps.upload_primary.outcome }}
          BASE_NAME: ${{ steps.artifact_base.outputs.name }}
        run: |
          suffix=
          if [[ "${PRIMARY_OUTCOME}" != success ]]; then suffix=-retry; fi
          echo "name=${BASE_NAME}${suffix}" >> "${GITHUB_OUTPUT}"
