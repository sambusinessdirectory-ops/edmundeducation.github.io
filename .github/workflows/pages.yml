          node tools/test-song-preview.cjs
          node tools/test-song-appreciation.mjs
          node tools/test-song-live-sync.mjs
          npm ci --prefix tools/email-qa --ignore-scripts
          node tools/test-song-live-sql.mjs
          node tools/test-song-room-sql.mjs
          node tools/test-song-learning-sections-db.mjs
          node tools/test-song-recovery-eight.mjs
