name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    # Simple homepage artwork updates use pages-fast.yml instead.
    if: ${{ !contains(github.event.head_commit.message, '[site-fast]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: pages
      queue: single
      cancel-in-progress: false
    environment:
      name: github-pages
      url: https://edmundeducation.com/

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Validate character coin fast release
        if: ${{ contains(github.event.head_commit.message, '[fast-deploy]') && contains(github.event.head_commit.message, '[coin-release]') }}
        run: |
          node --test tools/test-character-coins.mjs
          node --check shared-system-nav.js
          node --check shared-companion.mjs

      - name: Validate closet fast release
        if: ${{ contains(github.event.head_commit.message, '[fast-deploy]') && !contains(github.event.head_commit.message, '[sentence-release]') && !contains(github.event.head_commit.message, '[phrasal-release]') && !contains(github.event.head_commit.message, '[proverb-release]') && !contains(github.event.head_commit.message, '[idiom-release]') && !contains(github.event.head_commit.message, '[speaking-release]') && !contains(github.event.head_commit.message, '[writing-release]') && !contains(github.event.head_commit.message, '[polysemy-release]') && !contains(github.event.head_commit.message, '[synonyms-release]') && !contains(github.event.head_commit.message, '[grammar-release]') && !contains(github.event.head_commit.message, '[native-release]') && !contains(github.event.head_commit.message, '[italian-release]') && !contains(github.event.head_commit.message, '[homework-release]') && !contains(github.event.head_commit.message, '[reading-release]') && !contains(github.event.head_commit.message, '[listening-release]') && !contains(github.event.head_commit.message, '[professional-release]') && !contains(github.event.head_commit.message, '[paper3-release]') && !contains(github.event.head_commit.message, '[junior-release]') && !contains(github.event.head_commit.message, '[irregular-release]') && !contains(github.event.head_commit.message, '[news-release]') && !contains(github.event.head_commit.message, '[dse-arguments-release]') && !contains(github.event.head_commit.message, '[error-id-release]') && !contains(github.event.head_commit.message, '[coin-release]') && !contains(github.event.head_commit.message, '[homepage-rollback]') && !contains(github.event.head_commit.message, '[homepage-release]') }}
        run: |
          node tools/test-common-expression-closet.mjs
          node --test tools/test-eddy-cosmetics.mjs
          node tools/test-wardrobe-visual-acceptance.mjs

      - name: Validate focused homepage selector rollback
        if: ${{ contains(github.event.head_commit.message, '[fast-deploy]') && contains(github.event.head_commit.message, '[homepage-rollback]') }}
        run: |
          test ! -e academy-nexus-selector-frame-v1.webp
          ! grep -Fq 'academy-nexus-selector-frame-v1.webp' index.html
          ! grep -Fq 'academy-nexus-selector-frame-v1.webp' homepage-system-deck.css
          node --check homepage-system-deck.js

      - name: Validate focused homepage selector release
        if: ${{ contains(github.event.head_commit.message, '[fast-deploy]') && contains(github.event.head_commit.message, '[homepage-release]') }}
        run: |
          test -s academy-nexus-selector-frame-v2.webp
          grep -Fq 'academy-nexus-selector-frame-v2.webp' index.html
          grep -Fq '20261023-academy-nexus5' index.html
          grep -Fq 'aspect-ratio: 3 / 1;' homepage-system-deck.css
          grep -Fq 'background: transparent;' homepage-system-deck.css
          grep -Fq 'object-fit: contain;' homepage-system-deck.css
          grep -Fq 'pointer-events: none;' homepage-system-deck.css
          node --check homepage-system-deck.js

      - name: Validate focused Phrasal Verb login release
        if: ${{ contains(github.event.head_commit.message, '[fast-deploy]') && contains(github.event.head_commit.message, '[phrasal-release]') }}
        run: |
          test -s phrasal-verb-verdant-login-frame-v1.webp
          grep -Fq 'phrasal-verb-verdant-login-frame-v1.webp' phrasal-verb-system.css
          grep -Fq '20261022-verdant-login1' phrasal-verb-system.html
          node --check phrasal-verb-system.js
          node --test tools/test-phrasal-verb-system.mjs

      - name: Validate focused Proverb login release
        if: ${{ contains(github.event.head_commit.message, '[fast-deploy]') && contains(github.event.head_commit.message, '[proverb-release]') }}
        run: |
          test -s proverb-purple-spellbook-login-frame-v1.webp
          grep -Fq 'proverb-purple-spellbook-login-frame-v1.webp' proverb-system.css
          grep -Fq '20261022-purple-spellbook1' proverb-system.html
          node --check proverb-system.js
          node --test tools/test-proverb-system.mjs tools/test-proverb-black-sand.mjs

      - name: Validate focused Polysemy artwork release
        if: ${{ contains(github.event.head_commit.message, '[fast-deploy]') && contains(github.event.head_commit.message, '[polysemy-release]') }}
        run: |
          node --check polysemy-lab/app.mjs
          node --check polysemy-lab/media.mjs
          node --check polysemy-lab/recording.mjs
          node tools/test-polysemy-eddy-art.mjs

      - name: Validate focused Professional English release
        if: ${{ contains(github.event.head_commit.message, '[fast-deploy]') && contains(github.event.head_commit.message, '[professional-release]') }}
        run: |
          node --check professional-english/app.js
          node --check professional-english/reader.mjs
          node --check professional-english/library.mjs
          node tools/test-professional-lesson5.mjs
          node tools/test-professional-lesson5-exercises.mjs
          node tools/test-professional-synonym-quiz.mjs
          node tools/test-professional-synonym-audio.mjs
          node --check professional-english/dialogue-practice.mjs
          node --check professional-english/synonyms-practice.mjs
          node --check professional-english/situation-cards.mjs

      - name: Validate focused Italian lesson release
        if: ${{ contains(github.event.head_commit.message, '[fast-deploy]') && contains(github.event.head_commit.message, '[italian-release]') }}
        run: |
          node --check italian-2-torta-coi-bischeri-data.js
          node --check italian-2-audio.js
          node tools/test-italian-text2.mjs
          node tools/test-language-editions.mjs

      - name: Validate focused Synonyms release
        if: ${{ contains(github.event.head_commit.message, '[fast-deploy]') && contains(github.event.head_commit.message, '[synonyms-release]') }}
        run: |
          node --check synonyms/app.mjs
          node --check synonyms/important-data.mjs
          python3 tools/test-synonym-curation-import.py

      - name: Validate focused Grammar release
        if: ${{ contains(github.event.head_commit.message, '[fast-deploy]') && contains(github.event.head_commit.message, '[grammar-release]') }}
        run: |
          npm ci --prefix tools/email-qa --ignore-scripts
          node --check grammar-system.js
          node --check grammar-admin.js
          node tools/test-grammar-admin-connection.mjs
          node tools/test-grammar-admin-export.mjs
          node tools/test-grammar-tense-system.mjs
          node tools/test-grammar-tense-extension.mjs
          node --check grammar-articles.js
          node tools/test-grammar-articles-system.mjs
          node --check grammar-advanced-articles.js
          node tools/test-grammar-advanced-articles-system.mjs

      - name: Validate focused Native English release
        if: ${{ contains(github.event.head_commit.message, '[fast-deploy]') && contains(github.event.head_commit.message, '[native-release]') }}
        run: |
          test -s native-english-sky-kingdom-login-frame-v4.webp
          grep -Fq 'native-english-sky-kingdom-login-frame-v4.webp' natural-english/style.css
          grep -Fq '20261022-sky-kingdom-login2-placement' natural-english.html
          node --check natural-english/app.mjs
          node --check natural-english/catalogue.mjs
          node tools/test-native-redesign-plan.mjs
          node tools/test-native-editorial-drafts.mjs
          node tools/check-native-redesign-release.mjs
          node tools/test-natural-english-import.mjs
          npm ci --prefix tools/email-qa --ignore-scripts
          node tools/test-natural-english-modules.mjs
          node tools/test-advanced-native.mjs
          node tools/build-advanced-native-catalogue.mjs --check

      - name: Validate focused Homework export release
        if: ${{ contains(github.event.head_commit.message, '[fast-deploy]') && contains(github.event.head_commit.message, '[homework-release]') }}
        run: |
          npm ci --prefix tools/email-qa --ignore-scripts
          node --check error-identifier.js
          node --check error-identifier-passage.js
          node --check junior-exam-prep/app.mjs
          node tools/test-homework-course-links.mjs
          node tools/test-junior-exam-prep.mjs
          node --check schedule-system.js
          node --check schedule-homework-export.mjs
          node tools/test-schedule-homework-export.mjs
          node tools/test-schedule-homework-links.mjs
          node tools/test-schedule-system.mjs
          node tools/test-schedule-clipboard.mjs

      - name: Validate focused Study tools release
        if: ${{ contains(github.event.head_commit.message, '[fast-deploy]') && contains(github.event.head_commit.message, '[study-release]') }}
        run: |
          npm ci --prefix tools/email-qa --ignore-scripts
          node --check junior-text-highlighter.mjs
          node --check study-highlighter-bootstrap.mjs
          node --check junior-exam-prep/app.mjs
          node --check junior-exam-prep/legacy.mjs
          node --check grammar-system.js
          node --check grammar-articles.js
          node --check grammar-advanced-articles.js
          node --check error-identifier.js
          node --check error-identifier-passage.js
          node --check reading-comprehension.js
          node tools/test-study-highlighter.mjs
          node tools/test-dse-reading-question-types.mjs
          node tools/test-junior-exam-prep.mjs

      - name: Validate focused Junior Exam Prep release
        if: ${{ contains(github.event.head_commit.message, '[fast-deploy]') && contains(github.event.head_commit.message, '[junior-release]') }}
        run: |
          node --check junior-exam-prep/app.mjs
          node tools/test-junior-exam-prep.mjs
          node --check junior-quiz-review/app.mjs
          node tools/test-junior-quiz-review.mjs
          node tools/test-schedule-system.mjs

      - name: Validate focused Irregular Verb release
        if: ${{ contains(github.event.head_commit.message, '[fast-deploy]') && contains(github.event.head_commit.message, '[irregular-release]') }}
        run: |
          node --check irregular-verbs/app.mjs
          node tools/test-irregular-verbs.mjs

      - name: Validate focused News Discussion release
        if: ${{ contains(github.event.head_commit.message, '[fast-deploy]') && contains(github.event.head_commit.message, '[news-release]') }}
        run: |
          node --check news-discussion/app.mjs
          node --check shared-system-nav.js
          node -e "const fs=require('fs'); const h=fs.readFileSync('index.html','utf8'); const p=fs.readFileSync('news-discussion.html','utf8'); if(!h.includes('href=\"news-discussion.html\"')||!p.includes('news-discussion/app.mjs')) throw Error('Card 75 is not linked')"

      - name: Validate focused DSE Argument Bank release
        if: ${{ contains(github.event.head_commit.message, '[fast-deploy]') && contains(github.event.head_commit.message, '[dse-arguments-release]') }}
        run: |
          node --check dse-argument-bank/app.mjs
          node --check shared-system-nav.js
          python3 tools/build-dse-argument-bank.py
          python3 tools/build-dse-driving-bank.py
          python3 tools/build-dse-self-care-bank.py
          python3 tools/build-dse-mario-bank.py
          python3 tools/build-dse-subtitles-bank.py
          git diff --exit-code -- dse-argument-bank/data.json dse-argument-bank/driving-data.json dse-argument-bank/self-care-data.json dse-argument-bank/mario-data.json dse-argument-bank/subtitles-data.json
          node tools/test-dse-argument-bank.mjs
          node tools/test-dse-argument-auth.mjs
          python3 tools/verify-dse-speaking-import.py
          node tools/test-dse-argument-audio-worker.mjs
          node tools/generate-dse-speaking-question-types.mjs > /dev/null
          git diff --exit-code -- dse-speaking-question-types.json
          node tools/generate-ielts-speaking-part3-types.mjs
          git diff --exit-code -- ielts-speaking-part3-question-types.json

      - name: Validate focused Paper 3 curation release
        if: ${{ contains(github.event.head_commit.message, '[fast-deploy]') && contains(github.event.head_commit.message, '[paper3-release]') }}
        run: |
          node --check paper3/2025-b2/reader.js
          node --check paper3/2025-b2/sentence-analysis.js
          node --check paper3/2025-b2/listening-notes.js
          node --check paper3/2025-b2/super-curation-highlights.js
          node --check paper3/2025-b2/super-curation.js
          node -e "const s=require('fs').readFileSync('paper3/2025-b2/index.html','utf8'); for(const name of ['super-curation.css','super-curation-highlights.js','super-curation.js']) if(!s.includes(name)) throw Error('Missing '+name)"

      - name: Validate focused DSE Reading release
        if: ${{ contains(github.event.head_commit.message, '[fast-deploy]') && contains(github.event.head_commit.message, '[reading-release]') }}
        run: |
          node --check reading-comprehension.js
          node tools/test-dse-native-paper-view.mjs
          node tools/test-dse-reading-question-audit.mjs
          node tools/test-dse-reading-translations.mjs
          node tools/test-dse-deep-analysis.mjs
          node tools/test-dse-analysis-batch.mjs

      - name: Validate focused DSE Listening release
        if: ${{ contains(github.event.head_commit.message, '[fast-deploy]') && contains(github.event.head_commit.message, '[listening-release]') }}
        run: |
          test -s listening-harp-rose-login-frame-v4.webp
          grep -Fq 'listening-harp-rose-login-frame-v4.webp' listening-system.css
          grep -Fq '20261022-harp-login1' listening-system.html
          node --check listening-system.js
          node --check dse-listening-2025-data.js
          node --check dse-listening-2025-transcript.js
          node --check dse-listening-2026-data.js
          node --check dse-listening-2026-transcript.js
          node tools/test-dse-listening-2025-2026.mjs
          node tools/test-listening-system.mjs
          node tools/test-dse-listening-2022-2024.mjs

      - name: Validate focused Speaking release
        if: ${{ contains(github.event.head_commit.message, '[fast-deploy]') && contains(github.event.head_commit.message, '[speaking-release]') }}
        run: |
          test -s speaking-dragon-stone-login-frame-v2.webp
          test -s speaking-dragon-stone-login-frame-mobile-v2.webp
          grep -Fq 'speaking-dragon-stone-login-frame-v2.webp' speaking-system.css
          grep -Fq 'speaking-dragon-stone-login-frame-mobile-v2.webp' speaking-system.css
          grep -Fq '20261022-dragon-login4-room' speaking-system.html
          node --check speaking-system.js
          node tools/test-professional-discussion-timing.mjs

      - name: Validate focused Writing release
        if: ${{ contains(github.event.head_commit.message, '[fast-deploy]') && contains(github.event.head_commit.message, '[writing-release]') }}
        run: |
          node --check writing-submission.js
          node --test tools/test-writing-function-helper.mjs
          node --test tools/test-writing-sentence-support.mjs
          node --test tools/test-writing-speaking-topics.mjs
          node --check writing-proofread-checklist.mjs
          node --check writing-feedback-reading.mjs
          node --check writing-dse-paper.mjs
          node --check writing-submission-sharing.mjs
          node --check writing-submission-qr.mjs
          node --check country-name-spelling.js
          node --check writing-reference-pocket.mjs
          node --check writing-paragraph-clipboard.mjs
          node --check homepage-system-deck.js
          node --check polysemy-lab/media.mjs
          node --check polysemy-lab/app.mjs
          node --test workers/writing-submission/test/*.test.mjs
          node --test tools/test-writing-proofread-proxy.mjs
          node --test --test-name-pattern='article notifications use strict owner-scoped deep links|writing question images survive the public R2 asset migration|article and feedback navigation invalidates stale requests|admin feedback queue and fullscreen|structured feedback supports' tools/test-writing-submission-portal.mjs

      - name: Install image validation dependency
        if: ${{ !contains(github.event.head_commit.message, '[fast-deploy]') }}
        run: npm ci --prefix tools/email-qa --ignore-scripts

      - name: Validate execution speedrun timing and recovery
        if: ${{ !contains(github.event.head_commit.message, '[fast-deploy]') }}
        run: |
          node tools/test-execution-system.mjs
          node --test tools/test-execution-speedrun.mjs

      - name: Validate membership preview and payment-disabled security boundary
        if: ${{ !contains(github.event.head_commit.message, '[fast-deploy]') }}
        run: |
          node --test tools/test-membership-foundation.mjs
          npm test --prefix workers/membership

      - name: Validate Flashcard speech recognition lifecycle
        if: ${{ !contains(github.event.head_commit.message, '[fast-deploy]') }}
        run: |
          node tools/test-pronunciation-gating.mjs
          node --test tools/test-flashcard-speech-recognition.mjs tools/test-flashcard-local-recognition.mjs tools/test-local-recognition-storage.mjs

      - name: Validate Flashcard conflict recovery release gate
        if: ${{ !contains(github.event.head_commit.message, '[fast-deploy]') }}
        run: |
          node tools/test-flashcard-state-integrity.mjs
          node tools/test-flashcard-sync-resilience.mjs
          node tools/test-flashcard-deck-modes.mjs
          node tools/test-flashcard-range-worlds.mjs
          node tools/test-flashcard-range-map.mjs
          node tools/test-flashcard-conflict-recovery-ui.mjs
          node tools/test-flashcard-pwa-critical-update.mjs
          node tools/test-flashcard-login-singleflight.mjs
          node tools/test-flashcard-login-progress.mjs
          node tools/build-flashcard-lazy-startup.mjs --check
          node tools/test-flashcard-private-decks.mjs
          node tools/test-sunny-s3-grammar-book.mjs

      - name: Refresh lightweight IELTS Reading deck index
        if: ${{ !contains(github.event.head_commit.message, '[fast-deploy]') }}
        run: node tools/generate-ielts-reading-index.mjs

      - name: Validate Eddie Farm points and purchase safety
        if: ${{ !contains(github.event.head_commit.message, '[fast-deploy]') }}
        run: node --test tools/test-eddie-farm.mjs tools/test-eddie-farm-i18n.mjs

      - name: Validate and regenerate the complete Phrasal Verb catalogue
        if: ${{ !contains(github.event.head_commit.message, '[fast-deploy]') }}
        run: |
          node tools/build-phrasal-verb-expansion.mjs
          node tools/generate-phrasal-verb-catalog.mjs
          node tools/generate-phrasal-verb-sql.mjs
          git diff --exit-code -- \
            phrasal-verb-system-data.js \
            workers/phrasal-verb-system/src/catalog.js \
            supabase-phrasal-verb-system.sql \
            supabase-phrasal-verb-system-lessons-36-329.sql
          node --test tools/test-phrasal-verb-system.mjs
          node --test tools/test-phrasal-desert.mjs
          node --test tools/test-phrasal-night.mjs
          node --test tools/test-phrasal-bakery.mjs
          node --test tools/test-phrasal-verb-attempt-outbox.mjs
          node tools/test-phrasal-verb-stale-snapshot-migration.mjs
          node workers/phrasal-verb-system/scripts/verify-catalog.mjs
          npm test --prefix workers/phrasal-verb-system

      - name: Validate and regenerate the complete Idiom catalogue
        if: ${{ !contains(github.event.head_commit.message, '[fast-deploy]') }}
        run: |
          node tools/build-idiom-expansion.mjs
          node tools/generate-idiom-catalog.mjs
          node tools/generate-idiom-sql.mjs
          git diff --exit-code -- \
            idiom-system-data.js \
            workers/idiom-system/src/catalog.js \
            supabase-idiom-system-lessons-26-138.sql
          node --test tools/test-idiom-system.mjs
          node tools/test-idiom-system-runtime.mjs
          node --test tools/test-idiom-paper.mjs
          npm test --prefix workers/idiom-system

      - name: Validate focused Idiom Compass release
        if: ${{ contains(github.event.head_commit.message, '[fast-deploy]') && contains(github.event.head_commit.message, '[idiom-release]') }}
        run: |
          node --check idiom-system.js
          node --check idiom-compass-06-30-curation.js
          node --check idiom-compass-06-30-bonus.js
          node tools/test-idiom-system-runtime.mjs
          node --test tools/test-idiom-system.mjs tools/test-idiom-paper.mjs
          node tools/test-mobile-exercise-actions.mjs
          npm test --prefix workers/idiom-system

      - name: Validate and regenerate the complete Proverb catalogue
        if: ${{ !contains(github.event.head_commit.message, '[fast-deploy]') }}
        run: |
          node tools/build-proverb-system-data.mjs
          node tools/generate-proverb-catalog.mjs
          node tools/generate-proverb-sql.mjs
          git diff --exit-code -- \
            proverb-system-data.js \
            workers/proverb-system/src/catalog.js \
            supabase-proverb-system-lessons-2-3.sql
          node --test tools/test-proverb-system.mjs tools/test-proverb-black-sand.mjs
          node workers/proverb-system/scripts/verify-catalog.mjs
          npm test --prefix workers/proverb-system

      - name: Validate and regenerate the complete Sentence Structure catalogue
        if: ${{ !contains(github.event.head_commit.message, '[fast-deploy]') }}
        run: |
          node tools/build-sentence-structure-expansion.mjs
          node tools/generate-sentence-structure-catalog.mjs
          node tools/build-sentence-structure-library.mjs --check
          git diff --exit-code -- \
            sentence-structure-lessons-5-345.js \
            workers/sentence-structure/src/catalog.js
          node --test tools/test-sentence-structure-system.mjs
          node tools/test-sentence-structure-trophies.mjs
          node tools/test-horsey-award-dates.mjs
          node tools/test-companion-trophy-directions.mjs
          node --test tools/test-eddy-cosmetics.mjs
          node tools/test-wardrobe-visual-acceptance.mjs
          node tools/test-horsey-portals.mjs
          node tools/test-common-expression-closet.mjs
          node --test tools/test-sentence-structure-coast.mjs tools/test-sentence-structure-realms.mjs tools/test-sentence-structure-zen.mjs tools/test-sentence-structure-dream.mjs tools/test-sentence-structure-toy.mjs tools/test-sentence-structure-hotel.mjs
          node tools/test-mobile-exercise-actions.mjs
          npm test --prefix workers/sentence-structure

      - name: Refresh homework resource catalog
        if: ${{ !contains(github.event.head_commit.message, '[fast-deploy]') }}
        run: |
          node tools/generate-homework-resource-catalog.mjs
          node tools/generate-writing-submission-worker-topic-catalog.mjs
          git diff --exit-code -- homework-resource-catalog.mjs
          git diff --exit-code -- workers/writing-submission/src/topic-catalog.js

      - name: Validate DSE Writing Part B imported library
        if: ${{ !contains(github.event.head_commit.message, '[fast-deploy]') }}
        run: |
          node tools/test-dse-writing-part-b.mjs
          node tools/test-dse-writing-part-b-downloads.mjs
          node tools/test-dse-writing-part-b-audio.mjs

      - name: Validate homework resource catalog and numeric search
        if: ${{ !contains(github.event.head_commit.message, '[fast-deploy]') }}
        run: node tools/test-schedule-homework-links.mjs

      - name: Validate unified student progress data and portal contracts
        if: ${{ !contains(github.event.head_commit.message, '[fast-deploy]') }}
        run: |
          node tools/test-student-progress-core.mjs
          node tools/test-student-progress-portal.mjs
          npm test --prefix workers/student-progress

      - name: Validate IELTS Reading Passage 1 and Passage 2 flashcards and voice
        if: ${{ !contains(github.event.head_commit.message, '[fast-deploy]') }}
        run: |
          node tools/test-ielts-reading-passage1-flashcards.mjs
