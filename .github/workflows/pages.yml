name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://edmundeducation.com/

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Validate membership preview and payment-disabled security boundary
        run: |
          node --test tools/test-membership-foundation.mjs
          npm test --prefix workers/membership

      - name: Validate Flashcard conflict recovery release gate
        run: |
          node tools/test-flashcard-state-integrity.mjs
          node tools/test-flashcard-deck-modes.mjs
          node tools/test-flashcard-conflict-recovery-ui.mjs
          node tools/test-flashcard-pwa-critical-update.mjs
          node tools/test-flashcard-login-singleflight.mjs

      - name: Refresh lightweight IELTS Reading deck index
        run: node tools/generate-ielts-reading-index.mjs

      - name: Validate and regenerate the complete Phrasal Verb catalogue
        run: |
          node tools/build-phrasal-verb-expansion.mjs
          node tools/generate-phrasal-verb-catalog.mjs
          node tools/generate-phrasal-verb-sql.mjs
          git diff --exit-code -- \
            phrasal-verb-system-data.js \
            workers/phrasal-verb-system/src/catalog.js \
            supabase-phrasal-verb-system.sql \
            supabase-phrasal-verb-system-lessons-36-329.sql
          node --test tools/test-phrasal-verb-system.mjs
          node --test tools/test-phrasal-verb-attempt-outbox.mjs
          node tools/test-phrasal-verb-stale-snapshot-migration.mjs
          node workers/phrasal-verb-system/scripts/verify-catalog.mjs
          npm test --prefix workers/phrasal-verb-system

      - name: Validate and regenerate the complete Idiom catalogue
        run: |
          node tools/build-idiom-expansion.mjs
          node tools/generate-idiom-catalog.mjs
          node tools/generate-idiom-sql.mjs
          git diff --exit-code -- \
            idiom-system-data.js \
            workers/idiom-system/src/catalog.js \
            supabase-idiom-system-lessons-26-138.sql
          node --test tools/test-idiom-system.mjs
          node tools/test-idiom-system-runtime.mjs
          npm test --prefix workers/idiom-system

      - name: Validate and regenerate the complete Proverb catalogue
        run: |
          node tools/build-proverb-system-data.mjs
          node tools/generate-proverb-catalog.mjs
          node tools/generate-proverb-sql.mjs
          git diff --exit-code -- \
            proverb-system-data.js \
            workers/proverb-system/src/catalog.js \
            supabase-proverb-system-lessons-2-3.sql
          node --test tools/test-proverb-system.mjs
          node workers/proverb-system/scripts/verify-catalog.mjs
          npm test --prefix workers/proverb-system

      - name: Validate and regenerate the complete Sentence Structure catalogue
        run: |
          node tools/build-sentence-structure-expansion.mjs
          node tools/generate-sentence-structure-catalog.mjs
          git diff --exit-code -- \
            sentence-structure-lessons-5-345.js \
            workers/sentence-structure/src/catalog.js
          node --test tools/test-sentence-structure-system.mjs
          node tools/test-mobile-exercise-actions.mjs
          npm test --prefix workers/sentence-structure

      - name: Refresh homework resource catalog
        run: |
          node tools/generate-homework-resource-catalog.mjs
          node tools/generate-writing-submission-worker-topic-catalog.mjs
          git diff --exit-code -- homework-resource-catalog.mjs
          git diff --exit-code -- workers/writing-submission/src/topic-catalog.js

      - name: Validate homework resource catalog and numeric search
        run: node tools/test-schedule-homework-links.mjs

      - name: Validate unified student progress data and portal contracts
        run: |
          node tools/test-student-progress-core.mjs
          node tools/test-student-progress-portal.mjs
          npm test --prefix workers/student-progress

      - name: Validate IELTS Reading Passage 1 and Passage 2 flashcards and voice
        run: |
          node tools/test-ielts-reading-passage1-flashcards.mjs
          node tools/test-ielts-reading-passage2-flashcards.mjs

      - name: Validate IELTS Reading Passage 3 flashcards, data and Homework integration
        run: |
          node tools/test-ielts-reading-passage3-flashcards.mjs
          node tools/test-ielts-reading-passage3-integration.mjs

      - name: Validate IELTS Reading analysis catalogue and Mungo Man content
        run: |
          node tools/test-ielts-reading-analysis.mjs
          node --test tools/test-ielts-reading-analysis-lazy-loader.mjs
          node tools/test-ielts-reading-analysis-imported-data.mjs
          node tools/test-ielts-reading-analysis-p2-imported-data.mjs
          node tools/test-ielts-reading-analysis-p3-imported-data.mjs

      - name: Validate August flashcard expansion taxonomy and lazy loading
        run: |
          node tools/test-flashcard-expansion-20260801.mjs
          node tools/test-flashcard-expansion-20260801-ui.mjs

      - name: Validate Civics Book 1 concept vocabulary, voice and Homework links
        run: |
          node tools/test-government-civics-book1-flashcards.mjs

      - name: Validate Civics Book 2 concept vocabulary, voice and Homework links
        run: |
          node tools/test-government-civics-book2-flashcards.mjs

      - name: Validate HKFSD Book 1 concept vocabulary, voice and Homework links
        run: |
          node tools/test-hkfsd-concept-vocabulary-book1-flashcards.mjs

      - name: Validate HKFSD Incident Report 3 Flash Cards and Writing Practice
        run: |
          node tools/test-hkfsd-incident-report-3.mjs
          node tools/test-hkfsd-incident-report-flashcards.mjs
          node tools/test-hkfsd-incident-report-writing.mjs

      - name: Validate Business Concepts Book 1 flashcards, voice and Homework links
        run: |
          node tools/test-business-concepts-book1-flashcards.mjs

      - name: Validate Business English Writing Book 1, voice and Homework links
        run: |
          node tools/test-business-writing-book1.mjs

      - name: Validate immutable packed flashcard audio Worker routing
        run: |
          node tools/test-edmund-audio-worker.mjs
          node tools/verify-flashcard-audio-flashcard-expansion.mjs --require-complete

      - name: Validate Listening portal, 80-track catalogue and playback speeds
        run: |
          node tools/test-listening-system.mjs
          node tools/test-grammar-listening-practice1.mjs
          node --test tools/test-listening-study.mjs

      - name: Validate IELTS Listening Practice download catalogue and thumbnails
        run: node tools/test-ielts-listening-download-catalog.mjs

      - name: Validate IELTS Writing Task 1 flashcards and female voice
        run: |
          node tools/test-ielts-writing-task1-flashcards.mjs
          node tools/test-ielts-writing-task1-audio.mjs

      - name: Validate IELTS Writing Task 1 practice, downloads, voice and reciprocal links
        run: |
          node tools/test-ielts-writing-task1-practice.mjs
          node tools/test-ielts-task1-download-catalog.mjs
          node tools/test-essay-portal-links.mjs
          node tools/test-writing-translation-toggle.mjs

      - name: Validate DSE Writing Part A resources and sticky listening controls
        run: |
          node tools/test-dse-writing-part-a.mjs
          node --test tools/test-writing-practice-listening-sticky.mjs

      - name: Validate Schedule System and Mass Edit clipboard
        run: |
          node tools/test-schedule-clipboard.mjs
          node tools/test-schedule-motivation.mjs
          node tools/test-schedule-wellbeing.mjs
          node tools/test-schedule-self-evaluation-admin.mjs
          node tools/test-schedule-reminder-email-and-hotkeys.mjs
          node tools/test-schedule-email-linked-homework.mjs
          node tools/test-schedule-quote-encouragement.mjs
          node tools/test-schedule-announcement-edit.mjs
          node tools/test-schedule-system.mjs
          node tools/test-schedule-learning-experience.mjs
          node tools/test-schedule-worker.mjs
          node tools/test-parent-communication-system.mjs
          node tools/test-schedule-account-admin-parity.mjs

      - name: Validate Speaking sticky recorder, repeated recordings and private storage
        run: |
          node tools/test-speaking-recorder-workflow.mjs
          node tools/test-speaking-progress-dashboard.mjs
          node tools/test-speaking-exam-mode.mjs
          npm test --prefix workers/speaking-system

      - name: Validate all six Common Expression portals, lessons and persistence contracts
        run: node --test tools/test-common-expression-system.mjs

      - name: Validate DSE Paper 3 portal, shared login and imported analysis data
        run: |
          node tools/test-dse-paper3-analysis-data.mjs
          node tools/test-dse-paper3-analysis-portal.mjs

      - name: Validate PWA, shared portal navigation, mobile icons, and brand metadata
        run: |
          node tools/generate-system-pwa-manifests.mjs --check
          node tools/test-system-pwa-experience.mjs
          node tools/test-shared-system-nav.mjs
          node tools/test-learning-portal-scaffolds.mjs
          node tools/test-grammar-tense-system.mjs
          node --test tools/test-apostrophe-normalizer.mjs
          node tools/test-pwa-and-brand-metadata.mjs
          node tools/test-idle-break-timer-integrations.mjs
          node tools/test-unified-bookmark-directory.mjs

      - name: Validate Video Class portal, permissions, and protected range delivery
        run: |
          node tools/test-video-class.mjs
          node tools/test-homepage-video-opacity.mjs

      - name: Validate Song Appreciation portal, data protection, and secure workflows
        run: node tools/test-song-appreciation.mjs

      - name: Validate Eddy game public bundle and asset publication gate
        run: node tools/test-eddy-game-publication.mjs

      - name: Validate Writing Submission portal and self-hosted grammar engine
        run: |
          node grammar-corpus/validate-and-generate.mjs
          node tools/grammar-detector-v2/validate-and-compile.mjs
          git diff --exit-code -- \
            grammar-corpus/seed-corpus-v1.sql \
            grammar-corpus/sheets-v1 \
            workers/writing-submission/src/grammar-corpus.generated.js \
            writing-submission-corpus-detector.generated.js \
            writing-submission-executable-grammar.generated.js
          node tools/test-writing-submission-portal.mjs
          node tools/test-writing-submission-ai.mjs
          node --test tools/test-writing-submission-corpus-detector.mjs
          node tools/test-writing-submission-executable-grammar.mjs
          node tools/test-writing-submission-generalized-rules.mjs
          node tools/test-writing-submission-harper-vendor.mjs
          node tools/test-writing-submission-harper.mjs
          node --test tools/test-writing-submission-timer.mjs
          node --test tools/test-writing-submission-reference-data.mjs
          node --test tools/test-writing-portal-crosslinks.mjs

      - name: Prepare site files
        run: |
          mkdir _site
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.DS_Store' \
            --exclude='_site' \
            --exclude='*.sql' \
            --exclude='song-appreciation-data.js' \
            --exclude='tools' \
            --exclude='workers' \
            --exclude='supabase' \
            --exclude='assets/speaking-system/audio/edmund-neural/part1/' \
            --exclude='assets/speaking-system/audio/edmund-neural/part3/' \
            ./ _site/

      - name: Verify protected Song Appreciation data is absent from Pages artifact
        run: |
          test ! -e _site/song-appreciation-data.js
          if grep -RIl --include='*.js' \
            -e 'EDMUND_SONG_APPRECIATION_DATA' \
            -e 'You, with your words like knives' \
            -e 'Got me feeling like I' \
            -e '《Mean》描寫被欺凌' \
            _site/; then
            echo 'Protected Song Appreciation source material was copied into the public Pages artifact.' >&2
            exit 1
          fi

      - name: Stamp PWA release
        run: |
          grep -Fq '__EDMUND_RELEASE__' _site/service-worker.js
          grep -Fq '__EDMUND_RELEASE__' _site/pwa-register.js
          grep -Fq '__EDMUND_RELEASE__' _site/release.json
          sed -i "s/__EDMUND_RELEASE__/${GITHUB_SHA}/g" _site/service-worker.js
          sed -i "s/__EDMUND_RELEASE__/${GITHUB_SHA}/g" _site/pwa-register.js
          sed -i "s/__EDMUND_RELEASE__/${GITHUB_SHA}/g" _site/release.json
          grep -Fq "${GITHUB_SHA}" _site/service-worker.js
          grep -Fq "${GITHUB_SHA}" _site/pwa-register.js
          grep -Fq "${GITHUB_SHA}" _site/release.json
          if grep -Fq '__EDMUND_RELEASE__' \
            _site/service-worker.js \
            _site/pwa-register.js \
            _site/release.json; then
            echo 'PWA release placeholder was not fully stamped.' >&2
            exit 1
          fi

      - name: Show Pages artifact size
        run: |
          du -sh _site
          find _site -type f -printf '%s %p\n' | sort -nr | head -20

      - name: Clean previous Pages artifacts for this run
        uses: actions/github-script@v8
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });

            for (const artifact of artifacts.filter((item) => item.name.startsWith("github-pages"))) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
            }

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site

      - name: Wait for artifact availability
        run: sleep 10

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          timeout: 900000
          error_count: 30
