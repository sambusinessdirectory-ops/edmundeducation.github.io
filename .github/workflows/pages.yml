name: Build complete GitHub Pages artifact

on:
  workflow_call:
    inputs:
      base_sha:
        required: true
        type: string
      release_tags:
        required: false
        type: string
        default: ""
      ignore_validation_cache:
        required: false
        type: boolean
        default: false
    outputs:
      artifact_name:
        description: Prepared Pages artifact name
        value: ${{ jobs.build.outputs.artifact_name }}

permissions:
  actions: write
  contents: read
  pages: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
      pages: read
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    env:
      PAGES_MEDIA_ORIGIN: https://edmund-public-media.edmundeducation.workers.dev

    steps:
      - name: Reclaim runner disk for the website repository
        if: ${{ !contains(inputs.release_tags, '[fast-deploy]') || contains(inputs.release_tags, '[full-artifact]') || contains(inputs.release_tags, '[catalog-contract-release]') || contains(inputs.release_tags, '[writing-preview-release]') }}
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf -- \
            /usr/local/lib/android/sdk \
            /usr/share/dotnet \
            /opt/ghc
          df -h /

      - name: Checkout complete repository
        if: ${{ !contains(inputs.release_tags, '[fast-deploy]') || contains(inputs.release_tags, '[full-artifact]') || contains(inputs.release_tags, '[catalog-contract-release]') || contains(inputs.release_tags, '[writing-preview-release]') }}
        uses: actions/checkout@v6

      - name: Fetch focused release files without R2-backed source trees
        if: ${{ contains(inputs.release_tags, '[fast-deploy]') && !contains(inputs.release_tags, '[full-artifact]') && !contains(inputs.release_tags, '[catalog-contract-release]') && !contains(inputs.release_tags, '[writing-preview-release]') }}
        shell: bash
        env:
          RELEASE_BASE: ${{ inputs.base_sha }}
          RELEASE_TAGS: ${{ inputs.release_tags }}
        run: |
          set -euo pipefail
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config core.sparseCheckout true
          git config core.sparseCheckoutCone false
          git config remote.origin.promisor true
          git config remote.origin.partialclonefilter blob:none
          cat > .git/info/sparse-checkout <<'PATTERNS'
          /*
          !/*/
          !/flashcards-audio-manifest.js
          !/flashcards-core-data.js
          !/flashcards-*-data.js
          !/common-expression-system-imported-data.js
          !/idiom-compass-*-curation.js
          !/idiom-system-data.js
          !/phrasal-verb-system-data.js
          !/sentence-structure-lessons-*.js
          !/speaking-part*-audio-manifest.js
          !/speaking-system-part3-data.js
          !/writing-audio*.js
          !/writing-practice-*-data.js
          !/writing-submission-reference-data.mjs
          !/*.gif
          !/*.png
          /.github/workflows/
          /paper3/
          /tools/*
          !/tools/*/
          /tools/email-qa/
          /tools/advanced-native-bulk/
          /professional-english/index.html
          /professional-english/recall.html
          /workers/edmund-site-assets/src/site-pack-index-v1.json
          /workers/edmund-site-assets/src/eddy-pack-index-v1.json
          /workers/edmund-site-assets/src/flashcard-pack-index-v1.json
          PATTERNS

          git -c protocol.version=2 fetch --no-tags --depth=100 --filter=blob:none origin "${GITHUB_SHA}"
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "${RELEASE_BASE}"
          git merge-base --is-ancestor "${RELEASE_BASE}" "${GITHUB_SHA}"
          git diff --name-only "${RELEASE_BASE}" "${GITHUB_SHA}" > /tmp/pages-fast-checkout-paths.txt

          case "${RELEASE_TAGS}" in
            *'[error-id-release]'*|*'[grammar-release]'*)
              cat >> .git/info/sparse-checkout <<'PATTERNS'
          /course-materials/error-identifier/
          /course-materials/grammar/
          /grammar-eddy-dialogues/
          /supabase/
          PATTERNS
              ;;&
            *'[classroom-release]'*)
              echo '/supabase/' >> .git/info/sparse-checkout
              ;;&
          esac

          case "${RELEASE_TAGS}" in
            *'[release-gate-repair]'*)
              echo '/supabase/migrations/20260827103531_eddie_farm_points.sql' >> .git/info/sparse-checkout
              ;;
          esac

          case "${RELEASE_TAGS}" in
            *'[homework-release]'*)
              cat >> .git/info/sparse-checkout <<'PATTERNS'
          /homework-resource-catalog.mjs
          /assets/model-essays/
          /assets/schedule/
          /homework-eddy/
          /junior-exam-prep/
          /polysemy-lab/
          !/polysemy-lab/audio/
          /synonyms/
          !/synonyms/audio/
          !/synonyms/lesson-audio/
          !/synonyms/source/
          /workers/schedule-system/src/
          /supabase/migrations/
          PATTERNS
              ;;
          esac
          case "${RELEASE_TAGS}" in
            *'[country-spelling-release]'*)
              cat >> .git/info/sparse-checkout <<'PATTERNS'
          /country-name-spelling-audio/
          /country-name-spelling-flags/
          /country-name-spelling-map/
          /supabase/migrations/20261104135806_country_spelling_account_progress.sql
          PATTERNS
              ;;
          esac
          case "${RELEASE_TAGS}" in
            *'[phrasal-release]'*)
              echo '/phrasal-verb-system-data.js' >> .git/info/sparse-checkout
              ;;&
            *'[sentence-release]'*)
              echo '/sentence-structure-lessons-5-345.js' >> .git/info/sparse-checkout
              ;;&
            *'[idiom-release]'*)
              cat >> .git/info/sparse-checkout <<'PATTERNS'
          /idiom-system-data.js
          /idiom-compass-*-curation.js
          PATTERNS
              ;;&
            *'[speaking-release]'*)
              cat >> .git/info/sparse-checkout <<'PATTERNS'
          /speaking-system-part3-data.js
          /speaking-part*-audio-manifest.js
          PATTERNS
              ;;&
          esac
          case "${RELEASE_TAGS}" in
            *'[writing-release]'*)
              cat >> .git/info/sparse-checkout <<'PATTERNS'
          /dse-practical-writing-art/
          /assets/dse-practical-writing/
          /assets/writing-practice/audio/edmund-neural/v5/
          /essay-memory-lessons/
          /essay-memory-support/
          /grammar-corpus/corpus-v1.json
          /speaking-system-part3-data.js
          /polysemy-lab/
          !/polysemy-lab/audio/
          /synonyms/
          !/synonyms/audio/
          !/synonyms/lesson-audio/
          !/synonyms/source/
          /writing-audio/
          /writing-audio*.js
          /writing-practice-*-data.js
          /writing-submission-reference-data.mjs
          /supabase/functions/writing-submission-proxy/
          /supabase/migrations/20260901110327_writing_submission_synonym_table_layout.sql
          /supabase/migrations/20260831013832_writing_submission_admin_proxy_active_student_hotfix.sql
          /workers/writing-submission/
          PATTERNS
              ;;
          esac
          case "${RELEASE_TAGS}" in
            *'[listening-types-release]'*)
              cat >> .git/info/sparse-checkout <<'PATTERNS'
          /tools/listening/
          /workers/edmund-audio/src/index.js
          PATTERNS
              ;;
          esac
          case "${RELEASE_TAGS}" in
            *'[listening-search-release]'*|*'[listening-release]'*)
              printf '%s\n' '/tools/listening/' '/assets/dse-listening/*/guide.json' '/assets/listening/practices/' '/assets/listening/search/' >> .git/info/sparse-checkout
              ;;
          esac
          case "${RELEASE_TAGS}" in
            *'[paper3-release]'*)
              cat >> .git/info/sparse-checkout <<'PATTERNS'
          /paper3/2023-b2/curation/
          /paper3/2025-b2/index.html
          /paper3/2025-b2/reader.js
          /paper3/2025-b2/sentence-analysis.js
          /paper3/2025-b2/listening-notes.js
          /paper3/2025-b2/super-curation-highlights.js
          /paper3/2025-b2/super-curation.js
          /tools/paper3/
          PATTERNS
              ;;
          esac
          case "${RELEASE_TAGS}" in
            *'[listening-release]'*)
              echo '/tools/listening/' >> .git/info/sparse-checkout
              ;;&
            *'[song-release]'*)
              printf '%s\n' \
                '/tools/song-content/' \
                '/tools/song-editorial/' \
                '/supabase/migrations/*_song_*.sql' \
                >> .git/info/sparse-checkout
              ;;&
            *'[writing-release]'*)
              echo '/tools/grammar-detector-v2/' >> .git/info/sparse-checkout
              ;;&
          esac

          case "${RELEASE_TAGS}" in
            *'[practical-writing-release]'*)
              printf '%s\n' '/dse-practical-writing-art/' '/assets/dse-practical-writing/' >> .git/info/sparse-checkout
              ;;
          esac
          case "${RELEASE_TAGS}" in
            *'[listening-release]'*)
              echo '/assets/listening/' >> .git/info/sparse-checkout
              ;;
          esac
          case "${RELEASE_TAGS}" in
            *'[flashcard-release]'*|*'[reading-release]'*|*'[writing-release]'*)
              cat >> .git/info/sparse-checkout <<'PATTERNS'
          /flashcards-audio-manifest.js
          /flashcards-core-data.js
          /flashcards-*-data.js
          /workers/edmund-audio/
          PATTERNS
              ;;
          esac

          case "${RELEASE_TAGS}" in
            *'[flashcard-release]'*)
              cat >> .git/info/sparse-checkout <<'PATTERNS'
          /flashcard-custom-audio/
          /junior-exam-prep/
          /polysemy-lab/
          !/polysemy-lab/audio/
          /synonyms/
          !/synonyms/audio/
          !/synonyms/lesson-audio/
          !/synonyms/source/
          PATTERNS
              ;;
          esac

          case "${RELEASE_TAGS}" in
            *'[reading-release]'*)
              cat >> .git/info/sparse-checkout <<'PATTERNS'
          /assets/ielts-reading/
          /assets/reading-comprehension/
          PATTERNS
              ;;
          esac

          case "${RELEASE_TAGS}" in
            *'[common-expression-release]'*)
              echo '/common-expression-system-imported-data.js' >> .git/info/sparse-checkout
              ;;&
            *'[polysemy-release]'*)
              cat >> .git/info/sparse-checkout <<'PATTERNS'
          /polysemy-lab/
          !/polysemy-lab/audio/
          /assets/polysemy-lab/
          /supabase/migrations/20261024162554_polysemy_fair_choices.sql
          /supabase/migrations/20261024163842_polysemy_legacy_choices_separate.sql
          /supabase/migrations/20261028045315_polysemy_shared_answer_feedback.sql
          PATTERNS
              ;;&
            *'[synonyms-release]'*)
              cat >> .git/info/sparse-checkout <<'PATTERNS'
          /synonyms/
          !/synonyms/audio/
          !/synonyms/lesson-audio/
          !/synonyms/source/
          PATTERNS
              ;;&
            *'[irregular-release]'*)
              echo '/irregular-verbs/' >> .git/info/sparse-checkout
              ;;&
            *'[native-release]'*)
              printf '%s\n' \
                '/natural-english/' \
                '/course-materials/advanced-native/' \
                '/tools/advanced-native-bulk/' \
                '/supabase/migrations/20261014222500_advanced_native_progress_compatibility.sql' \
                '/supabase/migrations/20261015112057_advanced_native_lessons_06_10.sql' \
                >> .git/info/sparse-checkout
              ;;&
            *'[junior-release]'*)
              printf '%s\n' '/junior-exam-prep/' '/junior-quiz-review/' >> .git/info/sparse-checkout
              ;;&
            *'[news-release]'*)
              printf '%s\n' '/news-discussion/' '/policy-discussion/' >> .git/info/sparse-checkout
              ;;&
            *'[dse-arguments-release]'*)
              echo '/dse-argument-bank/' >> .git/info/sparse-checkout
              ;;&
            *'[chart-release]'*)
              echo '/ielts-chart-teaching/' >> .git/info/sparse-checkout
              ;;&
            *'[downloads-release]'*)
              printf '%s\n' '/workers/model-essay-downloads/' '/flashcards-core-data.js' '/flashcards-ielts-writing*-data.js' '/writing-practice*-data.js' >> .git/info/sparse-checkout
              ;;&
            *'[progress-release]'*)
              echo '/workers/student-progress/' >> .git/info/sparse-checkout
              ;;&
            *'[membership-release]'*)
              printf '%s\n' \
                '/workers/membership/' \
                '/supabase/migrations/20260827101941_membership_billing_foundation.sql' \
                >> .git/info/sparse-checkout
              ;;&
            *'[video-class-release]'*)
              echo '/workers/video-class/' >> .git/info/sparse-checkout
              ;;&
            *'[news-reader-release]'*)
              echo '/news-reader/' >> .git/info/sparse-checkout
              ;;&
            *'[speech-curation-release]'*)
              echo '/speech-curation-assets/churchill-sentence-timing-v2.json' >> .git/info/sparse-checkout
              ;;&
          esac

          if [[ "${RELEASE_TAGS}" == *'[shared-header-release]'* ]]; then
            echo '/**/*.html' >> .git/info/sparse-checkout
          fi

          while IFS= read -r changed_path; do
            test -n "${changed_path}" || continue
            case "${changed_path}" in
              /*|../*|*/../*) echo "Unsafe release path: ${changed_path}" >&2; exit 1 ;;
            esac
            printf '/%s\n' "${changed_path}" >> .git/info/sparse-checkout
          done < /tmp/pages-fast-checkout-paths.txt
          git show "${GITHUB_SHA}:tools/pages-validation-paths" >> .git/info/sparse-checkout
          git checkout -q --detach "${GITHUB_SHA}"
          ruby tools/check-pages-build-environment.rb --check-inputs
          test -s tools/pages-release-scopes.json
          test -s tools/prepare-pages-incremental.py
          test -s workers/edmund-site-assets/src/site-pack-index-v1.json

      - name: Check generated manifests and release contracts before long suites
        if: ${{ !contains(inputs.release_tags, '[fast-deploy]') }}
        run: bash tools/pages-early-checks.sh

      - name: Validate shared header across portals
        if: ${{ !contains(inputs.release_tags, '[fast-deploy]') || contains(inputs.release_tags, '[flashcard-release]') || contains(inputs.release_tags, '[shared-header-release]') }}
        run: node tools/test-shared-mobile-header.mjs

      - name: Check song exercise quality
        if: ${{ !contains(inputs.release_tags, '[fast-deploy]') || contains(inputs.release_tags, '[song-release]') }}
        run: |
          node tools/check-song-quality.mjs
          node tools/test-song-route.mjs
          node tools/test-song-editorial.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Validate complete learning-system release coverage
        run: python3 -m unittest tools/test-pages-system-release-map.py

      - name: Classify Pages artifact preparation
        id: preparation
        env:
          FOCUSED: ${{ contains(inputs.release_tags, '[fast-deploy]') && !contains(inputs.release_tags, '[full-artifact]') }}
          CUTOVER: ${{ vars.PAGES_R2_CUTOVER }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tools/test-prepare-pages-incremental.py
          snapshot_commit=$(git ls-remote origin refs/heads/pages-snapshot | cut -f1)
          if [[ -z "${snapshot_commit}" ]]; then
            echo "mode=full" >> "${GITHUB_OUTPUT}"
            echo "base_sha=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "${snapshot_commit}"
          snapshot_sha=$(git show "${snapshot_commit}:.source-sha")
          git -c protocol.version=2 fetch --no-tags --depth=100 --filter=blob:none origin "${GITHUB_SHA}"
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "${snapshot_sha}"

          mode=full
          snapshot_origin=$(git show "${snapshot_commit}:pages-media-origin.txt" 2>/dev/null || true)
          expected_origin=
          if [[ "${CUTOVER}" == true ]]; then expected_origin="${PAGES_MEDIA_ORIGIN}"; fi
          if [[ "${snapshot_origin}" == "${expected_origin}" && "${FOCUSED}" == true ]] && \
              git merge-base --is-ancestor "${snapshot_sha}" "${GITHUB_SHA}"; then
            mode=$(python3 tools/prepare-pages-incremental.py classify \
              --base "${snapshot_sha}" \
              --target "${GITHUB_SHA}")
          fi
          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"
          echo "snapshot_commit=${snapshot_commit}" >> "${GITHUB_OUTPUT}"
          echo "base_sha=${snapshot_sha}" >> "${GITHUB_OUTPUT}"
          echo "Pages artifact preparation: ${mode} from ${snapshot_sha}"

      - name: Validate character coin fast release
        if: ${{ contains(inputs.release_tags, '[fast-deploy]') && contains(inputs.release_tags, '[coin-release]') }}
        run: |
          node --test tools/test-character-coins.mjs tools/test-eddie-farm.mjs tools/test-eddie-farm-i18n.mjs
          node --check eddie-farm.js
          node --check idiom-system.js
          node --check shared-system-nav.js
          node --check shared-companion.mjs

      - name: Verify affected audio contracts with the complete source
        if: ${{ contains(inputs.release_tags, '[audio-contract-release]') || (contains(inputs.release_tags, '[full-artifact]') && contains(inputs.release_tags, '[release-gate-repair]')) }}
        run: |
          node tools/test-student-audio-fallbacks.mjs
          node tools/test-business-concepts-book1-flashcards.mjs
          node tools/test-flashcard-expansion-20260801-ui.mjs
          node tools/test-government-civics-book1-flashcards.mjs
          node tools/test-government-civics-book2-flashcards.mjs
          node tools/test-government-civics-book3-flashcards.mjs
          node tools/test-hkfsd-concept-vocabulary-book1-flashcards.mjs
          node tools/test-hkfsd-incident-report-flashcards.mjs
          node tools/test-hkfsd-incident-report-3.mjs
          node tools/test-hkfsd-incident-report-writing.mjs
          node tools/test-ielts-writing-task1-audio.mjs
          node tools/test-dse-writing-part-b-audio.mjs

      - name: Validate focused release-gate repair
        if: ${{ contains(inputs.release_tags, '[fast-deploy]') && contains(inputs.release_tags, '[release-gate-repair]') }}
        run: |
          run_gate() {
            local label="$1"
            shift
            if ! "$@"; then
              echo "::error title=Release gate command failed::${label}"
              return 1
            fi
          }
          run_gate 'Eddie Farm repair contract' node --test tools/test-eddie-farm.mjs
          # These commits repair assertions, not the underlying product corpus. Validate
          # their syntax and the production cache contract here; real
          # Flashcard/Reading releases still run the complete corpus and audio
          # checks in their own focused gates.
          for repair_test in \
            tools/test-ielts-reading-passage1-flashcards.mjs \
            tools/test-ielts-reading-passage2-flashcards.mjs \
            tools/test-business-concepts-book1-flashcards.mjs \
            tools/test-flashcard-expansion-20260801-ui.mjs \
            tools/test-government-civics-book1-flashcards.mjs \
            tools/test-government-civics-book2-flashcards.mjs \
            tools/test-government-civics-book3-flashcards.mjs \
            tools/test-hkfsd-concept-vocabulary-book1-flashcards.mjs \
            tools/test-hkfsd-incident-report-flashcards.mjs \
            tools/test-hkfsd-incident-report-3.mjs \
            tools/test-hkfsd-incident-report-writing.mjs \
            tools/test-ielts-writing-task1-audio.mjs \
            tools/test-dse-writing-part-b-audio.mjs \
            tools/load-verified-writing-audio.mjs
          do
            run_gate "Syntax: ${repair_test}" node --check "${repair_test}"
          done
          run_gate 'Current verified Flashcard audio cache pin' \
            grep -Fq 'flashcards-audio-manifest.js?v=edmund-neural-v1-20261113-jayden-test1' flashcards.html

      - name: Validate closet fast release
        if: ${{ contains(inputs.release_tags, '[fast-deploy]') && !contains(inputs.release_tags, '[shared-header-release]') && !contains(inputs.release_tags, '[infrastructure-release]') && !contains(inputs.release_tags, '[catalog-contract-release]') && !contains(inputs.release_tags, '[listening-search-release]') && !contains(inputs.release_tags, '[classroom-release]') && !contains(inputs.release_tags, '[flashcard-release]') && !contains(inputs.release_tags, '[sentence-release]') && !contains(inputs.release_tags, '[phrasal-release]') && !contains(inputs.release_tags, '[proverb-release]') && !contains(inputs.release_tags, '[idiom-release]') && !contains(inputs.release_tags, '[speaking-release]') && !contains(inputs.release_tags, '[writing-release]') && !contains(inputs.release_tags, '[practical-writing-release]') && !contains(inputs.release_tags, '[polysemy-release]') && !contains(inputs.release_tags, '[synonyms-release]') && !contains(inputs.release_tags, '[grammar-release]') && !contains(inputs.release_tags, '[native-release]') && !contains(inputs.release_tags, '[italian-release]') && !contains(inputs.release_tags, '[homework-release]') && !contains(inputs.release_tags, '[reading-release]') && !contains(inputs.release_tags, '[listening-release]') && !contains(inputs.release_tags, '[listening-types-release]') && !contains(inputs.release_tags, '[professional-release]') && !contains(inputs.release_tags, '[paper3-release]') && !contains(inputs.release_tags, '[paper3-analysis-release]') && !contains(inputs.release_tags, '[junior-release]') && !contains(inputs.release_tags, '[irregular-release]') && !contains(inputs.release_tags, '[news-release]') && !contains(inputs.release_tags, '[dse-arguments-release]') && !contains(inputs.release_tags, '[error-id-release]') && !contains(inputs.release_tags, '[coin-release]') && !contains(inputs.release_tags, '[song-release]') && !contains(inputs.release_tags, '[writing-preview-release]') && !contains(inputs.release_tags, '[chart-release]') && !contains(inputs.release_tags, '[homepage-rollback]') && !contains(inputs.release_tags, '[homepage-release]') && !contains(inputs.release_tags, '[country-spelling-release]') && !contains(inputs.release_tags, '[literary-release]') && !contains(inputs.release_tags, '[release-gate-repair]') && !contains(inputs.release_tags, '[downloads-release]') && !contains(inputs.release_tags, '[parent-release]') && !contains(inputs.release_tags, '[progress-release]') && !contains(inputs.release_tags, '[common-expression-release]') && !contains(inputs.release_tags, '[learning-portal-release]') && !contains(inputs.release_tags, '[bookmark-release]') && !contains(inputs.release_tags, '[execution-release]') && !contains(inputs.release_tags, '[membership-release]') && !contains(inputs.release_tags, '[background-music-release]') && !contains(inputs.release_tags, '[question-collection-release]') && !contains(inputs.release_tags, '[accent-release]') && !contains(inputs.release_tags, '[speech-curation-release]') && !contains(inputs.release_tags, '[chip-course-release]') && !contains(inputs.release_tags, '[news-reader-release]') && !contains(inputs.release_tags, '[video-class-release]') }}
        run: |
          node tools/test-common-expression-closet.mjs
          node --test tools/test-eddy-cosmetics.mjs
          node tools/test-wardrobe-visual-acceptance.mjs

      - name: Validate focused classroom synchronization release
        if: ${{ contains(inputs.release_tags, '[classroom-release]') }}
        run: |
          npm ci --prefix tools/email-qa --ignore-scripts
          node --check classroom-live-sync.mjs
          node --check synonyms/app.mjs
          node --check natural-english/app.mjs
          node --check common-expression-system.js
          node --check writing-submission.js
          node --check sentence-structure.js
          node --check idiom-system.js
          node --check proverb-system.js
          node --check phrasal-verb-system.js
          node tools/test-flashcard-attempt-sync-isolation.mjs
          node tools/test-classroom-live-sync.mjs
          node tools/test-classroom-live-sync-sql.mjs
          node tools/test-sentence-structure-system.mjs
          node tools/test-idiom-system-runtime.mjs
          node tools/test-proverb-system.mjs
          node tools/test-phrasal-verb-system.mjs
          node tools/test-phrasal-verb-six-choice.mjs
          node tools/test-flashcard-state-integrity.mjs
          node tools/build-flashcard-lazy-startup.mjs --check
          node tools/test-writing-synonyms.mjs
          node tools/test-advanced-native.mjs

      - name: Validate focused Pages infrastructure release
        if: ${{ contains(inputs.release_tags, '[infrastructure-release]') }}
