      - name: Validate all six Common Expression portals, lessons and persistence contracts
        if: ${{ !contains(inputs.release_tags, '[fast-deploy]') }}
        run: node --test tools/test-common-expression-system.mjs tools/test-common-expression-map.mjs tools/test-common-expression-garden.mjs tools/test-common-expression-coast.mjs tools/test-common-expression-airport.mjs tools/test-common-expression-train.mjs tools/test-common-expression-dining.mjs tools/test-common-expression-poker.mjs tools/test-common-expression-pool.mjs tools/test-common-expression-lounge.mjs
      - name: Validate rhetorical-writing blueprint map
        if: ${{ !contains(inputs.release_tags, '[fast-deploy]') }}
        run: node tools/test-common-expression-blueprint.mjs

      - name: Validate DSE Paper 3 portal, shared login and imported analysis data
        if: ${{ !contains(inputs.release_tags, '[fast-deploy]') }}
        run: |
